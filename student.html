<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بوابة الطالب — مدارس أمين الرضا</title>
  <link rel="stylesheet" href="assets/amin.css?v=20260706-5">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="assets/i18n.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/amin-logo-small.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أمين الرضا">
</head>
<body data-portal="student">
<a class="skip-link" href="#mainContent">تخطي إلى المحتوى</a>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">ط</div>
      <div>
        <h1>بوابة الطالب</h1>
        <small>درجات · حضور · واجبات</small>
      </div>
    </div>
    
    <div class="profile-mini">
      <div class="avatar">🎒</div>
      <div>
        <b id="profileName">...</b>
        <small id="profileRole">...</small>
      </div>
    </div>

    <nav class="nav">
      <button onclick="location.href='portal.html'">🏛️ البوابة الموحدة</button>
      <button data-view="overview" class="active">🏠 الرئيسية</button>
      <button data-view="grades">📊 درجاتي</button>
      <button data-view="attendance">📋 حضوري</button>
      <button data-view="homeworks">📚 واجباتي</button>
      <button data-view="exams">📝 اختباراتي</button>
      <button data-view="behavior">🌟 سلوكي</button>
      <button data-view="achievements">🏆 إنجازاتي</button>
      <button onclick="location.href='online-exams.html'">💻 الاختبارات الإلكترونية</button>
      <button onclick="location.href='student-homeworks.html'">✏️ تسليم واجب</button>
      <button onclick="location.href='smart-calendar.html'">📅 التقويم</button>
      <button onclick="location.href='notifications.html'">🔔 الإشعارات</button>
    </nav>

    <div class="side-footer">
      <button id="logoutBtn" class="btn red block">تسجيل الخروج</button>
    </div>
  </aside>

  <main class="main" id="mainContent" tabindex="-1">
    <header class="topbar">
      <button class="btn mobile-menu" id="mobileMenuBtn">☰</button>
      <h2>بوابة الطالب</h2>
      <div class="top-actions"><button id="printBtn" class="btn">طباعة</button></div>
    </header>

    <section id="view-overview" class="view active"></section>
    <section id="view-grades" class="view"></section>
    <section id="view-attendance" class="view"></section>
    <section id="view-homeworks" class="view"></section>
    <section id="view-exams" class="view"></section>
    <section id="view-behavior" class="view"></section>
    <section id="view-achievements" class="view"></section>
  </main>
</div>

<div id="toast" class="toast"></div>

<script src="libs/supabase.min.js"></script>
<script src="libs/calendar-lib.js"></script>
<script src="assets/config.js"></script>
<script src="assets/platform-modules.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/amin-i18n-v2.js"></script>
<script src="assets/i18n-radical.js"></script>
<script src="assets/finance-runtime.js?v=20260707-1"></script>

<script>
(function(){
  'use strict';

  const SCHOOL_PHONE = '+9647700000000';
  const SCHOOL_NAME = 'مدرسة أمين الرضا';
  const SCHOOL_LOGO = '🎓';

  function $(s, r){r=r||document;return r.querySelector(s)}
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
  function num(v){var n=Number(v);return Number.isFinite(n)?n:0}
  const RT = function(){ return window.FinanceRuntime || {}; };
  function money(v){return num(v).toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0})}
  function dualDate(v){return RT().dualDate ? RT().dualDate(String(v||'').slice(0,10)) : String(v||'').slice(0,10)}
  function emptyState(title, hint, actions){ return '<div class="finance-empty"><b>'+esc(title)+'</b><small>'+esc(hint||'')+'</small>'+(actions?'<div class="empty-actions">'+actions+'</div>':'')+'</div>'; }
  function printEmptyMessage(title, hint){ return '<div style="text-align:center;padding:28px;border:1px dashed #cbd5e1;border-radius:14px;background:#f8fafc;color:#475569;"><b style="display:block;color:#0B6E4F;margin-bottom:8px;">'+esc(title)+'</b><span>'+esc(hint||'')+'</span></div>'; }
  function quickLinksBar(){ return '<div class="finance-quick-links no-print"><button class="btn blue" onclick="StudentPortal.showView(\'homeworks\')">واجباتي</button><button class="btn" onclick="StudentPortal.showView(\'grades\')">درجاتي</button><button class="btn" onclick="location.href=\'student-homeworks.html\'">تسليم واجب</button><button class="btn gold" onclick="location.href=\'smart-calendar.html\'">التقويم</button></div>'; }
  
  let sb = null;
  let ME = null;
  let STUDENT = null;
  let DATA = {
    attendance: [],
    grades: [],
    behavior: [],
    homeworks: [],
    exams: [],
    achievements: [],
    notifications: []
  };
  let SUBJECTS_MAP = {};

  function cfg() { return window.AMIN_CONFIG || {}; }
  
  function client() {
    if(sb) return sb;
    if(!window.supabase) throw new Error('Supabase library not loaded');
    sb = window.supabase.createClient(
      cfg().supabaseUrl, 
      cfg().supabaseAnonKey, 
      {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storageKey:(cfg().authStorageKey||'amin-ovcjzsrqqgjsbqswtkro-auth-v2')}}
    );
    return sb;
  }

  function toast(title, msg, type) {
    const t = $('#toast');
    if(!t) return;
    t.innerHTML = '<b>'+esc(title)+'</b><br><span class="muted">'+esc(msg||'')+'</span>';
    t.className = 'toast show ' + (type||'');
    clearTimeout(t._to);
    t._to = setTimeout(function(){t.classList.remove('show')}, 4000);
  }

  function dueText(d) {
    if(!d) return 'بدون موعد';
    const x = new Date(String(d).slice(0,10)+'T00:00:00');
    const today = new Date();
    today.setHours(0,0,0,0);
    const diff = Math.round((x - today)/86400000);
    if(diff < 0) return 'متأخر ' + Math.abs(diff) + ' يوم';
    if(diff === 0) return 'اليوم';
    if(diff === 1) return 'غداً';
    if(diff <= 7) return 'بعد ' + diff + ' يوم';
    return new Date(d).toLocaleDateString('ar-IQ');
  }

  async function init() {
    try {
      const c = client();
      
      const sessionRes = await c.auth.getSession();
      const session = sessionRes.data.session;
      if(!session) {
        location.href = 'index.html';
        return;
      }
      console.log('✅ Session OK:', session.user.email);

      const userRes = await c.from('users').select('*').eq('id', session.user.id).maybeSingle();
      if(userRes.error || !userRes.data) {
        toast('خطأ', 'تعذر تحميل بيانات الحساب', 'red');
        return;
      }
      ME = userRes.data;
      window.ME = ME;
      console.log('✅ User loaded:', ME.name);

      $('#profileName').textContent = ME.name || ME.email || 'طالب';
      $('#profileRole').textContent = 'طالب';

      $('#logoutBtn').onclick = async function() {
        await c.auth.signOut({scope:'local'}).catch(function(){});
        location.href = 'index.html';
      };

      const mobileBtn = $('#mobileMenuBtn');
      if(mobileBtn) mobileBtn.addEventListener('click', function() {
        const sb = $('#sidebar');
        if(sb) sb.classList.toggle('open');
      });

      const navBtns = document.querySelectorAll('.nav button[data-view]');
      navBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          const view = btn.dataset.view;
          showView(view);
          navBtns.forEach(function(b) { b.classList.toggle('active', b === btn); });
          const sb = $('#sidebar');
          if(sb) sb.classList.remove('open');
        });
      });

      // جلب بيانات الطالب
      const studentRes = await c.from('students').select('*').eq('user_id', ME.id).maybeSingle();
      if(studentRes.error || !studentRes.data) {
        $('#view-overview').innerHTML = '<div class="empty" style="text-align:center;padding:60px;"><span class="amin-3d-ico-auto" data-size="64" data-emoji="⚠️" style="display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;">⚠️</span><h3>لم يتم العثور على بياناتك كطالب</h3><p style="color:#999;">يرجى مراجعة الإدارة.</p></div>';
        return;
      }
      STUDENT = studentRes.data;
      window.STUDENT = STUDENT;

      await loadSubjects();
      await loadAllData();
      renderOverview();

    } catch(e) {
      console.error('❌ Init error:', e);
      toast('خطأ', e.message, 'red');
    }
  }

  async function loadSubjects() {
    try {
      const res = await client().from('subjects').select('id, name');
      if(res.data) {
        res.data.forEach(function(s) {
          SUBJECTS_MAP[s.id] = s.name;
        });
      }
    } catch(e) {}
  }

  function getSubjectName(id) {
    if(!id) return 'مادة';
    return SUBJECTS_MAP[id] || 'مادة';
  }

  async function loadAllData() {
    const c = client();
    const sid = STUDENT.id;
    
    try {
      const results = await Promise.all([
        c.from('attendance').select('*').eq('student_id', sid).order('date', {ascending: false}).limit(100),
        c.from('grades').select('*').eq('student_id', sid),
        c.from('behavior_records').select('*').eq('student_id', sid).order('created_at', {ascending: false}).limit(50),
        c.from('v_student_homeworks').select('*').order('due_date', {ascending: true}).limit(50).then(function(r){ return r; }).catch(function(){ return {data: []}; }),
        c.from('online_exams').select('*').order('starts_at', {ascending: true}).limit(20).then(function(r){ return r; }).catch(function(){ return {data: []}; }),
        c.from('v_achievement_awards_detailed').select('*').or('recipient_student_id.eq.'+sid+',recipient_user_id.eq.'+ME.id).order('awarded_at', {ascending: false}).limit(30).then(function(r){ return r; }).catch(function(){ return {data: []}; }),
        c.from('school_notifications').select('*').eq('recipient_user_id', ME.id).order('created_at', {ascending: false}).limit(10).then(function(r){ return r; }).catch(function(){ return {data: []}; })
      ]);
      
      DATA.attendance = results[0].data || [];
      DATA.grades = results[1].data || [];
      DATA.behavior = results[2].data || [];
      DATA.homeworks = results[3].data || [];
      DATA.exams = results[4].data || [];
      DATA.achievements = results[5].data || [];
      DATA.notifications = results[6].data || [];
      
      console.log('✅ Data loaded:', DATA);
    } catch(e) {
      console.error('Data load error:', e);
    }
  }

  function getSmartAlerts() {
    const alerts = [];
    
    // غياب
    const absent = DATA.attendance.filter(function(a){ return a.status === 'absent'; }).length;
    const total = DATA.attendance.length;
    if(total > 0) {
      const rate = (absent/total) * 100;
      if(rate > 20) {
        alerts.push({type:'danger',icon:'⚠️',title:'غيابك مرتفع',message:'نسبة الغياب '+Math.round(rate)+'% - حافظ على حضورك!'});
      }
    }
    
    // واجبات قريبة
    const today = new Date();
    const upcomingHw = DATA.homeworks.filter(function(h){
      if(h.status === 'submitted') return false;
      const due = new Date(h.due_date || h.due_at);
      const diff = (due - today) / (1000*60*60*24);
      return diff >= 0 && diff <= 3;
    });
    if(upcomingHw.length > 0) {
      alerts.push({type:'warning',icon:'📚',title:'واجبات قريبة',message:upcomingHw.length+' واجب خلال 3 أيام'});
    }
    
    // واجبات متأخرة
    const overdueHw = DATA.homeworks.filter(function(h){
      if(h.status === 'submitted') return false;
      const due = new Date(h.due_date || h.due_at);
      return due < today;
    });
    if(overdueHw.length > 0) {
      alerts.push({type:'danger',icon:'❗',title:'واجبات متأخرة',message:overdueHw.length+' واجب لم تسلّمه بعد'});
    }
    
    // اختبارات قادمة
    const upcomingExams = DATA.exams.filter(function(e){
      const start = new Date(e.starts_at || e.start_at);
      const diff = (start - today) / (1000*60*60*24);
      return diff >= 0 && diff <= 7;
    });
    if(upcomingExams.length > 0) {
      alerts.push({type:'info',icon:'📝',title:'اختبارات قادمة',message:upcomingExams.length+' اختبار هذا الأسبوع - استعد!'});
    }
    
    // درجات منخفضة
    const lowGrades = DATA.grades.filter(function(g){ return num(g.score || g.grade || g.mark) < 60; });
    if(lowGrades.length > 0) {
      alerts.push({type:'warning',icon:'📉',title:'درجات تحتاج تحسين',message:lowGrades.length+' مواد بدرجات أقل من 60'});
    }
    
    return alerts;
  }

  function showView(viewId) {
    document.querySelectorAll('.view').forEach(function(v) {
      v.classList.toggle('active', v.id === 'view-' + viewId);
    });
    
    if(viewId === 'overview') renderOverview();
    else if(viewId === 'grades') renderGrades();
    else if(viewId === 'attendance') renderAttendance();
    else if(viewId === 'homeworks') renderHomeworks();
    else if(viewId === 'exams') renderExams();
    else if(viewId === 'behavior') renderBehavior();
    else if(viewId === 'achievements') renderAchievements();
  }

  function renderOverview() {
    const container = $('#view-overview');
    const alerts = getSmartAlerts();
    
    const present = DATA.attendance.filter(function(a){ return a.status === 'present'; }).length;
    const absent = DATA.attendance.filter(function(a){ return a.status === 'absent'; }).length;
    const total = DATA.attendance.length;
    const attRate = total ? Math.round((present/total)*100) : 0;
    
    const gradesAvg = DATA.grades.length 
      ? Math.round(DATA.grades.reduce(function(s,g){ return s + num(g.score || g.grade || g.mark); }, 0) / DATA.grades.length)
      : 0;
    
    const totalPoints = DATA.behavior.reduce(function(s,b){ return s + num(b.points || 0); }, 0);
    const badgeCount = DATA.achievements.length;
    
    const unreadNotifs = DATA.notifications.filter(function(n){ return !n.read_at; }).length;
    
    let html = '<div class="page-head"><div><h1>أهلاً بك، '+esc(ME.name)+' 🎒</h1><p>هذا ملخص يومك الدراسي ومتابعة أدائك'+(unreadNotifs > 0 ? ' · <span class="badge red">'+unreadNotifs+' إشعار جديد</span>' : '')+'</p></div></div>';

    // الإحصائيات الرئيسية
    html += '<div class="kpis" style="margin-bottom:24px;">';
    html += '<div class="kpi green"><small>نسبة الحضور</small><b>'+attRate+'%</b></div>';
    html += '<div class="kpi gold"><small>المعدل العام</small><b>'+gradesAvg+'%</b></div>';
    html += '<div class="kpi blue"><small>نقاط السلوك</small><b>'+(totalPoints > 0 ? '+' : '')+totalPoints+'</b></div>';
    html += '<div class="kpi"><small>شاراتي</small><b>🏆 '+badgeCount+'</b></div>';
    html += '</div>';
    
    // التنبيهات الذكية
    if(alerts.length > 0) {
      html += '<div style="margin-bottom:24px;"><h3 style="margin-bottom:12px;">⚠️ تنبيهات مهمة ('+alerts.length+')</h3><div class="cards">';
      alerts.slice(0, 4).forEach(function(a) {
        const bgColor = a.type === 'danger' ? '#fee2e2' : a.type === 'warning' ? '#fef3c7' : '#dbeafe';
        const borderColor = a.type === 'danger' ? '#dc2626' : a.type === 'warning' ? '#d97706' : '#0B6E4F';
        html += '<div style="background:'+bgColor+';border-right:4px solid '+borderColor+';padding:14px;border-radius:10px;color:#333;"><div style="font-size:16px;font-weight:bold;margin-bottom:4px;">'+a.icon+' '+esc(a.title)+'</div><div style="font-size:13px;opacity:0.85;">'+esc(a.message)+'</div></div>';
      });
      html += '</div></div>';
    }
    
    // أزرار الإجراءات السريعة
    html += '<h3 style="margin-bottom:12px;">⚡ إجراءات سريعة</h3>';
    html += '<div class="cards" style="margin-bottom:24px;">';
    html += '<div onclick="StudentPortal.showView(\'homeworks\')" class="card" style="cursor:pointer;text-align:center;padding:20px"><span class="amin-3d-ico-auto" data-size="36" data-emoji="📚" style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;">📚</span><div style="font-weight:bold;margin-top:8px;">واجباتي</div></div>';
    html += '<div onclick="StudentPortal.showView(\'exams\')" class="card" style="cursor:pointer;text-align:center;padding:20px"><span class="amin-3d-ico-auto" data-size="36" data-emoji="📝" style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;">📝</span><div style="font-weight:bold;margin-top:8px;">اختباراتي</div></div>';
    html += '<div onclick="StudentPortal.showView(\'grades\')" class="card" style="cursor:pointer;text-align:center;padding:20px"><span class="amin-3d-ico-auto" data-size="36" data-emoji="📊" style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;">📊</span><div style="font-weight:bold;margin-top:8px;">درجاتي</div></div>';
    html += '<div onclick="StudentPortal.showView(\'achievements\')" class="card" style="cursor:pointer;text-align:center;padding:20px"><span class="amin-3d-ico-auto" data-size="36" data-emoji="🏆" style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;">🏆</span><div style="font-weight:bold;margin-top:8px;">شاراتي</div></div>';
    html += '</div>';
    
    // الواجبات القريبة
    if(DATA.homeworks.length > 0) {
      html += '<h3 style="margin:24px 0 12px;">📚 الواجبات القادمة</h3><div class="list">';
      DATA.homeworks.slice(0, 5).forEach(function(h) {
        const due = dueText(h.due_date || h.due_at);
        const isUrgent = due.includes('متأخر') || due === 'اليوم' || due === 'غداً';
        const badge = isUrgent ? 'red' : 'blue';
        html += '<div class="item"><div><b>'+esc(h.title || h.homework_title || 'واجب')+'</b><small>'+esc(getSubjectName(h.subject_id))+'</small></div><span class="badge '+badge+'">'+esc(due)+'</span></div>';
      });
      html += '</div>';
    }
    
    // آخر الإنجازات
    if(DATA.achievements.length > 0) {
      html += '<h3 style="margin:24px 0 12px;">🏆 آخر إنجازاتك</h3><div class="cards">';
      DATA.achievements.slice(0, 3).forEach(function(a) {
        html += '<div class="card" style="border:2px solid #f59e0b"><div class="card-body" style="text-align:center;"><span class="amin-3d-ico-auto" data-size="48" data-emoji="🏆" style="display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;">🏆</span><b style="color:#92400e;">'+esc(a.badge_title_ar || a.badge_code || 'شارة')+'</b><div style="color:#78350f;font-size:13px;margin-top:4px;">'+esc(a.awarded_at ? String(a.awarded_at).slice(0,10) : '')+'</div><div style="color:#92400e;font-weight:bold;margin-top:8px;">+'+num(a.points_awarded || 0)+' نقطة</div></div></div>';
      });
      html += '</div>';
    }
    
    container.innerHTML = html;
  }

  async function renderGrades() {
    const container = $('#view-grades');
    if (!container) return;

    try {
      const blockRes = await client().rpc('check_student_tuition_blocked', { p_student_id: ME.student_id || null });
      if (blockRes && blockRes.data && blockRes.data.blocked === true) {
        container.innerHTML = '<div class="page-head"><div><h1>📊 درجاتي</h1></div></div>' +
          '<div class="card" style="border:2px solid #B8860B;background:#fffaf0;padding:24px;text-align:center;border-radius:12px;margin:20px 0">' +
          '<div style="font-size:48px;margin-bottom:12px">🔒💵</div>' +
          '<h2 style="color:#8b0000;margin-bottom:8px">الدرجات والشهادات محجوبة مؤقتاً بسبب الأقساط المدرسية</h2>' +
          '<p style="font-size:16px;color:#333;max-width:600px;margin:0 auto 16px">' + esc(blockRes.data.message) + '</p>' +
          '<div style="background:#fff;border:1px solid #ddd;padding:12px 20px;border-radius:8px;display:inline-block;margin-bottom:16px">' +
          '<b>الأقساط المستحقة المتأخرة: </b><span class="badge red" style="font-size:14px">' + esc(blockRes.data.overdue_installments) + ' قسط</span>' +
          '</div>' +
          '<p class="muted" style="font-size:13px">يرجى مراجعة إدارة المدرسة أو القسم المالي لتسوية القسط وتفعيل ظهور كشف الدرجات فوراً.</p>' +
          '</div>';
        return;
      }
    } catch(e) {
      console.warn('Tuition check error:', e);
    }
    
    let html = '<div class="page-head" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;"><div><h1>📊 درجاتي</h1></div>';
    html += '<button class="btn" style="background:#0B6E4F;color:white;padding:10px 18px;" onclick="StudentPortal.printReport(\'grades\')">🖨️ طباعة الكشف</button>';
    html += '</div>';
    
    if(!DATA.grades.length) {
      html += emptyState('لا توجد درجات مسجلة بعد','ستظهر درجاتك هنا بعد اعتمادها من المعلم أو الإدارة.');
    } else {
      const avg = Math.round(DATA.grades.reduce(function(s,g){ return s + num(g.score || g.grade || g.mark); }, 0) / DATA.grades.length);
      const excellent = DATA.grades.filter(function(g){ return num(g.score || g.grade || g.mark) >= 85; }).length;
      const good = DATA.grades.filter(function(g){ var v=num(g.score || g.grade || g.mark); return v >= 60 && v < 85; }).length;
      const weak = DATA.grades.filter(function(g){ return num(g.score || g.grade || g.mark) < 60; }).length;
      
      html += '<div class="kpis" style="margin-bottom:20px;">';
      html += '<div class="kpi gold"><small>المعدل العام</small><b>'+avg+'%</b></div>';
      html += '<div class="kpi green"><small>ممتاز</small><b>'+excellent+'</b></div>';
      html += '<div class="kpi blue"><small>جيد</small><b>'+good+'</b></div>';
      html += '<div class="kpi red"><small>يحتاج تحسين</small><b>'+weak+'</b></div>';
      html += '</div>';
      
      html += '<div class="table-wrap"><table><thead><tr><th>المادة</th><th>الدرجة</th><th>التقييم</th><th>ملاحظة</th></tr></thead><tbody>';
      DATA.grades.forEach(function(g) {
        const score = num(g.score || g.grade || g.mark);
        const color = score >= 85 ? 'green' : score >= 60 ? 'gold' : 'red';
        const eval2 = score >= 85 ? 'ممتاز' : score >= 60 ? 'جيد' : 'يحتاج تحسين';
        html += '<tr><td>'+esc(getSubjectName(g.subject_id))+'</td><td><span class="badge '+color+'">'+score+'</span></td><td>'+eval2+'</td><td>'+esc(g.notes || g.note || '—')+'</td></tr>';
      });
      html += '</tbody></table></div>';
    }
    
    container.innerHTML = html;
  }

  function renderAttendance() {
    const container = $('#view-attendance');
    const present = DATA.attendance.filter(function(a){ return a.status === 'present'; }).length;
    const absent = DATA.attendance.filter(function(a){ return a.status === 'absent'; }).length;
    const late = DATA.attendance.filter(function(a){ return a.status === 'late'; }).length;
    
    let html = '<div class="page-head" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;"><div><h1>📋 حضوري</h1></div>';
    html += '<button class="btn" style="background:#0B6E4F;color:white;padding:10px 18px;" onclick="StudentPortal.printReport(\'attendance\')">🖨️ طباعة الكشف</button>';
    html += '</div>';
    html += '<div class="kpis" style="margin-bottom:20px;"><div class="kpi green"><small>أيام الحضور</small><b>'+present+'</b></div><div class="kpi red"><small>أيام الغياب</small><b>'+absent+'</b></div><div class="kpi gold"><small>أيام التأخير</small><b>'+late+'</b></div><div class="kpi blue"><small>الإجمالي</small><b>'+DATA.attendance.length+'</b></div></div>';
    
    if(!DATA.attendance.length) {
      html += emptyState('لا توجد سجلات حضور','سيظهر حضورك اليومي هنا بعد تسجيله من المدرسة.');
    } else {
      html += '<div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>الحالة</th><th>ملاحظة</th></tr></thead><tbody>';
      DATA.attendance.slice(0, 60).forEach(function(a) {
        const status = a.status || '—';
        const color = status === 'present' ? 'green' : status === 'absent' ? 'red' : 'gold';
        const label = status === 'present' ? 'حاضر' : status === 'absent' ? 'غائب' : status === 'late' ? 'متأخر' : status;
        html += '<tr><td>'+esc(String(a.date).slice(0,10))+'</td><td><span class="badge '+color+'">'+esc(label)+'</span></td><td>'+esc(a.note || '—')+'</td></tr>';
      });
      html += '</tbody></table></div>';
    }
    
    container.innerHTML = html;
  }

  function renderHomeworks() {
    const container = $('#view-homeworks');
    
    let html = '<div class="page-head"><div><h1>📚 واجباتي</h1></div></div>';
    
    if(!DATA.homeworks.length) {
      html += emptyState('لا توجد واجبات حالياً','عند نشر واجبات جديدة ستظهر هنا مباشرة.','<button class="btn gold" onclick="location.href=\'smart-calendar.html\'">فتح التقويم</button>');
    } else {
      const pending = DATA.homeworks.filter(function(h){ return h.status !== 'submitted'; }).length;
      const submitted = DATA.homeworks.filter(function(h){ return h.status === 'submitted'; }).length;
      
      html += '<div class="kpis" style="margin-bottom:20px;">';
      html += '<div class="kpi red"><small>غير مسلّمة</small><b>'+pending+'</b></div>';
      html += '<div class="kpi green"><small>مسلّمة</small><b>'+submitted+'</b></div>';
      html += '<div class="kpi blue"><small>الإجمالي</small><b>'+DATA.homeworks.length+'</b></div>';
      html += '</div>';
      
      html += '<div class="list">';
      DATA.homeworks.forEach(function(h) {
        const due = dueText(h.due_date || h.due_at);
        const isSubmitted = h.status === 'submitted';
        const isUrgent = !isSubmitted && (due.includes('متأخر') || due === 'اليوم');
        const badge = isSubmitted ? 'green' : isUrgent ? 'red' : 'blue';
        const statusLabel = isSubmitted ? '✅ مسلّم' : '⏳ ' + due;
        html += '<div class="item"><div><b>'+esc(h.title || h.homework_title || 'واجب')+'</b><small>'+esc(getSubjectName(h.subject_id))+(h.description ? ' · ' + esc(h.description) : '')+'</small></div><div style="display:flex;gap:8px;align-items:center;"><span class="badge '+badge+'">'+statusLabel+'</span>'+(!isSubmitted ? '<button class="btn small" style="background:#3A3565;color:white;" onclick="location.href=\'student-homeworks.html\'">تسليم</button>' : '')+'</div></div>';
      });
      html += '</div>';
    }
    
    container.innerHTML = html;
  }

  function renderExams() {
    const container = $('#view-exams');
    
    let html = '<div class="page-head"><div><h1>📝 اختباراتي</h1></div></div>';
    
    if(!DATA.exams.length) {
      html += emptyState('لا توجد اختبارات قادمة','إذا تم نشر اختبار جديد فسيظهر هنا مع موعده.','<button class="btn blue" onclick="location.href=\'online-exams.html\'">فتح الاختبارات الإلكترونية</button>');
    } else {
      html += '<div class="list">';
      DATA.exams.forEach(function(e) {
        const start = e.starts_at || e.start_at;
        const due = start ? dueText(start) : 'بدون موعد';
        const isUpcoming = !due.includes('متأخر') && due !== 'انتهى';
        const badge = isUpcoming ? 'blue' : 'gold';
        html += '<div class="item"><div><b>'+esc(e.title || e.exam_title || 'اختبار')+'</b><small>'+esc(getSubjectName(e.subject_id))+(e.duration_minutes ? ' · ' + e.duration_minutes + ' دقيقة' : '')+'</small></div><div style="display:flex;gap:8px;align-items:center;"><span class="badge '+badge+'">'+esc(due)+'</span><button class="btn small" style="background:#3A3565;color:white;" onclick="location.href=\'online-exams.html\'">دخول</button></div></div>';
      });
      html += '</div>';
    }
    
    container.innerHTML = html;
  }

  function renderBehavior() {
    const container = $('#view-behavior');
    
    let html = '<div class="page-head"><div><h1>🌟 سلوكي</h1></div></div>';
    html += quickLinksBar();
    
    if(!DATA.behavior.length) {
      html += emptyState('لا توجد ملاحظات سلوكية','أداؤك السلوكي مستقر حتى الآن. استمر 👍');
    } else {
      const totalPoints = DATA.behavior.reduce(function(s,b){ return s + num(b.points || 0); }, 0);
      const positive = DATA.behavior.filter(function(b){ return num(b.points) > 0; }).length;
      const negative = DATA.behavior.filter(function(b){ return num(b.points) < 0; }).length;
      const color = totalPoints >= 0 ? 'green' : 'red';
      
      html += '<div class="kpis" style="margin-bottom:20px;">';
      html += '<div class="kpi '+color+'"><small>مجموع النقاط</small><b>'+(totalPoints > 0 ? '+' : '')+totalPoints+'</b></div>';
      html += '<div class="kpi green"><small>إيجابي</small><b>'+positive+'</b></div>';
      html += '<div class="kpi red"><small>سلبي</small><b>'+negative+'</b></div>';
      html += '</div>';
      
      html += '<div class="list">';
      DATA.behavior.forEach(function(b) {
        const points = num(b.points || 0);
        const pointColor = points >= 0 ? 'green' : 'red';
        html += '<div class="item"><div><b>'+esc(b.note || b.description || 'ملاحظة سلوك')+'</b><small>'+esc(String(b.created_at || b.date || '').slice(0,10))+'</small></div><span class="badge '+pointColor+'">'+(points > 0 ? '+' : '')+points+'</span></div>';
      });
      html += '</div>';
    }
    
    container.innerHTML = html;
  }

  function renderAchievements() {
    const container = $('#view-achievements');
    
    let html = '<div class="page-head"><div><h1>🏆 إنجازاتي وشاراتي</h1></div></div>';
    
    if(!DATA.achievements.length) {
      html += emptyState('ابدأ رحلتك نحو الإنجاز!','حافظ على حضورك وأنجز واجباتك لتحصل على شارات تحفيزية.','<button class="btn gold" onclick="StudentPortal.showView(\'homeworks\')">فتح الواجبات</button>');
    } else {
      const totalPoints = DATA.achievements.reduce(function(s,a){ return s + num(a.points_awarded || 0); }, 0);
      
      html += '<div class="kpis" style="margin-bottom:24px;">';
      html += '<div class="kpi gold"><small>عدد الشارات</small><b>🏆 '+DATA.achievements.length+'</b></div>';
      html += '<div class="kpi green"><small>مجموع النقاط</small><b>'+totalPoints+'</b></div>';
      html += '</div>';
      
      html += '<div class="cards">';
      DATA.achievements.forEach(function(a) {
        html += '<div class="card" style="border:2px solid #f59e0b;text-align:center"><div class="card-body"><span class="amin-3d-ico-auto" data-size="64" data-emoji="🏆" style="display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;">🏆</span><b style="color:#92400e;font-size:16px;display:block;margin:8px 0;">'+esc(a.badge_title_ar || a.badge_code || 'شارة')+'</b><div style="color:#78350f;font-size:12px;">'+esc(a.awarded_at ? String(a.awarded_at).slice(0,10) : '')+'</div><div style="color:#92400e;font-weight:bold;margin-top:8px;font-size:14px;">+'+num(a.points_awarded || 0)+' نقطة</div></div></div>';
      });
      html += '</div>';
    }
    
    container.innerHTML = html;
  }

  // ========== طباعة التقارير ==========
  function printReport(type) {
    const today = new Date().toLocaleDateString('ar-IQ');
    let title = '';
    let content = '';
    
    if(type === 'grades') {
      title = 'كشف الدرجات';
      content = buildGradesReport();
    } else if(type === 'attendance') {
      title = 'كشف الحضور والغياب';
      content = buildAttendanceReport();
    }
    
    const printWindow = window.open('', '_blank', 'width=900,height=700');
    printWindow.document.write(buildPrintHTML(title, today, content));
    printWindow.document.close();
    setTimeout(function(){ printWindow.print(); }, 500);
  }
  
  function buildPrintHTML(title, today, content) {
    return '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>'+title+' - '+ME.name+'</title>'+
      '<style>'+
      '* { margin: 0; padding: 0; box-sizing: border-box; }'+
      'body { font-family: "Cairo", "Segoe UI", Tahoma, sans-serif; padding: 30px; color: #333; line-height: 1.6; }'+
      '.print-header { text-align: center; padding-bottom: 20px; border-bottom: 3px double #0B6E4F; margin-bottom: 30px; }'+
      '.print-header h1 { color: #0B6E4F; font-size: 28px; margin-bottom: 8px; }'+
      '.print-header h2 { color: #555; font-size: 18px; font-weight: normal; }'+
      '.info-box { background: #f3f4f6; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-right: 4px solid #3A3565; }'+
      'table { width: 100%; border-collapse: collapse; margin: 20px 0; }'+
      'table th { background: #0B6E4F; color: white; padding: 12px; text-align: right; }'+
      'table td { padding: 10px 12px; border-bottom: 1px solid #e5e7eb; }'+
      'table tr:nth-child(even) td { background: #f9fafb; }'+
      '.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 20px 0; }'+
      '.stat-card { background: #f3f4f6; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #d1d5db; }'+
      '.stat-card .label { color: #6b7280; font-size: 13px; margin-bottom: 5px; }'+
      '.stat-card .value { color: #0B6E4F; font-size: 24px; font-weight: bold; }'+
      '.section-title { color: #0B6E4F; font-size: 18px; margin: 25px 0 12px; padding-bottom: 8px; border-bottom: 2px solid #0B6E4F; }'+
      '.badge-green { background: #d1fae5; color: #065f46; padding: 3px 10px; border-radius: 4px; }'+
      '.badge-red { background: #fee2e2; color: #991b1b; padding: 3px 10px; border-radius: 4px; }'+
      '.badge-gold { background: #fef3c7; color: #92400e; padding: 3px 10px; border-radius: 4px; }'+
      '.print-footer { margin-top: 50px; padding-top: 20px; border-top: 2px dashed #ccc; text-align: center; color: #666; font-size: 13px; }'+
      '@media print { body { padding: 15px; } .no-print { display: none !important; } @page { size: A4; margin: 1cm; } }'+
      '.print-btn { position: fixed; top: 20px; left: 20px; background: #0B6E4F; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; }'+
      '</style></head><body>'+
      '<button class="print-btn no-print" onclick="window.print()">🖨️ طباعة</button>'+
      '<div class="print-header"><h1>'+SCHOOL_LOGO+' '+SCHOOL_NAME+'</h1><h2>'+title+'</h2><div>📅 '+today+'</div></div>'+
      '<div class="info-box"><div><b>الطالب:</b> '+esc(ME.name)+'</div></div>'+
      content+
      '<div class="print-footer"><div>📞 '+SCHOOL_PHONE+' | '+SCHOOL_NAME+'</div></div>'+
      '<script src="assets/amin-theme-injector.js"><\/script></body></html>';
  }
  
  function buildGradesReport() {
    const avg = DATA.grades.length ? Math.round(DATA.grades.reduce(function(s,g){ return s + num(g.score || g.grade || g.mark); }, 0) / DATA.grades.length) : 0;
    
    let html = '<div class="section-title">📊 ملخص الأداء</div>';
    html += '<div class="stat-grid">';
    html += '<div class="stat-card"><div class="label">المعدل العام</div><div class="value">'+avg+'%</div></div>';
    html += '<div class="stat-card"><div class="label">عدد المواد</div><div class="value">'+DATA.grades.length+'</div></div>';
    html += '</div>';
    
    if(DATA.grades.length) {
      html += '<div class="section-title">📚 تفاصيل الدرجات</div>';
      html += '<table><thead><tr><th>#</th><th>المادة</th><th>الدرجة</th><th>التقييم</th></tr></thead><tbody>';
      DATA.grades.forEach(function(g, i) {
        const score = num(g.score || g.grade || g.mark);
        const badge = score >= 85 ? 'badge-green' : score >= 60 ? 'badge-gold' : 'badge-red';
        const eval2 = score >= 85 ? 'ممتاز' : score >= 60 ? 'جيد' : 'يحتاج تحسين';
        html += '<tr><td>'+(i+1)+'</td><td>'+esc(getSubjectName(g.subject_id))+'</td><td><span class="'+badge+'">'+score+'</span></td><td>'+eval2+'</td></tr>';
      });
      html += '</tbody></table>';
    }
    
    return html;
  }
  
  function buildAttendanceReport() {
    const present = DATA.attendance.filter(function(a){ return a.status === 'present'; }).length;
    const absent = DATA.attendance.filter(function(a){ return a.status === 'absent'; }).length;
    const late = DATA.attendance.filter(function(a){ return a.status === 'late'; }).length;
    const rate = DATA.attendance.length ? Math.round((present/DATA.attendance.length)*100) : 0;
    
    let html = '<div class="section-title">📊 الإحصائيات</div>';
    html += '<div class="stat-grid">';
    html += '<div class="stat-card"><div class="label">الحضور</div><div class="value">'+present+'</div></div>';
    html += '<div class="stat-card"><div class="label">الغياب</div><div class="value">'+absent+'</div></div>';
    html += '<div class="stat-card"><div class="label">التأخير</div><div class="value">'+late+'</div></div>';
    html += '<div class="stat-card"><div class="label">النسبة</div><div class="value">'+rate+'%</div></div>';
    html += '</div>';
    
    if(DATA.attendance.length) {
      html += '<div class="section-title">📋 التفاصيل</div>';
      html += '<table><thead><tr><th>#</th><th>التاريخ</th><th>الحالة</th></tr></thead><tbody>';
      DATA.attendance.forEach(function(a, i) {
        const status = a.status || '—';
        const badge = status === 'present' ? 'badge-green' : status === 'absent' ? 'badge-red' : 'badge-gold';
        const label = status === 'present' ? 'حاضر' : status === 'absent' ? 'غائب' : status === 'late' ? 'متأخر' : status;
        html += '<tr><td>'+(i+1)+'</td><td>'+esc(String(a.date).slice(0,10))+'</td><td><span class="'+badge+'">'+label+'</span></td></tr>';
      });
      html += '</tbody></table>';
    }
    
    return html;
  }

  window.addEventListener('load', init);
  window.addEventListener('load', function(){ var p=$('#printBtn'); if(p) p.onclick=function(){ StudentPortal.printReport('grades'); }; });
  
  window.StudentPortal = {
    init: init,
    showView: showView,
    printReport: printReport
  };
})();
</script>
