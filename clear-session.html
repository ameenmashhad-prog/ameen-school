<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تصفير الجلسة — مدارس أمين الرضا</title>
  <link rel="stylesheet" href="assets/amin.css">
<style id="amin-page">
*{box-sizing:border-box;}
body{margin:0;font-family:var(--font-arabic);background:var(--bg);color:var(--text-primary);min-height:100vh;display:grid;place-items:center;padding:24px;}
.card{background:var(--surface);border:1px solid var(--border-subtle);border-radius:18px;box-shadow:var(--shadow-soft);padding:32px;max-width:420px;width:100%;text-align:center;}
.card h1{font-size:22px;margin-bottom:12px;color:var(--primary);}
.muted{color:var(--text-secondary);font-size:14px;margin-bottom:20px;}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 20px;border-radius:999px;border:1px solid var(--border-subtle);background:var(--surface);color:var(--text-primary);font-weight:800;cursor:pointer;font-family:inherit;}
.btn:hover{background:var(--primary-tint);color:var(--primary);}
</style>
<link rel="stylesheet" href="assets/i18n.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/amin-logo-small.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أمين الرضا">
</head>
  <script src="assets/amin-theme-injector.js"></script>
<body>
<section class="card">
<h1>تصفير الجلسة</h1>
<p class="muted">تستخدم هذه الصفحة عند ظهور خطأ JWT failed verification أو JWT expired. سيتم حذف الجلسة المحلية فقط ثم الرجوع لصفحة الدخول.</p>
<button class="btn" id="clearBtn">تصفير الجلسة والعودة للدخول</button>
<p id="msg" class="muted"></p>
</section>
<script>
function clearSession(){
  try{
    Object.keys(localStorage).forEach(k=>{ if(k.includes('supabase')||k.includes('sb-')||k.includes('amin-')) localStorage.removeItem(k); });
    Object.keys(sessionStorage).forEach(k=>{ if(k.includes('supabase')||k.includes('sb-')||k.includes('amin-')) sessionStorage.removeItem(k); });
  }catch(e){}
  document.getElementById('msg').textContent='تم تصفير الجلسة. سيتم التحويل...';
  setTimeout(()=>location.href='index.html',700);
}
document.getElementById('clearBtn').addEventListener('click',clearSession);
</script>
<script src="assets/platform-modules.js"></script><script src="assets/i18n.js"></script>
<script src="assets/ux-enhancements.js"></script>
<script src="assets/amin-theme-injector.js"></script>
</body>
</html>
