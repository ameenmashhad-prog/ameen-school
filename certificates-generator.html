<style>
.cert-preview-wrap { display: flex; flex-direction: column; gap: 30px; margin-top: 20px; align-items: center; }
.cert-card { width: 100%; max-width: 900px; background: #fffaf0; border: 12px double #B8860B; padding: 40px; border-radius: 16px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; font-family: inherit; overflow: hidden; }
.cert-card::before { content: "★"; position: absolute; top: 15px; right: 20px; font-size: 36px; color: #0B6E4F; opacity: 0.3; }
.cert-card::after { content: "★"; position: absolute; top: 15px; left: 20px; font-size: 36px; color: #0B6E4F; opacity: 0.3; }
.cert-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #B8860B; padding-bottom: 20px; margin-bottom: 25px; }
.cert-logo { width: 70px; height: 70px; background: linear-gradient(135deg, #0B6E4F, #3A3565); color: #fff; font-size: 32px; font-weight: bold; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 3px solid #B8860B; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
.cert-school-info { text-align: right; }
.cert-school-info h2 { font-size: 22px; color: #0B6E4F; margin: 0; font-weight: bold; }
.cert-school-info p { font-size: 13px; color: #666; margin: 4px 0 0; }
.cert-title { font-size: 38px; color: #8b0000; font-weight: bold; margin: 15px 0 10px; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
.cert-subtitle { font-size: 18px; color: #B8860B; font-weight: bold; margin-bottom: 30px; letter-spacing: 1px; }
.cert-body { font-size: 20px; color: #333; line-height: 1.8; margin-bottom: 40px; padding: 0 20px; }
.cert-recipient { font-size: 36px; color: #0B6E4F; font-weight: bold; display: inline-block; border-bottom: 3px solid #B8860B; padding: 0 20px 5px; margin: 10px 0; }
.cert-reason { font-size: 22px; color: #444; margin: 15px 0; font-weight: 500; }
.cert-footer { display: flex; justify-content: space-around; align-items: flex-end; margin-top: 40px; border-top: 1px dashed #ccc; padding-top: 25px; }
.cert-sign-box { text-align: center; min-width: 180px; }
.cert-sign-box b { display: block; font-size: 16px; color: #0B6E4F; margin-bottom: 35px; }
.cert-sign-box span { display: block; font-size: 15px; color: #333; border-top: 1px solid #999; padding-top: 6px; }
.cert-seal { width: 85px; height: 85px; border: 3px dashed #B8860B; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #B8860B; font-weight: bold; transform: rotate(-15deg); margin: 0 auto; background: rgba(184,134,11,0.05); }
/* 4 Professional Themes Suite */
.cert-card.theme-royal { background: #fffaf0; border: 14px double #D4AF37; box-shadow: 0 0 0 2px #B8860B inset, 0 10px 30px rgba(0,0,0,0.1); }
.cert-card.theme-classic { background: #ffffff; border: 12px solid #1e3a8a; box-shadow: 0 0 0 4px #d97706 inset, 0 10px 30px rgba(0,0,0,0.1); }
.cert-card.theme-classic .cert-header { border-bottom: 2px solid #1e3a8a; }
.cert-card.theme-classic .cert-logo { background: linear-gradient(135deg, #1e3a8a, #3b82f6); border-color: #d97706; }
.cert-card.theme-classic .cert-title { color: #1e3a8a; }
.cert-card.theme-classic .cert-subtitle { color: #d97706; }
.cert-card.theme-classic .cert-recipient { color: #1e3a8a; border-color: #d97706; }
.cert-card.theme-classic .cert-seal { border-color: #1e3a8a; color: #1e3a8a; background: rgba(30,58,138,0.05); }

.cert-card.theme-emerald { background: #f0fdf4; border: 14px double #0B6E4F; box-shadow: 0 0 0 2px #B8860B inset, 0 10px 30px rgba(0,0,0,0.1); }
.cert-card.theme-emerald .cert-header { border-bottom: 2px solid #0B6E4F; }
.cert-card.theme-emerald .cert-logo { background: linear-gradient(135deg, #0B6E4F, #10b981); border-color: #B8860B; }
.cert-card.theme-emerald .cert-title { color: #0B6E4F; }
.cert-card.theme-emerald .cert-subtitle { color: #B8860B; }
.cert-card.theme-emerald .cert-recipient { color: #065f46; border-color: #0B6E4F; }
.cert-card.theme-emerald .cert-seal { border-color: #0B6E4F; color: #0B6E4F; background: rgba(11,110,79,0.05); }

.cert-card.theme-modern { background: #f8fafc; border: 10px solid #334155; box-shadow: 0 0 0 1px #94a3b8 inset, 0 10px 30px rgba(0,0,0,0.08); }
.cert-card.theme-modern .cert-header { border-bottom: 1px solid #cbd5e1; }
.cert-card.theme-modern .cert-logo { background: linear-gradient(135deg, #334155, #64748b); border-color: #94a3b8; }
.cert-card.theme-modern .cert-title { color: #0f172a; letter-spacing: -0.5px; }
.cert-card.theme-modern .cert-subtitle { color: #475569; }
.cert-card.theme-modern .cert-recipient { color: #0f172a; border-color: #334155; }
.cert-card.theme-modern .cert-seal { border: 2px solid #475569; color: #334155; background: rgba(51,65,85,0.05); transform: none; border-radius: 8px; }

@media print {
  body { background: #fff !important; margin: 0 !important; padding: 0 !important; }
  .shell > aside, .topbar, .no-print, .kpis, #toast, .cert-controls { display: none !important; }
  .main { margin: 0 !important; padding: 0 !important; width: 100% !important; }
  .cert-preview-wrap { gap: 0 !important; margin: 0 !important; }
  .cert-card { width: 100% !important; max-width: 100% !important; border: 8px double #B8860B !important; border-radius: 0 !important; box-shadow: none !important; page-break-after: always !important; break-after: page !important; min-height: 95vh !important; display: flex !important; flex-direction: column !important; justify-content: space-between !important; padding: 30px !important; margin: 0 !important; }
}
/* Illustrated Cards Print & Display Setup */
* {
  -webkit-print-color-adjust: exact !important;
  print-color-adjust: exact !important;
  color-adjust: exact !important;
}
.cert-card.illustrated-card {
  width: 100%;
  max-width: 950px;
  background-size: cover !important;
  background-position: center !important;
  border-radius: 18px;
  overflow: hidden;
}
@media print {
  .cert-card.illustrated-card {
    width: 100% !important;
    max-width: 100% !important;
    min-height: 95vh !important;
    background-size: contain !important;
    background-position: center !important;
    border: none !important;
    box-shadow: none !important;
    border-radius: 0 !important;
    margin: 0 !important;
    padding: 20px !important;
  }
  .illustrated-overlay {
    background: rgba(255, 255, 255, 0.95) !important;
    box-shadow: none !important;
    border: 2px solid #0B6E4F !important;
  }
}
