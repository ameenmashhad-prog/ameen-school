<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline — مجمع أمين الرضا التعليمي</title>
  <link rel="stylesheet" href="assets/amin.css?v=20260706-5">
<style id="amin-page">
*{box-sizing:border-box;}
body{margin:0;font-family:var(--font-arabic);background:var(--bg);color:var(--text-primary);min-height:100vh;display:grid;place-items:center;padding:24px;}
.offline-card{background:var(--surface);border:1px solid var(--border-subtle);border-radius:24px;box-shadow:var(--shadow-soft-lg);padding:40px;text-align:center;max-width:420px;width:100%;}
.offline-card h1{font-size:24px;color:var(--primary);margin-bottom:12px;}
.offline-card p{color:var(--text-secondary);margin-bottom:20px;}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 20px;border-radius:999px;border:1px solid var(--border-subtle);background:var(--surface);color:var(--text-primary);font-weight:800;cursor:pointer;font-family:inherit;}
.btn.gold{background:linear-gradient(135deg,var(--secondary-light,#E7D4A0),var(--secondary));color:#3D2A05;border-color:transparent;}
.btn:hover{transform:translateY(-2px);}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/amin-logo-small.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أمين الرضا">
</head>
<body>
<section class="offline-card">
<img src="assets/amin-logo-small.png" alt="شعار المدرسة">
<h1>أنت غير متصل حالياً</h1>
<p>يمكنك العودة للصفحات المحفوظة مسبقاً، أما العمليات التي تحتاج اتصالاً بقاعدة البيانات فستعمل عند عودة الإنترنت.</p>
<button class="btn gold" onclick="location.href='portal.html'">العودة للبوابة</button>
</section>
<script src="assets/amin-theme-injector.js"></script>
<script src="assets/amin-icons.js?v=20260706-3" defer></script>
<script src="assets/amin-translate.js"></script>
</body>
</html>
