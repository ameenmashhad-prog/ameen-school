<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بوابة ولي الأمر — مدارس أمين الرضا</title>
  <link rel="stylesheet" href="assets/amin.css">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="assets/i18n.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/amin-logo-small.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أمين الرضا">
</head>
<body data-portal="parent">
<a class="skip-link" href="#mainContent">تخطي إلى المحتوى</a>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">و</div>
      <div>
        <h1>بوابة ولي الأمر</h1>
        <small>متابعة الأبناء · درجات · أقساط</small>
      </div>
    </div>
    
    <div class="profile-mini">
      <div class="avatar">👨‍👩‍👧</div>
      <div>
        <b id="profileName">...</b>
        <small id="profileRole">...</small>
      </div>
    </div>

    <nav class="nav">
      <button onclick="location.href='portal.html'">🏛️ البوابة الموحدة</button>
      <button data-view="overview" class="active">🏠 الرئيسية</button>
      <button data-view="grades">📊 الدرجات</button>
      <button data-view="attendance">📋 الحضور</button>
      <button data-view="finance">💰 الأقساط</button>
      <button data-view="behavior">🌟 السلوك</button>
      <button onclick="location.href='student-homeworks.html'">📚 الواجبات</button>
      <button onclick="location.href='notifications.html'">🔔 الإشعارات</button>
      <button onclick="location.href='smart-calendar.html'">📅 التقويم</button>
    </nav>

    <div class="side-footer">
      <button id="logoutBtn" class="btn red block">تسجيل الخروج</button>
    </div>
  </aside>

  <main class="main" id="mainContent" tabindex="-1">
    <header class="topbar">
      <button class="btn mobile-menu" id="mobileMenuBtn">☰</button>
      <h2>بوابة ولي الأمر</h2>
      <div class="top-actions">
        <select id="childSelector" class="select" style="display:none; min-width: 200px; padding:8px; border-radius:8px;"></select>
      </div>
    </header>

    <section id="view-overview" class="view active"></section>
    <section id="view-grades" class="view"></section>
    <section id="view-attendance" class="view"></section>
    <section id="view-finance" class="view"></section>
    <section id="view-behavior" class="view"></section>
  </main>
</div>

<div id="toast" class="toast"></div>

<script src="libs/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/platform-modules.js"></script>
<script src="assets/i18n.js"></script>

<script>
(function(){
  'use strict';

  const SCHOOL_PHONE = '+9647700000000';
  const SCHOOL_NAME = 'مدرسة أمين الرضا';
  const SCHOOL_LOGO = '🎓';

  function $(s, r){r=r||document;return r.querySelector(s)}
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
  function num(v){var n=Number(v);return Number.isFinite(n)?n:0}
  function money(v){return num(v).toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0})}
  
  let currentChildId = null;
  let sb = null;
  let ME = null;
  let CHILDREN = [];
  let CHILD_DATA = {};
  let NOTIFICATIONS = [];
  let SUBJECTS_MAP = {};

  function cfg() { return window.AMIN_CONFIG || {}; }
  
  function client() {
    if(sb) return sb;
    if(!window.supabase) throw new Error('Supabase library not loaded');
    sb = window.supabase.createClient(
      cfg().supabaseUrl, 
      cfg().supabaseAnonKey, 
      {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storageKey:(cfg().authStorageKey||'amin-ovcjzsrqqgjsbqswtkro-auth-v2')}}
    );
    return sb;
  }

  function toast(title, msg, type) {
    const t = $('#toast');
    if(!t) return;
    t.innerHTML = '<b>'+esc(title)+'</b><br><span class="muted">'+esc(msg||'')+'</span>';
    t.className = 'toast show ' + (type||'');
    clearTimeout(t._to);
    t._to = setTimeout(function(){t.classList.remove('show')}, 4000);
  }

  async function init() {
    try {
      const c = client();
      
      const sessionRes = await c.auth.getSession();
      const session = sessionRes.data.session;
      if(!session) {
        location.href = 'index.html';
        return;
      }
      console.log('✅ Session OK:', session.user.email);

      const userRes = await c.from('users').select('*').eq('id', session.user.id).maybeSingle();
      if(userRes.error || !userRes.data) {
        toast('خطأ', 'تعذر تحميل بيانات الحساب', 'red');
        return;
      }
      ME = userRes.data;
      window.ME = ME;
      console.log('✅ User loaded:', ME.name);

      $('#profileName').textContent = ME.name || ME.email || 'ولي أمر';
      $('#profileRole').textContent = 'ولي أمر';

      $('#logoutBtn').onclick = async function() {
        await c.auth.signOut({scope:'local'}).catch(function(){});
        location.href = 'index.html';
      };

      const mobileBtn = $('#mobileMenuBtn');
      if(mobileBtn) mobileBtn.addEventListener('click', function() {
        const sb = $('#sidebar');
        if(sb) sb.classList.toggle('open');
      });

      const navBtns = document.querySelectorAll('.nav button[data-view]');
      navBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          const view = btn.dataset.view;
          showView(view);
          navBtns.forEach(function(b) { b.classList.toggle('active', b === btn); });
          const sb = $('#sidebar');
          if(sb) sb.classList.remove('open');
        });
      });

      const childRes = await c.from('students').select('*, users:user_id(name, email)').eq('parent_id', ME.id);
      if(childRes.error) {
        console.error('❌ Error fetching children:', childRes.error);
      }
      CHILDREN = childRes.data || [];
      window.CHILDREN = CHILDREN;
      console.log('✅ Children count:', CHILDREN.length);

      await loadNotifications();
      await loadSubjects();
      setupChildSelector();

      if(CHILDREN.length > 0) {
        currentChildId = CHILDREN[0].id;
        await Promise.all(CHILDREN.map(function(c){ return loadChildData(c.id); }));
        renderOverview();
      } else {
        $('#view-overview').innerHTML = '<div class="empty" style="text-align:center;padding:60px 20px;"><div style="font-size:64px;margin-bottom:20px;">⚠️</div><h3>لا يوجد طلاب مسجلين تحت هذا الحساب</h3><p style="color:#999;margin-top:10px;">يرجى مراجعة الإدارة لربط الطلاب بحسابك.</p></div>';
      }

    } catch(e) {
      console.error('❌ Init error:', e);
      toast('خطأ في التحميل', e.message, 'red');
    }
  }

  async function loadNotifications() {
    try {
      const res = await client().from('school_notifications').select('*').eq('recipient_user_id', ME.id).order('created_at', {ascending: false}).limit(10);
      NOTIFICATIONS = res.data || [];
    } catch(e) {
      NOTIFICATIONS = [];
    }
  }

  async function loadSubjects() {
    try {
      const res = await client().from('subjects').select('id, name');
      if(res.data) {
        res.data.forEach(function(s) {
          SUBJECTS_MAP[s.id] = s.name;
        });
        console.log('✅ Subjects loaded:', Object.keys(SUBJECTS_MAP).length);
      }
    } catch(e) {
      console.error('Subjects error:', e);
    }
  }

  function getSubjectName(id) {
    if(!id) return 'مادة';
    return SUBJECTS_MAP[id] || 'مادة';
  }

  function getSmartAlerts() {
    const alerts = [];
    CHILDREN.forEach(function(child) {
      const childName = (child.users && child.users.name) || child.name || 'الطالب';
      const data = CHILD_DATA[child.id] || {attendance: [], grades: [], fees: [], behavior: []};
      
      const absent = data.attendance.filter(function(a){ return a.status === 'absent'; }).length;
      const total = data.attendance.length;
      if(total > 0 && absent > 0) {
        const rate = (absent/total) * 100;
        if(rate > 20) {
          alerts.push({type:'danger',icon:'⚠️',title:'غياب مرتفع لـ '+childName,message:'نسبة الغياب '+Math.round(rate)+'%'});
        }
      }
      
      data.fees.forEach(function(f) {
        const t = num(f.net_amount || f.base_amount);
        const p = num(f.total_paid);
        const r = t - p;
        if(r > 0) {
          alerts.push({type:'warning',icon:'💰',title:'قسط مستحق لـ '+childName,message:'المبلغ المتبقي: '+money(r)});
        }
      });
      
      const lowGrades = data.grades.filter(function(g){ return num(g.score || g.grade || g.mark) < 60; });
      if(lowGrades.length > 0) {
        alerts.push({type:'warning',icon:'📉',title:'درجات تحتاج متابعة لـ '+childName,message:lowGrades.length+' مواد بدرجات أقل من 60'});
      }
    });
    return alerts;
  }

  function setupChildSelector() {
    const selector = $('#childSelector');
    if(!selector) return;
    
    if(CHILDREN.length > 1) {
      selector.style.display = 'block';
      selector.innerHTML = CHILDREN.map(function(c) {
        const childName = (c.users && c.users.name) || c.name || 'طالب';
        return '<option value="'+c.id+'">'+esc(childName)+'</option>';
      }).join('');
      
      selector.onchange = async function(e) {
        currentChildId = e.target.value;
        if(!CHILD_DATA[currentChildId]) {
          await loadChildData(currentChildId);
        }
        const activeView = (document.querySelector('.view.active') || {}).id || 'view-overview';
        showView(activeView.replace('view-', ''));
      };
    } else if(CHILDREN.length === 1) {
      currentChildId = CHILDREN[0].id;
      selector.style.display = 'none';
    }
  }

  async function loadChildData(childId) {
    if(!childId) return;
    const c = client();
    
    try {
      const results = await Promise.all([
        c.from('attendance').select('*').eq('student_id', childId).order('date', {ascending: false}).limit(50),
        c.from('grades').select('*').eq('student_id', childId),
        c.from('student_fees').select('*').eq('student_id', childId),
        c.from('behavior_records').select('*').eq('student_id', childId).order('created_at', {ascending: false}).limit(20)
      ]);

      CHILD_DATA[childId] = {
        attendance: results[0].data || [],
        grades: results[1].data || [],
        fees: results[2].data || [],
        behavior: results[3].data || []
      };
    } catch(e) {
      CHILD_DATA[childId] = {attendance: [], grades: [], fees: [], behavior: []};
    }
  }

  function showView(viewId) {
    document.querySelectorAll('.view').forEach(function(v) {
      v.classList.toggle('active', v.id === 'view-' + viewId);
    });
    
    if(viewId === 'overview') renderOverview();
    else if(viewId === 'grades') renderGrades();
    else if(viewId === 'attendance') renderAttendance();
    else if(viewId === 'finance') renderFinance();
    else if(viewId === 'behavior') renderBehavior();
  }

  function renderOverview() {
    const container = $('#view-overview');
    if(!CHILDREN.length) return;

    const alerts = getSmartAlerts();
    const unreadNotifs = NOTIFICATIONS.filter(function(n){ return !n.read_at; }).length;
    const whatsappMsg = encodeURIComponent('السلام عليكم، أنا ولي أمر '+(ME.name||'')+'، أحتاج للتواصل معكم');
    const phoneClean = SCHOOL_PHONE.replace('+','');

    let html = '<div class="page-head"><div><h1>أهلاً بك، '+esc(ME.name)+' 👋</h1><p>متابعة شاملة لأبنائك · عدد الأبناء: <b>'+CHILDREN.length+'</b>'+(unreadNotifs > 0 ? ' · <span class="badge red">'+unreadNotifs+' إشعار جديد</span>' : '')+'</p></div></div>';

    html += '<h3 style="margin-bottom:12px;">📞 تواصل سريع مع المدرسة</h3>';
    html += '<div class="cards" style="margin-bottom:24px;">';
    html += '<a href="tel:'+SCHOOL_PHONE+'" style="text-decoration:none;color:inherit;"><div class="card" style="cursor:pointer;text-align:center;padding:20px"><span class="amin-3d-ico-auto" data-size="36" data-emoji="📞" style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;">📞</span><div style="font-weight:bold;margin-top:8px;font-size:15px;">اتصال بالمدرسة</div><small style="opacity:0.9;">للتواصل المباشر</small></div></a>';
    html += '<a href="https://wa.me/'+phoneClean+'?text='+whatsappMsg+'" target="_blank" style="text-decoration:none;color:inherit;"><div class="card" style="cursor:pointer;text-align:center;padding:20px"><span class="amin-3d-ico-auto" data-size="36" data-emoji="💬" style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;">💬</span><div style="font-weight:bold;margin-top:8px;font-size:15px;">واتساب الإدارة</div><small style="opacity:0.9;">رد سريع</small></div></a>';
    html += '<div onclick="ParentPortal.requestAppointment()" class="card" style="cursor:pointer;text-align:center;padding:20px"><span class="amin-3d-ico-auto" data-size="36" data-emoji="📅" style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;">📅</span><div style="font-weight:bold;margin-top:8px;font-size:15px;">طلب موعد</div><small style="opacity:0.9;">مع المرشد/الإدارة</small></div>';
    html += '<div onclick="ParentPortal.sendMessage()" class="card" style="cursor:pointer;text-align:center;padding:20px"><span class="amin-3d-ico-auto" data-size="36" data-emoji="✉️" style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;">✉️</span><div style="font-weight:bold;margin-top:8px;font-size:15px;">رسالة للمدرسة</div><small style="opacity:0.9;">عبر النظام</small></div>';
    html += '</div>';
    
    if(alerts.length > 0) {
      html += '<div style="margin-bottom:20px;"><h3 style="margin-bottom:12px;">⚠️ تنبيهات تحتاج اهتمامك ('+alerts.length+')</h3><div class="cards">';
      alerts.slice(0, 4).forEach(function(a) {
        const bgColor = a.type === 'danger' ? '#fee2e2' : a.type === 'warning' ? '#FBF1DC' : '#E6F4EF';
        const borderColor = a.type === 'danger' ? '#dc2626' : a.type === 'warning' ? '#B8860B' : '#0B6E4F';
        html += '<div style="background:'+bgColor+';border-right:4px solid '+borderColor+';padding:14px;border-radius:10px;color:#333;"><div style="font-size:16px;font-weight:bold;margin-bottom:4px;">'+a.icon+' '+esc(a.title)+'</div><div style="font-size:13px;opacity:0.85;">'+esc(a.message)+'</div></div>';
      });
      html += '</div></div>';
    }
    
    html += '<h3 style="margin-bottom:12px;">🎓 أبناؤك</h3><div class="cards">';
    CHILDREN.forEach(function(child) {
      const childName = (child.users && child.users.name) || child.name || 'طالب';
      const data = CHILD_DATA[child.id] || {attendance: [], grades: [], fees: [], behavior: []};
      
      const presentCount = data.attendance.filter(function(a){ return a.status === 'present'; }).length;
      const absentCount = data.attendance.filter(function(a){ return a.status === 'absent'; }).length;
      const totalAtt = data.attendance.length;
      const attRate = totalAtt ? Math.round((presentCount/totalAtt) * 100) : 0;
      
      const fee = data.fees[0];
      const total = num(fee && (fee.net_amount || fee.base_amount));
      const paid = num(fee && fee.total_paid);
      const remaining = Math.max(total - paid, 0);
      
      const gradesAvg = data.grades.length ? Math.round(data.grades.reduce(function(s,g){ return s + num(g.score || g.grade || g.mark); }, 0) / data.grades.length) : 0;
      const isActive = String(child.id) === String(currentChildId);
      
      html += '<div class="card" style="'+(isActive ? 'border:2px solid #B8860B;box-shadow:0 4px 20px rgba(251,191,36,0.2);' : '')+'cursor:pointer;" onclick="ParentPortal.selectChild(\''+child.id+'\')">';
      html += '<div class="card-head"><h3>🎓 '+esc(childName)+'</h3>'+(isActive ? '<span class="badge gold">👁️ المحدد</span>' : '')+'</div>';
      html += '<div class="card-body"><div class="kpis">';
      html += '<div class="kpi green"><small>الحضور</small><b>'+attRate+'%</b></div>';
      html += '<div class="kpi red"><small>الغياب</small><b>'+absentCount+' يوم</b></div>';
      html += '<div class="kpi gold"><small>المعدل</small><b>'+gradesAvg+'%</b></div>';
      html += '<div class="kpi '+(remaining > 0 ? 'red' : 'green')+'"><small>المتبقي</small><b>'+money(remaining)+'</b></div>';
      html += '</div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">';
      html += '<button class="btn small blue" onclick="event.stopPropagation();ParentPortal.viewChild(\''+child.id+'\',\'grades\')">📊 الدرجات</button>';
      html += '<button class="btn small green" onclick="event.stopPropagation();ParentPortal.viewChild(\''+child.id+'\',\'attendance\')">📋 الحضور</button>';
      html += '<button class="btn small gold" onclick="event.stopPropagation();ParentPortal.viewChild(\''+child.id+'\',\'finance\')">💰 الأقساط</button>';
      html += '<button class="btn small" style="background:#0B6E4F;color:white;" onclick="event.stopPropagation();ParentPortal.selectChild(\''+child.id+'\');setTimeout(function(){ParentPortal.printChildReport(\'full\');},200);">🖨️ تقرير كامل</button>';
      html += '</div></div></div>';
    });
    html += '</div>';

    if(NOTIFICATIONS.length > 0) {
      html += '<h3 style="margin:24px 0 12px;">🔔 آخر الإشعارات</h3><div class="list">';
      NOTIFICATIONS.slice(0, 5).forEach(function(n) {
        const isUnread = !n.read_at;
        html += '<div class="item" style="'+(isUnread ? 'background:#FBF1DC;border-right:3px solid #B8860B;' : '')+'"><div><b>'+esc(n.title || 'إشعار')+'</b><small>'+esc(n.body || n.message || '')+' · '+esc(String(n.created_at || '').slice(0,10))+'</small></div><span class="badge '+(isUnread ? 'gold' : 'blue')+'">'+(isUnread ? 'جديد' : 'مقروء')+'</span></div>';
      });
      html += '</div>';
    }

    container.innerHTML = html;
  }

  function renderGrades() {
    const container = $('#view-grades');
    const data = CHILD_DATA[currentChildId] || {grades: []};
    const child = CHILDREN.find(function(c){ return c.id === currentChildId; });
    const childName = (child && child.users && child.users.name) || (child && child.name) || 'الطالب';
    
    let html = '<div class="page-head" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;"><div><h1>📊 درجات '+esc(childName)+'</h1></div>';
    html += '<button class="btn" style="background:#0B6E4F;color:white;padding:10px 18px;" onclick="ParentPortal.printChildReport(\'grades\')">🖨️ طباعة الكشف</button>';
    html += '</div>';
    
    if(!data.grades.length) {
      html += '<div class="empty" style="text-align:center;padding:60px;">لا توجد درجات مسجلة بعد.</div>';
    } else {
      html += '<div class="table-wrap"><table><thead><tr><th>المادة</th><th>الدرجة</th><th>ملاحظة</th></tr></thead><tbody>';
      data.grades.forEach(function(g) {
        const score = num(g.score || g.grade || g.mark);
        const color = score >= 85 ? 'green' : score >= 60 ? 'gold' : 'red';
        html += '<tr><td>'+esc(getSubjectName(g.subject_id))+'</td><td><span class="badge '+color+'">'+score+'</span></td><td>'+esc(g.notes || g.note || '—')+'</td></tr>';
      });
      html += '</tbody></table></div>';
    }
    
    container.innerHTML = html;
  }

  function renderAttendance() {
    const container = $('#view-attendance');
    const data = CHILD_DATA[currentChildId] || {attendance: []};
    const child = CHILDREN.find(function(c){ return c.id === currentChildId; });
    const childName = (child && child.users && child.users.name) || (child && child.name) || 'الطالب';
    
    const present = data.attendance.filter(function(a){ return a.status === 'present'; }).length;
    const absent = data.attendance.filter(function(a){ return a.status === 'absent'; }).length;
    const late = data.attendance.filter(function(a){ return a.status === 'late'; }).length;
    
    let html = '<div class="page-head" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;"><div><h1>📋 حضور '+esc(childName)+'</h1></div>';
    html += '<button class="btn" style="background:#0B6E4F;color:white;padding:10px 18px;" onclick="ParentPortal.printChildReport(\'attendance\')">🖨️ طباعة الكشف</button>';
    html += '</div>';
    html += '<div class="kpis" style="margin-bottom:20px;"><div class="kpi green"><small>أيام الحضور</small><b>'+present+'</b></div><div class="kpi red"><small>أيام الغياب</small><b>'+absent+'</b></div><div class="kpi gold"><small>أيام التأخير</small><b>'+late+'</b></div><div class="kpi blue"><small>الإجمالي</small><b>'+data.attendance.length+'</b></div></div>';
    
    if(!data.attendance.length) {
      html += '<div class="empty" style="text-align:center;padding:60px;">لا توجد سجلات حضور.</div>';
    } else {
      html += '<div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>الحالة</th><th>ملاحظة</th></tr></thead><tbody>';
      data.attendance.slice(0, 50).forEach(function(a) {
        const status = a.status || '—';
        const color = status === 'present' ? 'green' : status === 'absent' ? 'red' : 'gold';
        const label = status === 'present' ? 'حاضر' : status === 'absent' ? 'غائب' : status === 'late' ? 'متأخر' : status;
        html += '<tr><td>'+esc(String(a.date).slice(0,10))+'</td><td><span class="badge '+color+'">'+esc(label)+'</span></td><td>'+esc(a.note || '—')+'</td></tr>';
      });
      html += '</tbody></table></div>';
    }
    
    container.innerHTML = html;
  }

  function renderFinance() {
    const container = $('#view-finance');
    const data = CHILD_DATA[currentChildId] || {fees: []};
    const child = CHILDREN.find(function(c){ return c.id === currentChildId; });
    const childName = (child && child.users && child.users.name) || (child && child.name) || 'الطالب';
    
    let html = '<div class="page-head" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;"><div><h1>💰 أقساط '+esc(childName)+'</h1></div>';
    html += '<button class="btn" style="background:#0B6E4F;color:white;padding:10px 18px;" onclick="ParentPortal.printChildReport(\'finance\')">🖨️ طباعة الكشف</button>';
    html += '</div>';
    
    if(!data.fees.length) {
      html += '<div class="empty" style="text-align:center;padding:60px;">لا توجد بيانات مالية.</div>';
    } else {
      const totalAll = data.fees.reduce(function(s,f){ return s + num(f.net_amount || f.base_amount); }, 0);
      const paidAll = data.fees.reduce(function(s,f){ return s + num(f.total_paid); }, 0);
      const remainingAll = Math.max(totalAll - paidAll, 0);
      
      html += '<div class="kpis" style="margin-bottom:20px;"><div class="kpi blue"><small>إجمالي الرسوم</small><b>'+money(totalAll)+'</b></div><div class="kpi green"><small>المدفوع</small><b>'+money(paidAll)+'</b></div><div class="kpi '+(remainingAll > 0 ? 'red' : 'green')+'"><small>المتبقي</small><b>'+money(remainingAll)+'</b></div></div>';
      html += '<div class="table-wrap"><table><thead><tr><th>الإجمالي</th><th>المدفوع</th><th>المتبقي</th><th>الحالة</th></tr></thead><tbody>';
      data.fees.forEach(function(f) {
        const total = num(f.net_amount || f.base_amount);
        const paid = num(f.total_paid);
        const remaining = Math.max(total - paid, 0);
        const status = remaining === 0 ? '✅ مدفوع كاملاً' : paid > 0 ? '⏳ مدفوع جزئياً' : '❌ غير مدفوع';
        const color = remaining === 0 ? 'green' : paid > 0 ? 'gold' : 'red';
        html += '<tr><td>'+money(total)+'</td><td>'+money(paid)+'</td><td>'+money(remaining)+'</td><td><span class="badge '+color+'">'+status+'</span></td></tr>';
      });
      html += '</tbody></table></div>';
    }
    
    container.innerHTML = html;
  }

  function renderBehavior() {
    const container = $('#view-behavior');
    const data = CHILD_DATA[currentChildId] || {behavior: []};
    const child = CHILDREN.find(function(c){ return c.id === currentChildId; });
    const childName = (child && child.users && child.users.name) || (child && child.name) || 'الطالب';
    
    let html = '<div class="page-head"><div><h1>🌟 سلوك '+esc(childName)+'</h1></div></div>';
    
    if(!data.behavior.length) {
      html += '<div class="empty" style="text-align:center;padding:60px;">لا توجد ملاحظات سلوكية.</div>';
    } else {
      const totalPoints = data.behavior.reduce(function(s,b){ return s + num(b.points || 0); }, 0);
      const color = totalPoints >= 0 ? 'green' : 'red';
      
      html += '<div class="kpis" style="margin-bottom:20px;"><div class="kpi '+color+'"><small>مجموع النقاط</small><b>'+(totalPoints > 0 ? '+' : '')+totalPoints+'</b></div><div class="kpi blue"><small>عدد السجلات</small><b>'+data.behavior.length+'</b></div></div><div class="list">';
      
      data.behavior.forEach(function(b) {
        const points = num(b.points || 0);
        const pointColor = points >= 0 ? 'green' : 'red';
        html += '<div class="item"><div><b>'+esc(b.note || b.description || 'ملاحظة سلوك')+'</b><small>'+esc(String(b.created_at || b.date || '').slice(0,10))+'</small></div><span class="badge '+pointColor+'">'+(points > 0 ? '+' : '')+points+'</span></div>';
      });
      
      html += '</div>';
    }
    
    container.innerHTML = html;
  }

  function requestAppointment() {
    const childObj = CHILDREN.find(function(c){ return c.id === currentChildId; });
    const name = (childObj && childObj.users && childObj.users.name) || (CHILDREN[0] && CHILDREN[0].users && CHILDREN[0].users.name) || 'ابني';
    const date = prompt('متى تريد الموعد؟ (مثال: غداً الساعة 10 صباحاً)');
    if(!date) return;
    
    const reason = prompt('ما سبب الموعد؟ (اختياري)');
    const msg = encodeURIComponent('السلام عليكم،\nأنا ولي أمر الطالب: '+name+'\nأطلب موعداً في: '+date+'\n'+(reason ? 'السبب: ' + reason : ''));
    const phoneClean = SCHOOL_PHONE.replace('+','');
    
    if(confirm('سيتم فتح واتساب لإرسال الطلب. متابعة؟')) {
      window.open('https://wa.me/'+phoneClean+'?text='+msg, '_blank');
    }
  }
  
  function sendMessage() {
    const subject = prompt('موضوع الرسالة:');
    if(!subject) return;
    const body = prompt('نص الرسالة:');
    if(!body) return;
    
    const msg = encodeURIComponent('السلام عليكم،\nأنا ولي أمر: '+ME.name+'\n\nالموضوع: '+subject+'\n\n'+body);
    const phoneClean = SCHOOL_PHONE.replace('+','');
    
    if(confirm('سيتم فتح واتساب لإرسال الرسالة. متابعة؟')) {
      window.open('https://wa.me/'+phoneClean+'?text='+msg, '_blank');
    }
  }

  function printChildReport(type) {
    const child = CHILDREN.find(function(c){ return c.id === currentChildId; });
    if(!child) {
      alert('اختر ابناً أولاً');
      return;
    }
    
    const childName = (child.users && child.users.name) || child.name || 'الطالب';
    const data = CHILD_DATA[currentChildId] || {attendance: [], grades: [], fees: [], behavior: []};
    const today = new Date().toLocaleDateString('ar-IQ');
    
    let title = '';
    let content = '';
    
    if(type === 'full') {
      title = 'التقرير الشامل';
      content = buildFullReport(childName, data);
    } else if(type === 'attendance') {
      title = 'كشف الحضور والغياب';
      content = buildAttendanceReport(childName, data);
    } else if(type === 'grades') {
      title = 'كشف الدرجات';
      content = buildGradesReport(childName, data);
    } else if(type === 'finance') {
      title = 'كشف الأقساط المالية';
      content = buildFinanceReport(childName, data);
    }
    
    const printWindow = window.open('', '_blank', 'width=900,height=700');
    printWindow.document.write(buildPrintHTML(title, childName, today, content));
    printWindow.document.close();
    
    setTimeout(function() {
      printWindow.print();
    }, 500);
  }
  
  function buildPrintHTML(title, childName, today, content) {
    return '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>'+title+' - '+childName+'</title>'+
      '<style>'+
      '* { margin: 0; padding: 0; box-sizing: border-box; }'+
      'body { font-family: "Cairo", "Segoe UI", Tahoma, sans-serif; padding: 30px; color: #333; line-height: 1.6; }'+
      '.print-header { text-align: center; padding-bottom: 20px; border-bottom: 3px double #0B6E4F; margin-bottom: 30px; }'+
      '.print-header h1 { color: #0B6E4F; font-size: 28px; margin-bottom: 8px; }'+
      '.print-header h2 { color: #555; font-size: 18px; font-weight: normal; }'+
      '.print-header .date { color: #888; font-size: 14px; margin-top: 8px; }'+
      '.info-box { background: #f3f4f6; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-right: 4px solid #3A3565; }'+
      '.info-box h3 { color: #0B6E4F; margin-bottom: 8px; }'+
      'table { width: 100%; border-collapse: collapse; margin: 20px 0; }'+
      'table th { background: #0B6E4F; color: white; padding: 12px; text-align: right; }'+
      'table td { padding: 10px 12px; border-bottom: 1px solid #e5e7eb; }'+
      'table tr:nth-child(even) td { background: #f9fafb; }'+
      '.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 20px 0; }'+
      '.stat-card { background: #f3f4f6; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #d1d5db; }'+
      '.stat-card .label { color: #6b7280; font-size: 13px; margin-bottom: 5px; }'+
      '.stat-card .value { color: #0B6E4F; font-size: 24px; font-weight: bold; }'+
      '.section-title { color: #0B6E4F; font-size: 18px; margin: 25px 0 12px; padding-bottom: 8px; border-bottom: 2px solid #0B6E4F; }'+
      '.badge-green { background: #E6F4EF; color: #065f46; padding: 3px 10px; border-radius: 4px; font-size: 12px; }'+
      '.badge-red { background: #fee2e2; color: #991b1b; padding: 3px 10px; border-radius: 4px; font-size: 12px; }'+
      '.badge-gold { background: #FBF1DC; color: #92400e; padding: 3px 10px; border-radius: 4px; font-size: 12px; }'+
      '.print-footer { margin-top: 50px; padding-top: 20px; border-top: 2px dashed #ccc; text-align: center; color: #666; font-size: 13px; }'+
      '.signature { display: flex; justify-content: space-around; margin-top: 60px; }'+
      '.signature div { text-align: center; }'+
      '.signature .line { width: 200px; border-top: 1px solid #333; padding-top: 5px; }'+
      '@media print { body { padding: 15px; } .no-print { display: none !important; } @page { size: A4; margin: 1cm; } }'+
      '.print-btn { position: fixed; top: 20px; left: 20px; background: #0B6E4F; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; box-shadow: 0 4px 12px rgba(30,64,175,0.3); }'+
      '</style></head><body>'+
      '<button class="print-btn no-print" onclick="window.print()">🖨️ طباعة الآن</button>'+
      '<div class="print-header">'+
      '<h1>'+SCHOOL_LOGO+' '+SCHOOL_NAME+'</h1>'+
      '<h2>'+title+'</h2>'+
      '<div class="date">📅 تاريخ التقرير: '+today+'</div>'+
      '</div>'+
      '<div class="info-box">'+
      '<h3>👤 معلومات الطالب</h3>'+
      '<div><b>الاسم:</b> '+esc(childName)+'</div>'+
      '<div><b>ولي الأمر:</b> '+esc(ME.name||'')+'</div>'+
      '</div>'+
      content+
      '<div class="signature">'+
      '<div><div class="line">توقيع ولي الأمر</div></div>'+
      '<div><div class="line">ختم المدرسة</div></div>'+
      '</div>'+
      '<div class="print-footer">'+
      '<div>📞 '+SCHOOL_PHONE+' | '+SCHOOL_NAME+'</div>'+
      '<div>تم إنشاء هذا التقرير من النظام الإلكتروني للمدرسة</div>'+
      '</div>'+
<script src="assets/avatar.js"></script>
      '<script src="assets/amin-theme-injector.js"><\/script></body></html>';
  }
  
  function buildFullReport(childName, data) {
    let html = '';
    
    const presentCount = data.attendance.filter(function(a){ return a.status === 'present'; }).length;
    const absentCount = data.attendance.filter(function(a){ return a.status === 'absent'; }).length;
    const totalAtt = data.attendance.length;
    const attRate = totalAtt ? Math.round((presentCount/totalAtt) * 100) : 0;
    
    const fee = data.fees[0];
    const total = num(fee && (fee.net_amount || fee.base_amount));
    const paid = num(fee && fee.total_paid);
    const remaining = Math.max(total - paid, 0);
    
    const gradesAvg = data.grades.length ? Math.round(data.grades.reduce(function(s,g){ return s + num(g.score || g.grade || g.mark); }, 0) / data.grades.length) : 0;
    
    html += '<div class="section-title">📊 ملخص الأداء</div>';
    html += '<div class="stat-grid">';
    html += '<div class="stat-card"><div class="label">نسبة الحضور</div><div class="value">'+attRate+'%</div></div>';
    html += '<div class="stat-card"><div class="label">أيام الغياب</div><div class="value">'+absentCount+'</div></div>';
    html += '<div class="stat-card"><div class="label">المعدل العام</div><div class="value">'+gradesAvg+'%</div></div>';
    html += '<div class="stat-card"><div class="label">المتبقي</div><div class="value">$'+remaining+'</div></div>';
    html += '</div>';
    
    if(data.grades.length) {
      html += '<div class="section-title">📚 الدرجات</div>';
      html += '<table><thead><tr><th>المادة</th><th>الدرجة</th><th>التقييم</th></tr></thead><tbody>';
      data.grades.forEach(function(g) {
        const score = num(g.score || g.grade || g.mark);
        const badge = score >= 85 ? 'badge-green' : score >= 60 ? 'badge-gold' : 'badge-red';
        const eval2 = score >= 85 ? 'ممتاز' : score >= 60 ? 'جيد' : 'يحتاج تحسين';
        html += '<tr><td>'+esc(getSubjectName(g.subject_id))+'</td><td><span class="'+badge+'">'+score+'</span></td><td>'+eval2+'</td></tr>';
      });
      html += '</tbody></table>';
    }
    
    if(data.attendance.length) {
      html += '<div class="section-title">📋 آخر سجلات الحضور</div>';
      html += '<table><thead><tr><th>التاريخ</th><th>الحالة</th><th>ملاحظة</th></tr></thead><tbody>';
      data.attendance.slice(0, 10).forEach(function(a) {
        const status = a.status || '—';
        const badge = status === 'present' ? 'badge-green' : status === 'absent' ? 'badge-red' : 'badge-gold';
        const label = status === 'present' ? 'حاضر' : status === 'absent' ? 'غائب' : status === 'late' ? 'متأخر' : status;
        html += '<tr><td>'+esc(String(a.date).slice(0,10))+'</td><td><span class="'+badge+'">'+label+'</span></td><td>'+esc(a.note || '—')+'</td></tr>';
      });
      html += '</tbody></table>';
    }
    
    if(data.fees.length) {
      html += '<div class="section-title">💰 الوضع المالي</div>';
      html += '<table><thead><tr><th>الإجمالي</th><th>المدفوع</th><th>المتبقي</th><th>الحالة</th></tr></thead><tbody>';
      data.fees.forEach(function(f) {
        const t = num(f.net_amount || f.base_amount);
        const p = num(f.total_paid);
        const r = Math.max(t - p, 0);
        const status = r === 0 ? 'مدفوع كاملاً' : p > 0 ? 'مدفوع جزئياً' : 'غير مدفوع';
        const badge = r === 0 ? 'badge-green' : p > 0 ? 'badge-gold' : 'badge-red';
        html += '<tr><td>$'+t+'</td><td>$'+p+'</td><td>$'+r+'</td><td><span class="'+badge+'">'+status+'</span></td></tr>';
      });
      html += '</tbody></table>';
    }
    
    return html;
  }
  
  function buildAttendanceReport(childName, data) {
    const present = data.attendance.filter(function(a){ return a.status === 'present'; }).length;
    const absent = data.attendance.filter(function(a){ return a.status === 'absent'; }).length;
    const late = data.attendance.filter(function(a){ return a.status === 'late'; }).length;
    const total = data.attendance.length;
    const rate = total ? Math.round((present/total)*100) : 0;
    
    let html = '<div class="section-title">📊 الإحصائيات</div>';
    html += '<div class="stat-grid">';
    html += '<div class="stat-card"><div class="label">أيام الحضور</div><div class="value">'+present+'</div></div>';
    html += '<div class="stat-card"><div class="label">أيام الغياب</div><div class="value">'+absent+'</div></div>';
    html += '<div class="stat-card"><div class="label">أيام التأخير</div><div class="value">'+late+'</div></div>';
    html += '<div class="stat-card"><div class="label">نسبة الحضور</div><div class="value">'+rate+'%</div></div>';
    html += '</div>';
    
    if(data.attendance.length) {
      html += '<div class="section-title">📋 التفاصيل الكاملة</div>';
      html += '<table><thead><tr><th>#</th><th>التاريخ</th><th>الحالة</th><th>ملاحظة</th></tr></thead><tbody>';
      data.attendance.forEach(function(a, i) {
        const status = a.status || '—';
        const badge = status === 'present' ? 'badge-green' : status === 'absent' ? 'badge-red' : 'badge-gold';
        const label = status === 'present' ? 'حاضر' : status === 'absent' ? 'غائب' : status === 'late' ? 'متأخر' : status;
        html += '<tr><td>'+(i+1)+'</td><td>'+esc(String(a.date).slice(0,10))+'</td><td><span class="'+badge+'">'+label+'</span></td><td>'+esc(a.note || '—')+'</td></tr>';
      });
      html += '</tbody></table>';
    } else {
      html += '<p style="text-align:center;padding:30px;color:#888;">لا توجد سجلات حضور.</p>';
    }
    
    return html;
  }
  
  function buildGradesReport(childName, data) {
    const avg = data.grades.length ? Math.round(data.grades.reduce(function(s,g){ return s + num(g.score || g.grade || g.mark); }, 0) / data.grades.length) : 0;
    const excellent = data.grades.filter(function(g){ return num(g.score || g.grade || g.mark) >= 85; }).length;
    const good = data.grades.filter(function(g){ var v=num(g.score || g.grade || g.mark); return v >= 60 && v < 85; }).length;
    const weak = data.grades.filter(function(g){ return num(g.score || g.grade || g.mark) < 60; }).length;
    
    let html = '<div class="section-title">📊 ملخص الأداء الأكاديمي</div>';
    html += '<div class="stat-grid">';
    html += '<div class="stat-card"><div class="label">المعدل العام</div><div class="value">'+avg+'%</div></div>';
    html += '<div class="stat-card"><div class="label">ممتاز (85+)</div><div class="value">'+excellent+'</div></div>';
    html += '<div class="stat-card"><div class="label">جيد (60-84)</div><div class="value">'+good+'</div></div>';
    html += '<div class="stat-card"><div class="label">يحتاج تحسين</div><div class="value">'+weak+'</div></div>';
    html += '</div>';
    
    if(data.grades.length) {
      html += '<div class="section-title">📚 تفاصيل الدرجات</div>';
      html += '<table><thead><tr><th>#</th><th>المادة</th><th>الدرجة</th><th>التقييم</th><th>ملاحظة</th></tr></thead><tbody>';
      data.grades.forEach(function(g, i) {
        const score = num(g.score || g.grade || g.mark);
        const badge = score >= 85 ? 'badge-green' : score >= 60 ? 'badge-gold' : 'badge-red';
        const eval2 = score >= 85 ? 'ممتاز' : score >= 60 ? 'جيد' : 'يحتاج تحسين';
        html += '<tr><td>'+(i+1)+'</td><td>'+esc(getSubjectName(g.subject_id))+'</td><td><span class="'+badge+'">'+score+'</span></td><td>'+eval2+'</td><td>'+esc(g.notes || g.note || '—')+'</td></tr>';
      });
      html += '</tbody></table>';
    } else {
      html += '<p style="text-align:center;padding:30px;color:#888;">لا توجد درجات مسجلة بعد.</p>';
    }
    
    return html;
  }
  
  function buildFinanceReport(childName, data) {
    const totalAll = data.fees.reduce(function(s,f){ return s + num(f.net_amount || f.base_amount); }, 0);
    const paidAll = data.fees.reduce(function(s,f){ return s + num(f.total_paid); }, 0);
    const remainingAll = Math.max(totalAll - paidAll, 0);
    
    let html = '<div class="section-title">💰 الملخص المالي</div>';
    html += '<div class="stat-grid">';
    html += '<div class="stat-card"><div class="label">إجمالي الرسوم</div><div class="value">$'+totalAll+'</div></div>';
    html += '<div class="stat-card"><div class="label">المدفوع</div><div class="value">$'+paidAll+'</div></div>';
    html += '<div class="stat-card"><div class="label">المتبقي</div><div class="value">$'+remainingAll+'</div></div>';
    html += '<div class="stat-card"><div class="label">نسبة السداد</div><div class="value">'+(totalAll ? Math.round((paidAll/totalAll)*100) : 0)+'%</div></div>';
    html += '</div>';
    
    if(data.fees.length) {
      html += '<div class="section-title">📋 تفاصيل الأقساط</div>';
      html += '<table><thead><tr><th>#</th><th>الإجمالي</th><th>المدفوع</th><th>المتبقي</th><th>الحالة</th></tr></thead><tbody>';
      data.fees.forEach(function(f, i) {
        const t = num(f.net_amount || f.base_amount);
        const p = num(f.total_paid);
        const r = Math.max(t - p, 0);
        const status = r === 0 ? 'مدفوع كاملاً' : p > 0 ? 'مدفوع جزئياً' : 'غير مدفوع';
        const badge = r === 0 ? 'badge-green' : p > 0 ? 'badge-gold' : 'badge-red';
        html += '<tr><td>'+(i+1)+'</td><td>$'+t+'</td><td>$'+p+'</td><td>$'+r+'</td><td><span class="'+badge+'">'+status+'</span></td></tr>';
      });
      html += '</tbody></table>';
    } else {
      html += '<p style="text-align:center;padding:30px;color:#888;">لا توجد بيانات مالية.</p>';
    }
    
    return html;
  }

  async function selectChild(childId) {
    currentChildId = childId;
    const selector = $('#childSelector');
    if(selector) selector.value = childId;
    if(!CHILD_DATA[childId]) await loadChildData(childId);
    renderOverview();
  }

  async function viewChild(childId, view) {
    currentChildId = childId;
    const selector = $('#childSelector');
    if(selector) selector.value = childId;
    if(!CHILD_DATA[childId]) await loadChildData(childId);
    showView(view);
    document.querySelectorAll('.nav button[data-view]').forEach(function(b) {
      b.classList.toggle('active', b.dataset.view === view);
    });
  }

  window.addEventListener('load', init);
  
  window.ParentPortal = {
    init: init,
    showView: showView,
    renderOverview: renderOverview,
    loadChildData: loadChildData,
    selectChild: selectChild,
    viewChild: viewChild,
    requestAppointment: requestAppointment,
    sendMessage: sendMessage,
    printChildReport: printChildReport
  };
