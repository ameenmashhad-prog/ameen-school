<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدرسة أمين الرضا - لوحة التحكم</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts (Cairo) -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: radial-gradient(circle at top left, #1e293b, #0f172a);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .module-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .module-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.2);
      border-color: rgba(59, 130, 246, 0.4);
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen pb-12">

  <!-- شريط التنقل العلوي -->
  <header class="w-full glass-card sticky top-0 z-50 px-6 py-4 flex justify-between items-center shadow-lg">
    <div class="flex items-center gap-3">
      <div class="bg-blue-600 p-2 rounded-lg text-white">
        <i data-lucide="graduation-cap" class="w-8 h-8"></i>
      </div>
      <div>
        <h1 class="font-extrabold text-xl tracking-wide bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
          مدرسة أمين الرضا
        </h1>
        <p class="text-xs text-slate-400">نظام الإدارة المدرسية المتكامل</p>
      </div>
    </div>
    
    <div class="flex items-center gap-4">
      <div class="text-left hidden md:block">
        <p class="font-bold text-sm" id="user-display-name">جاري التحميل...</p>
        <span class="text-xs bg-slate-800 text-blue-400 px-2 py-0.5 rounded-full" id="user-display-role">...</span>
      </div>
      <button onclick="handleLogout()" class="bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-white p-2.5 rounded-lg transition-all duration-200" title="تسجيل الخروج">
        <i data-lucide="log-out" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <!-- المحتوى الرئيسي -->
  <main class="max-w-7xl mx-auto px-6 mt-8">
    
    <!-- واجهات مخصصة ترحيبية -->
    <div class="mb-8 p-6 rounded-2xl glass-card relative overflow-hidden">
      <div class="absolute right-0 top-0 w-1/3 h-full bg-gradient-to-l from-blue-600/10 to-transparent pointer-events-none"></div>
      <h2 class="text-2xl font-black mb-2" id="welcome-title">أهلاً بك في نظام أمين الرضا الذكي</h2>
      <p class="text-slate-300 text-sm max-w-2xl">
        لا تظهر هنا إلا الأقسام المسموحة لحسابك وصلاحياتك الحالية. يمكنك التنقل بين الخدمات التشغيلية اليومية أدناه.
      </p>
    </div>

    <!-- مكان تحميل وتوزيع الموديلات ديناميكياً -->
    <div id="categories-container" class="space-y-12">
      <!-- جاري التحميل Skeleton -->
      <div class="animate-pulse space-y-4">
        <div class="h-6 bg-slate-700 rounded w-1/4"></div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="h-32 bg-slate-800 rounded-xl"></div>
          <div class="h-32 bg-slate-800 rounded-xl"></div>
          <div class="h-32 bg-slate-800 rounded-xl"></div>
        </div>
      </div>
    </div>

  </main>

  <script>
    // الإعدادات الأساسية للاتصال بالبروكسي
    const SUPABASE_URL = window.location.origin + '/api';
    // مفتاح الـ Anon Key الخاص بمشروعك
 const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92Y2p6c3JxcWdqc2Jxc3d0a3JvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MjIxNjIsImV4cCI6MjA5NjE5ODE2Mn0._sPE8K26oTCEGlxBaG_vBk-U2yDNKFV1por5YIv8xko";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // تسميات الأقسام العربية والترتيب
    const CATEGORY_NAMES = {
      'main': 'الواجهات الرئيسية',
      'hr_services': 'الموارد البشرية والخدمات',
      'finance': 'المالية والمصروفات',
      'academic': 'الأكاديمي والجداول',
      'exams': 'الواجبات والاختبارات',
      'resources': 'الموارد والمرافق'
    };

    // التحقق من وجود الجلسة والبدء
    async function initDashboard() {
      const { data: { session }, error: sessionError } = await sb.auth.getSession();
      
      if (sessionError || !session) {
        console.log("لا توجد جلسة نشطة، إعادة توجيه...");
        window.location.href = 'index.html';
        return;
      }

      try {
        const userId = session.user.id;

        // جلب معلومات الملف الشخصي والدور من جدول users
        const { data: profile, error: profileError } = await sb
          .from('users')
          .select('full_name, role')
          .eq('id', userId)
          .single();

        if (profileError || !profile) {
          throw new Error("فشل جلب بيانات المستخدم الشخصية");
        }

        // تحديث واجهة المستخدم العلوية باسم المستخدم ودوره
        document.getElementById('user-display-name').innerText = profile.full_name;
        document.getElementById('user-display-role').innerText = translateRole(profile.role);
        document.getElementById('welcome-title').innerText = `أهلاً بك مجدداً، ${profile.full_name.split(' ')[0]} 👋`;

        // جلب الصلاحيات والصفحات المسموحة لهذا الدور (Role)
        await loadAllowedModules(profile.role);

      } catch (err) {
        console.error(err);
        document.getElementById('categories-container').innerHTML = `
          <div class="bg-red-500/10 border border-red-500/20 p-6 rounded-xl text-red-400 text-center">
             فشل تحميل لوحة التحكم: ${err.message}. يرجى محاولة تسجيل الدخول مرة أخرى.
          </div>
        `;
      }
    }

    // جلب الوحدات المسموحة للدور الحالي
    async function loadAllowedModules(role) {
      const { data: permissions, error: permError } = await sb
        .from('role_module_permissions')
        .select(`
          module_key,
          app_modules:module_key (
            title,
            description,
            category,
            icon,
            route,
            sort_order,
            badge_text,
            is_active
          )
        `)
        .eq('role', role)
        .eq('can_view', true);

      if (permError) throw permError;

      // تصفية وتجهيز البيانات
      const allowedModules = permissions
        .map(p => p.app_modules)
        .filter(m => m && m.is_active)
        .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));

      renderModules(allowedModules);
    }

    // عرض وتوزيع الكروت ديناميكياً بالمجموعات والألوان
    function renderModules(modules) {
      const container = document.getElementById('categories-container');
      container.innerHTML = '';

      if (modules.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-slate-400">
            <i data-lucide="lock" class="w-12 h-12 mx-auto mb-3 opacity-50"></i>
            <p>لا توجد واجهات مفعلة لحسابك حالياً. يرجى مراجعة إدارة النظام.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      // تقسيم الموديلات حسب المجموعة (Category)
      const grouped = {};
      modules.forEach(m => {
        if (!grouped[m.category]) grouped[m.category] = [];
        grouped[m.category].push(m);
      });

      // رندرة المجموعات في الصفحة
      for (const [catKey, catModules] of Object.entries(grouped)) {
        const catTitle = CATEGORY_NAMES[catKey] || catKey;
        
        const section = document.createElement('section');
        section.className = 'space-y-4';
        
        section.innerHTML = `
          <div class="flex items-center gap-3 border-b border-slate-800 pb-2">
            <span class="w-1 h-6 bg-blue-500 rounded"></span>
            <h3 class="text-lg font-extrabold text-slate-200">${catTitle}</h3>
            <span class="text-xs bg-slate-800 text-slate-400 px-2.5 py-0.5 rounded-full">${catModules.length}</span>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            ${catModules.map(m => `
              <a href="${m.route}" class="module-card glass-card p-5 rounded-2xl flex items-start gap-4 cursor-pointer hover:border-blue-500/40">
                <div class="p-3 bg-blue-500/10 text-blue-400 rounded-xl">
                  <i data-lucide="${m.icon || 'arrow-up-right'}" class="w-6 h-6"></i>
                </div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center justify-between gap-2 mb-1">
                    <h4 class="font-bold text-slate-100 truncate text-sm md:text-base">${m.title}</h4>
                    ${m.badge_text ? `<span class="text-[10px] bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded font-bold">${m.badge_text}</span>` : ''}
                  </div>
                  <p class="text-xs text-slate-400 line-clamp-2 leading-relaxed">${m.description || ''}</p>
                </div>
              </a>
            `).join('')}
          </div>
        `;
        container.appendChild(section);
      }

      // تفعيل الأيقونات ديناميكياً
      lucide.createIcons();
    }

    // ترجمة الأدوار للعربية لجمال المظهر
    function translateRole(role) {
      const roles = {
        'admin': 'مدير النظام',
        'teacher': 'معلم',
        'student': 'طالب',
        'parent': 'ولي أمر',
        'finance': 'المسؤول المالي',
        'discipline': 'المشرف التربوي'
      };
      return roles[role] || role;
    }

    // تسجيل الخروج
    async function handleLogout() {
      if (confirm("هل تريد تسجيل الخروج بالفعل؟")) {
        await sb.auth.signOut();
        window.location.href = 'index.html';
      }
    }

    // بدء التشغيل
    window.onload = initDashboard;
  </script>
</body>
</html>
