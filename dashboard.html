<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدرسة أمين الرضا - لوحة التحكم</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f1f5f9;
      min-height: 100vh;
      padding-bottom: 40px;
    }
    header {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      background: linear-gradient(135deg, #3b82f6, #10b981);
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
    }
    .logo h1 {
      font-size: 20px;
      background: linear-gradient(90deg, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: bold;
    }
    .logo p { font-size: 11px; color: #94a3b8; }
    .user-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .user-details { text-align: left; }
    .user-details p { font-weight: bold; font-size: 14px; }
    .role-badge {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 11px;
      display: inline-block;
      margin-top: 2px;
    }
    .logout-btn {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
    }
    .logout-btn:hover {
      background: #ef4444;
      color: white;
    }
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }
    .welcome-banner {
      background: rgba(30, 41, 59, 0.7);
      padding: 24px;
      border-radius: 16px;
      margin-bottom: 32px;
      border: 1px solid rgba(255,255,255,0.08);
      position: relative;
      overflow: hidden;
    }
    .welcome-banner h2 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    .welcome-banner p {
      color: #cbd5e1;
      font-size: 14px;
    }
    .category-section { margin-bottom: 40px; }
    .category-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .category-title .bar {
      width: 4px;
      height: 24px;
      background: #3b82f6;
      border-radius: 2px;
    }
    .category-title h3 {
      font-size: 18px;
      font-weight: bold;
    }
    .count-badge {
      background: rgba(100, 116, 139, 0.2);
      color: #94a3b8;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 11px;
    }
    .modules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }
    .module-card {
      background: rgba(30, 41, 59, 0.7);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      gap: 16px;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      color: inherit;
    }
    .module-card:hover {
      transform: translateY(-4px);
      border-color: rgba(59, 130, 246, 0.4);
      box-shadow: 0 10px 30px rgba(59, 130, 246, 0.15);
    }
    .module-icon {
      background: rgba(59, 130, 246, 0.1);
      color: #60a5fa;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .module-content { flex: 1; min-width: 0; }
    .module-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .module-title {
      font-weight: bold;
      font-size: 15px;
    }
    .module-badge {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: bold;
    }
    .module-desc {
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.5;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .loader, .empty {
      text-align: center;
      padding: 60px 20px;
      color: #94a3b8;
    }
    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.5;
    }
    .error-box {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 24px;
      border-radius: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon">🎓</div>
      <div>
        <h1>مدرسة أمين الرضا</h1>
        <p>نظام الإدارة المدرسية المتكامل</p>
      </div>
    </div>
    <div class="user-info">
      <div class="user-details">
        <p id="user-display-name">جاري التحميل...</p>
        <span class="role-badge" id="user-display-role">...</span>
      </div>
      <button class="logout-btn" onclick="handleLogout()">خروج</button>
    </div>
  </header>

  <main>
    <div class="welcome-banner">
      <h2 id="welcome-title">أهلاً بك في نظام أمين الرضا</h2>
      <p>لا تظهر هنا إلا الأقسام المسموحة لحسابك وصلاحياتك الحالية.</p>
    </div>

    <div id="categories-container">
      <div class="loader">⏳ جاري تحميل الواجهات...</div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = window.location.origin + '/api';
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92Y2p6c3JxcWdqc2Jxc3d0a3JvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MjIxNjIsImV4cCI6MjA5NjE5ODE2Mn0._sPE8K26oTCEGlxBaG_vBk-U2yDNKFV1por5YIv8xko";

    const CATEGORY_NAMES = {
      'main': '🏠 الواجهات الرئيسية',
      'hr_services': '👥 الموارد البشرية والخدمات',
      'analytics': '📊 التحليلات وإدارة النظام',
      'finance': '💰 المالية',
      'academic': '📚 الأكاديمي والجداول',
      'exams': '✍️ الواجبات والاختبارات',
      'resources': '📦 الموارد والمرافق'
    };

    const MODULE_ICONS = {
      'calendar': '📅', 'award': '🏆', 'settings': '⚙️',
      'briefcase': '💼', 'user': '👤', 'shield': '🛡️',
      'users': '👥', 'file-text': '📄', 'key': '🔑',
      'bell': '🔔', 'bar-chart': '📊', 'trending-up': '📈',
      'megaphone': '📢', 'check-circle': '✅', 'shield-check': '🔒',
      'tool': '🔧', 'dollar-sign': '💵', 'archive': '📦',
      'printer': '🖨️', 'activity': '📉', 'phone-call': '📞',
      'credit-card': '💳', 'sliders': '🎚️', 'book-open': '📖',
      'map': '🗺️', 'clock': '🕐', 'layers': '🗂️',
      'edit-3': '✏️', 'bar-chart-2': '📊', 'list': '📋',
      'database': '🗄️', 'monitor': '🖥️', 'eye': '👁️',
      'book': '📚', 'shopping-cart': '🛒', 'package': '📦',
      'flask': '🧪', 'truck': '🚌', 'folder': '📁'
    };

    function getToken() {
      try {
        const session = localStorage.getItem('sb_session');
        if (!session) return null;
        return JSON.parse(session).access_token;
      } catch { return null; }
    }

    function getUserId() {
      try {
        const session = localStorage.getItem('sb_session');
        if (!session) return null;
        const parsed = JSON.parse(session);
        return parsed.user?.id || parsed.user_id;
      } catch { return null; }
    }

    async function apiGet(path) {
      const token = getToken();
      const res = await fetch(SUPABASE_URL + path, {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + (token || SUPABASE_KEY),
          'Content-Type': 'application/json'
        }
      });
      if (!res.ok) throw new Error('فشل الاتصال: ' + res.status);
      return await res.json();
    }

    async function initDashboard() {
      const userId = getUserId();
      if (!userId) {
        window.location.href = 'index.html';
        return;
      }

      try {
        // جلب بيانات المستخدم
        const users = await apiGet(`/rest/v1/users?id=eq.${userId}&select=name,role`);
        
        if (!users || users.length === 0) {
          throw new Error('لم يتم العثور على بيانات المستخدم');
        }

        const profile = users[0];
        document.getElementById('user-display-name').textContent = profile.name || 'مستخدم';
        document.getElementById('user-display-role').textContent = translateRole(profile.role);
        document.getElementById('welcome-title').textContent = `أهلاً بك، ${(profile.name || '').split(' ')[0]} 👋`;

        // جلب الصلاحيات
        const permissions = await apiGet(
          `/rest/v1/role_module_permissions?role=eq.${profile.role}&can_view=eq.true&select=module_key,app_modules!inner(title,description,category,icon,route,sort_order,badge_text,is_active)`
        );

        const modules = permissions
          .map(p => p.app_modules)
          .filter(m => m && m.is_active)
          .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));

        renderModules(modules);

      } catch (err) {
        console.error(err);
        document.getElementById('categories-container').innerHTML = `
          <div class="error-box">
            ❌ فشل تحميل لوحة التحكم<br>
            <small>${err.message}</small>
          </div>
        `;
      }
    }

    function renderModules(modules) {
      const container = document.getElementById('categories-container');
      
      if (modules.length === 0) {
        container.innerHTML = `
          <div class="empty">
            <div class="empty-icon">🔒</div>
            <p>لا توجد واجهات مفعلة لحسابك حالياً.</p>
          </div>
        `;
        return;
      }

      const grouped = {};
      modules.forEach(m => {
        if (!grouped[m.category]) grouped[m.category] = [];
        grouped[m.category].push(m);
      });

      let html = '';
      for (const [catKey, catModules] of Object.entries(grouped)) {
        const catTitle = CATEGORY_NAMES[catKey] || catKey;
        html += `
          <section class="category-section">
            <div class="category-title">
              <span class="bar"></span>
              <h3>${catTitle}</h3>
              <span class="count-badge">${catModules.length}</span>
            </div>
            <div class="modules-grid">
              ${catModules.map(m => `
                <a href="${m.route}" class="module-card">
                  <div class="module-icon">${MODULE_ICONS[m.icon] || '📌'}</div>
                  <div class="module-content">
                    <div class="module-header">
                      <span class="module-title">${m.title}</span>
                      ${m.badge_text ? `<span class="module-badge">${m.badge_text}</span>` : ''}
                    </div>
                    <p class="module-desc">${m.description || ''}</p>
                  </div>
                </a>
              `).join('')}
            </div>
          </section>
        `;
      }
      container.innerHTML = html;
    }

    function translateRole(role) {
      const roles = {
        'admin': 'مدير النظام',
        'teacher': 'معلم',
        'student': 'طالب',
        'parent': 'ولي أمر',
        'finance': 'مالية',
        'discipline': 'مشرف تربوي',
        'counselor': 'مرشد نفسي'
      };
      return roles[role] || role;
    }

    function handleLogout() {
      if (confirm("هل تريد تسجيل الخروج؟")) {
        localStorage.removeItem('sb_session');
        window.location.href = 'index.html';
      }
    }

    window.onload = initDashboard;
  </script>
</body>
</html>
