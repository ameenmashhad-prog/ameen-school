<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدرسة أمين الرضا - لوحة التحكم</title>
    <link rel="stylesheet" href="assets/amin.css?v=20260706-5">
<link rel="stylesheet" href="assets/i18n.css">
<style id="amin-page">
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-arabic);background:var(--bg);color:var(--text-primary);min-height:100vh;}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 24px;background:var(--surface);border-bottom:1px solid var(--border-subtle);position:sticky;top:0;z-index:100;flex-wrap:wrap;}
.logo{display:flex;align-items:center;gap:12px;}
.logo-icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:linear-gradient(135deg,var(--primary),var(--accent));}
.logo h1{font-size:20px;color:var(--text-primary);}
.logo p{font-size:11px;color:var(--text-secondary);}
.user-info{display:flex;align-items:center;gap:16px;}
.user-details{text-align:end;}
.user-details p{font-weight:700;font-size:14px;}
.role-badge{background:var(--primary-tint);color:var(--primary);padding:2px 10px;border-radius:999px;font-size:11px;}
.logout-btn{background:var(--danger-tint);color:var(--danger);border:0;padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:700;min-height:44px;}
.logout-btn:hover{background:var(--danger);color:#fff;}
main{max-width:1200px;margin:0 auto;padding:24px;}
.welcome-banner{background:linear-gradient(145deg,var(--primary-tint),var(--surface));border:1px solid var(--border-subtle);padding:24px;border-radius:18px;margin-bottom:32px;}
.welcome-banner h2{font-size:24px;margin-bottom:8px;color:var(--primary);}
.welcome-banner p{color:var(--text-secondary);font-size:14px;}
.category-section{margin-bottom:40px;}
.category-title{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border-subtle);}
.category-title .bar{width:4px;height:24px;background:linear-gradient(var(--primary),var(--accent));border-radius:2px;}
.category-title h3{font-size:18px;}
.count-badge{background:var(--surface-2);color:var(--text-secondary);padding:2px 10px;border-radius:999px;font-size:11px;}
.modules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
.module-card{display:flex;gap:16px;padding:20px;border-radius:18px;background:var(--surface);border:1px solid var(--border-subtle);box-shadow:var(--shadow-soft);cursor:pointer;transition:transform .2s,box-shadow .2s;text-decoration:none;color:inherit;}
.module-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-soft-lg);}
.module-icon{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--primary-tint);color:var(--primary);flex-shrink:0;}
.module-content{flex:1;min-width:0;}
.module-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.module-title{font-weight:700;font-size:15px;}
.module-badge{background:var(--warning-tint);color:var(--warning-ink,#66540C);border:1px solid rgba(217,119,6,.3);padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;}
.module-desc{color:var(--text-secondary);font-size:12px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.loader,.empty{text-align:center;padding:60px 20px;color:var(--text-secondary);}
.empty-icon{font-size:48px;opacity:.5;margin-bottom:12px;}
.error-box{background:var(--danger-tint);border:1px solid rgba(220,38,38,.3);color:var(--danger);padding:24px;border-radius:12px;text-align:center;}
.debug-box{background:var(--surface-2);border:1px solid var(--border-subtle);color:var(--text-secondary);padding:16px;border-radius:8px;margin-top:16px;font-size:11px;font-family:monospace;text-align:start;direction:ltr;max-height:200px;overflow:auto;}
</style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon">🎓</div>
      <div>
        <h1>مدرسة أمين الرضا</h1>
        <p>نظام الإدارة المدرسية المتكامل</p>
      </div>
    </div>
    <div class="user-info">
      <div class="user-details">
        <p id="user-display-name">جاري التحميل...</p>
        <span class="role-badge" id="user-display-role">...</span>
      </div>
      <button class="logout-btn" onclick="handleLogout()">خروج</button>
    </div>
  </header>

  <main>
    <div class="welcome-banner">
      <h2 id="welcome-title">أهلاً بك في نظام أمين الرضا</h2>
      <p>لا تظهر هنا إلا الأقسام المسموحة لحسابك وصلاحياتك الحالية.</p>
    </div>
    <div id="categories-container">
      <div class="loader">⏳ جاري تحميل الواجهات...</div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = window.location.origin + '/api';
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92Y2p6c3JxcWdqc2Jxc3d0a3JvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MjIxNjIsImV4cCI6MjA5NjE5ODE2Mn0._sPE8K26oTCEGlxBaG_vBk-U2yDNKFV1por5YIv8xko";

    const CATEGORY_NAMES = {
      'main': '🏠 الواجهات الرئيسية',
      'hr_services': '👥 الموارد البشرية والخدمات',
      'analytics': '📊 التحليلات وإدارة النظام',
      'finance': '💰 المالية',
      'academic': '📚 الأكاديمي والجداول',
      'exams': '✍️ الواجبات والاختبارات',
      'resources': '📦 الموارد والمرافق'
    };

    const MODULE_ICONS = {
      'calendar': '📅', 'award': '🏆', 'settings': '⚙️',
      'briefcase': '💼', 'user': '👤', 'shield': '🛡️',
      'users': '👥', 'file-text': '📄', 'key': '🔑',
      'bell': '🔔', 'bar-chart': '📊', 'trending-up': '📈',
      'megaphone': '📢', 'check-circle': '✅', 'shield-check': '🔒',
      'tool': '🔧', 'dollar-sign': '💵', 'archive': '📦',
      'printer': '🖨️', 'activity': '📉', 'phone-call': '📞',
      'credit-card': '💳', 'sliders': '🎚️', 'book-open': '📖',
      'map': '🗺️', 'clock': '🕐', 'layers': '🗂️',
      'edit-3': '✏️', 'bar-chart-2': '📊', 'list': '📋',
      'database': '🗄️', 'monitor': '🖥️', 'eye': '👁️',
      'book': '📚', 'shopping-cart': '🛒', 'package': '📦',
      'flask': '🧪', 'truck': '🚌', 'folder': '📁'
    };

    // البحث عن الجلسة بأي اسم محتمل
    function findSession() {
      const possibleKeys = [
        'sb_session', 'supabase.auth.token', 'sb-access-token',
        'sb-ovcjzsrqqgjsbqswtkro-auth-token', 'session', 'auth'
      ];
      
      // البحث بالأسماء المعروفة
      for (const key of possibleKeys) {
        const val = localStorage.getItem(key);
        if (val) {
          try {
            const parsed = JSON.parse(val);
            if (parsed.access_token || parsed.user || parsed.currentSession) {
              return parsed;
            }
          } catch {}
        }
      }
      
      // البحث في كل localStorage عن أي شيء فيه access_token
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        const val = localStorage.getItem(key);
        try {
          const parsed = JSON.parse(val);
          if (parsed && (parsed.access_token || parsed.currentSession?.access_token)) {
            return parsed.currentSession || parsed;
          }
        } catch {}
      }
      
      return null;
    }

    function getToken(session) {
      return session?.access_token || session?.currentSession?.access_token || null;
    }

    function getUserId(session) {
      return session?.user?.id || session?.currentSession?.user?.id || session?.user_id || null;
    }

    async function apiGet(path, token) {
      const res = await fetch(SUPABASE_URL + path, {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + (token || SUPABASE_KEY),
          'Content-Type': 'application/json'
        }
      });
      if (!res.ok) {
        const text = await res.text();
        throw new Error('فشل: ' + res.status + ' - ' + text);
      }
      return await res.json();
    }

    async function initDashboard() {
      const session = findSession();
      
      if (!session) {
        showError('لم يتم العثور على جلسة. سيتم تحويلك لتسجيل الدخول خلال 5 ثوان...', true);
        setTimeout(() => window.location.href = 'index.html', 5000);
        return;
      }

      const userId = getUserId(session);
      const token = getToken(session);

      if (!userId) {
        showError('الجلسة موجودة لكن معرّف المستخدم غير متوفر.<br>المفاتيح المتاحة: ' + Object.keys(session).join(', '));
        return;
      }

      try {
        const users = await apiGet(`/rest/v1/users?id=eq.${userId}&select=name,role`, token);
        
        if (!users || users.length === 0) {
          throw new Error('المستخدم غير موجود في الجدول. ID: ' + userId);
        }

        const profile = users[0];
        document.getElementById('user-display-name').textContent = profile.name || 'مستخدم';
        document.getElementById('user-display-role').textContent = translateRole(profile.role);
        document.getElementById('welcome-title').textContent = `أهلاً بك، ${(profile.name || '').split(' ')[0]} 👋`;

        const permissions = await apiGet(
          `/rest/v1/role_module_permissions?role=eq.${profile.role}&can_view=eq.true&select=module_key,app_modules!inner(title,description,category,icon,route,sort_order,badge_text,is_active)`,
          token
        );

        const modules = permissions
          .map(p => p.app_modules)
          .filter(m => m && m.is_active)
          .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));

        renderModules(modules);

      } catch (err) {
        showError('فشل تحميل البيانات: ' + err.message);
      }
    }

    function showError(message, redirect) {
      document.getElementById('categories-container').innerHTML = `
        <div class="error-box">
          ❌ ${message}
        </div>
      `;
    }

    function renderModules(modules) {
      const container = document.getElementById('categories-container');
      
      if (modules.length === 0) {
        container.innerHTML = `
          <div class="empty">
            <div class="empty-icon">🔒</div>
            <p>لا توجد واجهات مفعلة لحسابك حالياً.</p>
          </div>
        `;
        return;
      }

      const grouped = {};
      modules.forEach(m => {
        if (!grouped[m.category]) grouped[m.category] = [];
        grouped[m.category].push(m);
      });

      let html = '';
      for (const [catKey, catModules] of Object.entries(grouped)) {
        const catTitle = CATEGORY_NAMES[catKey] || catKey;
        html += `
          <section class="category-section">
            <div class="category-title">
              <span class="bar"></span>
              <h3>${catTitle}</h3>
              <span class="count-badge">${catModules.length}</span>
            </div>
            <div class="modules-grid">
              ${catModules.map(m => `
                <a href="${m.route}" class="module-card">
                  <div class="module-icon">${MODULE_ICONS[m.icon] || '📌'}</div>
                  <div class="module-content">
                    <div class="module-header">
                      <span class="module-title">${m.title}</span>
                      ${m.badge_text ? `<span class="module-badge">${m.badge_text}</span>` : ''}
                    </div>
                    <p class="module-desc">${m.description || ''}</p>
                  </div>
                </a>
              `).join('')}
            </div>
          </section>
        `;
      }
      container.innerHTML = html;
    }

    function translateRole(role) {
      const roles = {
        'admin': 'مدير النظام',
        'teacher': 'معلم',
        'student': 'طالب',
        'parent': 'ولي أمر',
        'finance': 'مالية',
        'discipline': 'مشرف تربوي',
        'counselor': 'مرشد نفسي'
      };
      return roles[role] || role;
    }

    function handleLogout() {
      if (confirm("هل تريد تسجيل الخروج؟")) {
        localStorage.clear();
        window.location.href = 'index.html';
      }
    }

    window.onload = initDashboard;
  </script>
<script src="assets/amin-theme-injector.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/amin-i18n-v2.js"></script>
<script src="assets/i18n-radical.js"></script>
<script src="assets/amin-icons.js?v=20260706-3" defer></script>
<script src="assets/lang-switcher.js"></script>
<script src="assets/google-translate.js"></script>
</body>
</html>
