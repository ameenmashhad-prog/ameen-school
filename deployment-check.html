<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>فحص النسخة المنشورة — أمين الرضا</title>
  <link rel="stylesheet" href="assets/amin.css?v=20260706-5">
<link rel="stylesheet" href="assets/i18n.css">
<style id="amin-page">
*{box-sizing:border-box;}
body{margin:0;font-family:var(--font-arabic);background:var(--bg);color:var(--text-primary);min-height:100vh;padding:24px;}
.check-wrap{max-width:760px;margin:0 auto;}
.check-card{background:var(--surface);border:1px solid var(--border-subtle);border-radius:18px;box-shadow:var(--shadow-soft);padding:24px;margin-bottom:16px;}
.check-card h3{margin:0 0 12px;color:var(--primary);font-size:18px;}
.code{background:var(--surface-2);border:1px solid var(--border-subtle);border-radius:10px;padding:12px;font-family:monospace;font-size:12px;direction:ltr;text-align:start;white-space:pre-wrap;color:var(--text-secondary);overflow:auto;}
.bad{color:var(--danger);font-weight:700;} .ok{color:var(--success);font-weight:700;}
</style>
</head>
  <script src="assets/amin-theme-injector.js"></script>
<body>
<main class="check-wrap">
  <h1>فحص النسخة المنشورة</h1>
  <div class="check-card"><b>الإصدار المتوقع:</b> <span class="code">2026-06-26-runtime3</span></div>
  <div class="check-card"><h2>نتائج الملفات</h2><div id="results">جاري الفحص...</div></div>
  <div class="check-card"><h2>ماذا أفعل إذا ظهر خطأ؟</h2><p>إذا فشل فحص achievements.js أو curriculum-planner.js فهذا يعني أن Vercel أو المتصفح ما زال يقدم نسخة قديمة. ارفعي آخر zip، ثم اعملي Unregister للـ Service Worker و Clear Site Data.</p></div>
</main>
<script src="assets/platform-modules.js"></script><script src="assets/i18n.js"></script>
<script>
(async function(){
  const checks = [
    ['assets/achievements.js?v=20260626-runtime3', txt => !txt.includes('.rpc(\'get_my_badge_progress\').catch') && txt.includes('try{const prog=await client().rpc')],
    ['assets/curriculum-planner.js?v=20260626-runtime3', txt => !txt.includes('get_curriculum_holiday_context') && txt.includes('let ctx={data:null}')],
    ['sql/archive/113_runtime_fix_achievements_curriculum.sql', txt => txt.includes('runtime_fix_achievements_curriculum_health_check')],
    ['assets/amin.css', txt => txt.includes('--primary:#0B6E4F')]
  ];
  const out=[];
  for(const [url,test] of checks){
    try{
      const res=await fetch(url,{cache:'no-store'});
      const txt=await res.text();
      out.push(`<div><span class="${res.ok&&test(txt)?'ok':'bad'}">${res.ok&&test(txt)?'✓':'✗'}</span> ${url} — HTTP ${res.status}</div>`);
    }catch(e){out.push(`<div><span class="bad">✗</span> ${url} — ${e.message}</div>`)}
  }
  document.getElementById('results').innerHTML=out.join('');
})();
</script>
<script src="assets/amin-icons.js?v=20260706-3" defer></script>
<script src="assets/lang-switcher.js"></script>
</body>
</html>
