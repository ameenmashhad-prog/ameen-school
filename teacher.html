<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة المعلم — مدارس أمين الرضا</title>
  <link rel="stylesheet" href="assets/amin.css?v=20260706-5">
<link rel="icon" href="/favicon.ico" sizes="any">

    <div class="profile-mini">

        <b id="profileName">...</b>

    <nav class="nav">
      <button onclick="location.href='portal.html'">🏛️ البوابة الموحدة</button>

      <button data-view="attendance">📋 تحضير الحضور</button>

      <button onclick="location.href='tasks-management.html'">📋 المهام والتكليفات الإدارية</button>
      <button onclick="location.href='certificates-generator.html'">🖨️ شهادات التقدير المطبوعة</button>
      <button onclick="location.href='parent-messages.html'">💬 تواصل أولياء الأمور (واتساب)</button>
      <button onclick="location.href='academic-analytics.html'">🤖 خطط الدعم والتقوية</button>
      <button onclick="location.href='curriculum-planner.html'">📖 مخطط المنهج</button>
      <button onclick="location.href='teacher-exams.html'">📝 بنك الأسئلة</button>
      <button onclick="location.href='homework-reports.html'">📊 تقارير الواجبات</button>
      <button onclick="location.href='smart-calendar.html'">🗓️ التقويم</button>
      <button onclick="location.href='notifications.html'">🔔 الإشعارات</button>
    </nav>

    <div class="side-footer">
      <button id="logoutBtn" class="btn btn-3d-danger block">تسجيل الخروج</button>

  <main class="main" id="mainContent" tabindex="-1">
    <header class="topbar">
      <button class="btn mobile-menu" id="mobileMenuBtn">☰</button>

      <div class="top-actions">
        <button class="btn btn-3d-primary" onclick="TeacherPortal.showView('attendance')">📋 تحضير اليوم</button>
      </div>
    </header>

    <section id="view-overview" class="view active"></section>
    <section id="view-attendance" class="view"></section>
    <section id="view-students" class="view"></section>
    <section id="view-grades" class="view"></section>
    <section id="view-schedule" class="view"></section>

<div id="toast" class="toast"></div>

<script src="libs/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/platform-modules.js"></script>
<script src="assets/i18n.js"></script>

<script src="assets/report-export.js"></script>
<script>
(function(){
  'use strict';

  const SCHOOL_PHONE = '+9647700000000';
  const SCHOOL_NAME = 'مدرسة أمين الرضا';
  const SCHOOL_LOGO = '🎓';
  const DAYS = ['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];

  function $(s, r){r=r||document;return r.querySelector(s)}
  function $$(s, r){r=r||document;return Array.from(r.querySelectorAll(s))}
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
  function num(v){var n=Number(v);return Number.isFinite(n)?n:0}
  function iso(){return new Date().toISOString().slice(0,10)}
  
  let sb = null;
  let ME = null;
  let DATA = {
    schedule: [],
    students: [],
    attendance: [],
    grades: [],
    classes: [],
    subjects: [],
    homeworks: [],
    notifications: [],
    payrollTracking: null
  };
  let SUBJECTS_MAP = {};
  let CLASSES_MAP = {};
  let SELECTED_CLASS_ID = null;
  let SELECTED_DATE = iso();

  function cfg() { return window.AMIN_CONFIG || {}; }
  
  function client() {
    if(sb) return sb;
    if(!window.supabase) throw new Error('Supabase library not loaded');
    sb = window.supabase.createClient(
      cfg().supabaseUrl, 
      cfg().supabaseAnonKey, 
      {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storageKey:(cfg().authStorageKey||'amin-ovcjzsrqqgjsbqswtkro-auth-v2')}}
    );
    return sb;
  }

  function toast(title, msg, type) {
    const t = $('#toast');
    if(!t) return;
    t.innerHTML = '<b>'+esc(title)+'</b><br><span class="muted">'+esc(msg||'')+'</span>';
    t.className = 'toast show ' + (type||'');
    clearTimeout(t._to);
    t._to = setTimeout(function(){t.classList.remove('show')}, 4000);
  }

  function getSubjectName(id) {
    if(!id) return 'مادة';
    return SUBJECTS_MAP[id] || 'مادة';
  }

  function getClassName(id) {
    if(!id) return 'صف';
    return CLASSES_MAP[id] || 'صف';
  }

  async function init() {
    try {
      const c = client();
      
      const sessionRes = await c.auth.getSession();
      const session = sessionRes.data.session;
      if(!session) {
        location.href = 'index.html';
        return;
      }

      const userRes = await c.from('users').select('*').eq('id', session.user.id).maybeSingle();
      if(userRes.error || !userRes.data) {
        toast('خطأ', 'تعذر تحميل بيانات الحساب', 'red');
        return;
      }
      ME = userRes.data;
      window.ME = ME;
      console.log('✅ User loaded:', ME.name, 'Role:', ME.role);

      $('#profileName').textContent = ME.name || ME.email || 'معلم';
      $('#profileRole').textContent = 'معلم';

      $('#logoutBtn').onclick = async function() {
        await c.auth.signOut({scope:'local'}).catch(function(){});
        location.href = 'index.html';
      };

      const mobileBtn = $('#mobileMenuBtn');
      if(mobileBtn) mobileBtn.addEventListener('click', function() {
        const sb = $('#sidebar');
        if(sb) sb.classList.toggle('open');
      });

      const navBtns = document.querySelectorAll('.nav button[data-view]');
      navBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          const view = btn.dataset.view;
          showView(view);
          navBtns.forEach(function(b) { b.classList.toggle('active', b === btn); });
          const sb = $('#sidebar');
          if(sb) sb.classList.remove('open');
        });
      });

      await loadAllData();
      renderOverview();

    } catch(e) {
      console.error('❌ Init error:', e);
      toast('خطأ', e.message, 'red');
    }
  }

  async function loadAllData() {
    const c = client();
    
    try {
      const results = await Promise.all([
        c.from('subjects').select('id, name'),
        c.from('classes').select('id, name'),
        c.from('weekly_schedule').select('*').eq('teacher_id', ME.id),
        c.from('school_notifications').select('*').eq('recipient_user_id', ME.id).order('created_at', {ascending: false}).limit(10).then(function(r){ return r; }).catch(function(){ return {data: []}; }),
        c.rpc('get_my_teacher_payroll_tracking', { p_month: iso().slice(0,7) }).then(function(r){ return r; }).catch(function(){ return {data:null}; })
      ]);
      
      // المواد والصفوف
      (results[0].data || []).forEach(function(s) { SUBJECTS_MAP[s.id] = s.name; });
      (results[1].data || []).forEach(function(c) { CLASSES_MAP[c.id] = c.name; });
      DATA.subjects = results[0].data || [];
      DATA.classes = results[1].data || [];
      DATA.schedule = results[2].data || [];
      DATA.notifications = results[3].data || [];
      DATA.payrollTracking = (results[4] && results[4].data && results[4].data.ok !== false) ? results[4].data : null;
      
      // جلب الطلاب من الصفوف التي يدرّسها المعلم
      const classIds = Array.from(new Set(DATA.schedule.map(function(s){ return s.class_id; }).filter(Boolean)));
      
      if(classIds.length > 0) {
        const studentsRes = await c.from('students').select('*, users:user_id(name, email)').in('class_id', classIds);
        DATA.students = studentsRes.data || [];
        
        const studentIds = DATA.students.map(function(s){ return s.id; });
        
        if(studentIds.length > 0) {
          const subResults = await Promise.all([
            c.from('attendance').select('*').in('student_id', studentIds).order('date', {ascending: false}).limit(500),
            c.from('grades').select('*').in('student_id', studentIds)
          ]);
          DATA.attendance = subResults[0].data || [];
          DATA.grades = subResults[1].data || [];
        }
      }
      
      console.log('✅ Data loaded:', DATA);
    } catch(e) {
      console.error('Data load error:', e);
    }
  }

  function getSmartAlerts() {
    const alerts = [];
    const today = iso();
    
    // لم يتم تحضير الحضور اليوم
    const todayAtt = DATA.attendance.filter(function(a){ return String(a.date).slice(0,10) === today; });
    if(todayAtt.length === 0 && DATA.students.length > 0) {
      alerts.push({type:'danger',icon:'📋',title:'لم تسجل حضور اليوم!',message:'سجّل حضور '+DATA.students.length+' طالب الآن'});
    }
    
    // طلاب لم يحضروا اليوم
    const absentToday = todayAtt.filter(function(a){ return a.status === 'absent'; });
    if(absentToday.length > 0) {
      alerts.push({type:'warning',icon:'⚠️',title:'غياب اليوم',message:absentToday.length+' طالب غائب'});
    }
    
    // طلاب بحاجة متابعة (غياب متكرر)
    const studentAbsents = {};
    DATA.attendance.filter(function(a){ return a.status === 'absent'; }).forEach(function(a){
      studentAbsents[a.student_id] = (studentAbsents[a.student_id] || 0) + 1;
    });
    const needAttention = Object.keys(studentAbsents).filter(function(sid){ return studentAbsents[sid] >= 5; });
    if(needAttention.length > 0) {
      alerts.push({type:'warning',icon:'👥',title:'طلاب يحتاجون متابعة',message:needAttention.length+' طلاب غيابهم مرتفع'});
    }

    if(DATA.payrollTracking && DATA.payrollTracking.monthly_summary) {
      var sum = DATA.payrollTracking.monthly_summary;
      var todaySessions = DATA.payrollTracking.today_sessions || [];
      var missing = todaySessions.filter(function(x){ return num(x.payroll_units) < 1; }).length;
      if(missing > 0) {
        alerts.push({type:'warning',icon:'🧾',title:'حصص غير مكتملة راتبياً',message:missing+' حصة اليوم تحتاج تحضيراً أو واجباً أو تسجيل دخول'});
      }
      if(num(sum.penalty_units) > 0) {
        alerts.push({type:'danger',icon:'⏱️',title:'حسميات تأخير هذا الشهر',message:'تم خصم '+sum.penalty_units+' وحدة من استحقاقك الشهري'});
      }
      (DATA.payrollTracking.lateness_progress || []).forEach(function(rule){
        if(num(rule.remaining_before_next_penalty) > 0 && num(rule.remaining_before_next_penalty) <= 1) {
          alerts.push({type:'warning',icon:'🚨',title:'أنت قريب من حسم جديد',message:'بقي '+rule.remaining_before_next_penalty+' فقط على قاعدة: '+rule.rule_name});
        }
      });
    }
    
    return alerts;
  }

  function renderPayrollStatusCard() {
    if(!DATA.payrollTracking || !DATA.payrollTracking.monthly_summary) return '';
    var sum = DATA.payrollTracking.monthly_summary;
    var todayRows = DATA.payrollTracking.today_sessions || [];
    var progressRows = DATA.payrollTracking.lateness_progress || [];
    var missing = todayRows.filter(function(x){ return num(x.payroll_units) < 1; });
    var statusColor = num(sum.penalty_units) > 0 ? 'red' : (missing.length ? 'gold' : 'green');
    var html = '<div class="card" style="margin-top:16px">';
    html += '<div class="card-head"><h3>وضعي الراتبي هذا الشهر</h3></div><div class="card-body">';
    html += '<div class="kpis" style="margin-bottom:12px">';
    html += '<div class="kpi blue"><small>الوحدات المكتسبة</small><b>'+num(sum.gross_units)+'</b></div>';
    html += '<div class="kpi red"><small>الوحدات المخصومة</small><b>'+num(sum.penalty_units)+'</b></div>';
    html += '<div class="kpi green"><small>صافي الوحدات</small><b>'+num(sum.net_units)+'</b></div>';
    html += '<div class="kpi '+statusColor+'"><small>المبلغ التقديري</small><b>'+money(sum.estimated_amount||0)+'</b></div>';
    html += '</div>';
    if(missing.length) {
      html += '<div class="quick-note" style="margin-bottom:12px"><b>حصص اليوم التي تحتاج استكمال:</b><br>' + missing.map(function(x){ return 'الحصة '+(x.period_number || '—')+' — '+(x.recommended_next_step || 'استكملي الخطوات المطلوبة'); }).join('<br>') + '</div>';
    }
    if(progressRows.length) {
      html += '<div class="quick-note"><b>تقدم التأخير الشهري:</b><br>' + progressRows.map(function(rule){ return rule.rule_name+': مسجل '+num(rule.late_events)+' / المتبقي قبل الحسم '+num(rule.remaining_before_next_penalty); }).join('<br>') + '</div>';
    }
    html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn blue" onclick="TeacherPortal.showView(\'schedule\')">حصصي اليوم</button><button class="btn gold" onclick="TeacherPortal.showView(\'homeworks\')">فتح الواجبات</button></div>';
    html += '</div></div>';
    return html;
  }

  function renderTodaySessionWorkflowCard() {
    var rows = (DATA.payrollTracking && DATA.payrollTracking.today_sessions) || [];
    if(!rows.length) return '';
    var cards = rows.map(function(x){
      var checked = x.late_status && x.late_status !== 'not_checked_in';
      var complete = num(x.payroll_units) >= 1;
      var statusBadge = checked ? (x.late_status === 'late' ? '<span class="badge red">تم مع تأخير</span>' : '<span class="badge green">تم في الوقت</span>') : '<span class="badge blue">غير مسجلة</span>';
      return '<div class="card" style="margin-bottom:12px"><div class="card-body">'
        + '<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap">'
        + '<div><b>الحصة '+esc(x.period_number || '—')+'</b><div class="muted">'+esc(x.start_time || '—')+' · '+esc(x.class_name || '—')+' · '+esc(x.subject_name || '—')+'</div></div>'
        + statusBadge
        + '</div>'
        + '<div class="quick-note" style="margin-top:10px">'
        + '<b>حالة الراتب:</b> '+esc(x.payroll_status || '—')+'<br>'
        + 'الوحدات المكتسبة: <b>'+num(x.payroll_units || 0)+'</b><br>'
        + (complete ? '✅ الحصة مكتملة راتبياً<br>' : '⚠️ '+esc(x.recommended_next_step || 'ما زالت الحصة غير مكتملة')+'<br>')
        + '</div>'
        + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'
        + '<button class="btn blue" onclick="TeacherPortal.checkInSession(\''+x.class_session_id+'\')">'+(checked?'إعادة تسجيل الدخول':'تسجيل الدخول')+'</button>'
        + '<button class="btn gold" onclick="TeacherPortal.quickLessonPlan(\''+x.class_session_id+'\', \''+esc((x.subject_name||'').replace(/'/g,'&#039;'))+'\')">تحضير سريع</button>'
        + '<button class="btn" style="background:#3A3565;color:white" onclick="TeacherPortal.quickHomework(\''+x.class_session_id+'\', \''+esc((x.subject_name||'').replace(/'/g,'&#039;'))+'\')">واجب سريع</button>'
        + '</div>'
        + '</div></div>';
    }).join('');
    return '<div class="card" style="margin-top:16px"><div class="card-head"><h3>حصصي اليوم — التنفيذ السريع</h3></div><div class="card-body">'+cards+'</div></div>';
  }

  async function checkInSession(id) {
    try {
      var res = await client().rpc('teacher_check_in_session', { p_session_id: id, p_checked_in_at: new Date().toISOString(), p_notes: null });
      if (res.error) throw res.error;
      if (res.data && res.data.ok === false) throw new Error(res.data.message || 'تعذر تسجيل الدخول');
      toast('تم', (res.data && res.data.message) || 'تم تسجيل الدخول للحصة', 'green');
      await loadAllData();
      showView('overview');
    } catch (e) {
      toast('تعذر تسجيل الدخول', e.message || String(e), 'red');
    }
  }

  async function quickLessonPlan(sessionId, subjectName) {
    var title = prompt('عنوان الدرس:', subjectName ? ('درس ' + subjectName) : 'تحضير درس');
    if(title === null) return;
    title = (title || '').trim();
    if(!title) { toast('تنبيه','أدخلي عنوان الدرس','red'); return; }
    try {
      var res = await client().rpc('save_lesson_plan', {
        p_session_id: sessionId,
        p_title: title,
        p_objectives: null,
        p_lesson_summary: null,
        p_resources: null,
        p_homework_hint: null
      });
      if (res.error) throw res.error;
      if (res.data && res.data.ok === false) throw new Error(res.data.message || 'تعذر حفظ التحضير');
      toast('تم','تم حفظ التحضير وتثبيت نشاط الحصة','green');
      await loadAllData();
      showView('overview');
    } catch (e) {
      toast('تعذر حفظ التحضير', e.message || String(e), 'red');
    }
  }

  async function quickHomework(sessionId, subjectName) {
    var title = prompt('عنوان الواجب:', subjectName ? ('واجب ' + subjectName) : 'واجب');
    if(title === null) return;
    title = (title || '').trim();
    if(!title) { toast('تنبيه','أدخلي عنوان الواجب','red'); return; }
    var dueDate = prompt('تاريخ التسليم (YYYY-MM-DD):', iso());
    if(dueDate === null) return;
    try {
      var res = await client().rpc('create_session_homework', {
        p_session_id: sessionId,
        p_title: title,
        p_description: null,
        p_due_date: dueDate || null
      });
      if (res.error) throw res.error;
      if (res.data && res.data.ok === false) throw new Error(res.data.message || 'تعذر إنشاء الواجب');
      toast('تم','تم إنشاء الواجب وتثبيت نشاط الحصة','green');
      await loadAllData();
      showView('overview');
    } catch (e) {
      toast('تعذر إنشاء الواجب', e.message || String(e), 'red');
    }
  }

  function showView(viewId) {
    document.querySelectorAll('.view').forEach(function(v) {
      v.classList.toggle('active', v.id === 'view-' + viewId);
    });
    
    if(viewId === 'overview') renderOverview();
    else if(viewId === 'attendance') renderAttendance();
    else if(viewId === 'students') renderStudents();
    else if(viewId === 'grades') renderGrades();
    else if(viewId === 'schedule') renderSchedule();
    else if(viewId === 'homeworks') renderHomeworks();
    else if(viewId === 'leaves') renderLeaves();
    else if(viewId === 'exam_tasks') renderExamTasks();
  }

  function renderOverview() {
    const container = $('#view-overview');
    const alerts = getSmartAlerts();
    const today = iso();
    const todayDay = new Date().getDay() === 5 ? 6 : (new Date().getDay() + 1) % 7;
    
    const todayClasses = DATA.schedule.filter(function(s){ return num(s.day) === todayDay; });
    const todayAtt = DATA.attendance.filter(function(a){ return String(a.date).slice(0,10) === today; });
    const presentCount = todayAtt.filter(function(a){ return a.status === 'present'; }).length;
    const absentCount = todayAtt.filter(function(a){ return a.status === 'absent'; }).length;
    const unreadNotifs = DATA.notifications.filter(function(n){ return !n.read_at; }).length;
    
    let html = '<div class="page-head"><div><h1>أهلاً بك، '+esc(ME.name)+' 👨‍🏫</h1><p>لوحة معلوماتك التشغيلية اليومية'+(unreadNotifs > 0 ? ' · <span class="badge red">'+unreadNotifs+' إشعار</span>' : '')+'</p></div></div>';

    // الإحصائيات
    html += '<div class="kpis" style="margin-bottom:24px;">';
    html += '<div class="kpi blue"><small>طلابي</small><b>'+DATA.students.length+'</b></div>';
    html += '<div class="kpi gold"><small>حصصي اليوم</small><b>'+todayClasses.length+'</b></div>';
    html += '<div class="kpi green"><small>حضور اليوم</small><b>'+presentCount+'</b></div>';
    html += '<div class="kpi red"><small>غياب اليوم</small><b>'+absentCount+'</b></div>';
    html += '</div>';
    
    // التنبيهات
    if(alerts.length > 0) {
      html += '<div class="card"><div class="card-head"><h3>التنبيهات الذكية</h3></div><div class="card-body"><div class="stack">' + alerts.map(function(a){
        return '<div class="alert alert-'+a.type+'"><span class="alert-ic">'+a.icon+'</span><div><b>'+esc(a.title)+'</b><p class="muted">'+esc(a.message)+'</p></div></div>';
      }).join('') + '</div></div></div>';
    } else {
      html += '<div class="amin-empty"><div class="amin-empty-mark"></div><div class="amin-empty-title">لا توجد تنبيهات حالياً</div></div>';
    }

    html += renderPayrollStatusCard();
    html += renderTodaySessionWorkflowCard();

    container.innerHTML = html;
  }

  function wrapCard(title, body){
    return '<div class="card"><div class="card-head"><h3>'+esc(title)+'</h3></div><div class="card-body">'+body+'</div></div>';
  }
  function buildTable(headers, rows){
    var thead = '<tr>'+headers.map(function(h){return '<th>'+esc(h)+'</th>';}).join('')+'</tr>';
    var tbody = rows.length ? rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c==null?'—':c)+'</td>';}).join('')+'</tr>';}).join('') : '<tr><td class="muted" colspan="'+headers.length+'">لا توجد بيانات</td></tr>';
    return '<div class="table-wrap"><table class="table"><thead>'+thead+'</thead><tbody>'+tbody+'</tbody></table></div>';
  }

  function renderAttendance(){
    var c=document.getElementById('view-attendance'); if(!c) return;
    var today=iso();
    var rows = DATA.students.map(function(s){
      var a = DATA.attendance.filter(function(x){return x.student_id===s.id && String(x.date).slice(0,10)===today;})[0];
      var st = a ? (a.status==='present'?'حاضر':(a.status==='absent'?'غائب':'متأخر')) : 'غير مسجّل';
      return [s.name||'—', getClassName(s.class_id), st];
    });
    c.innerHTML = wrapCard('تحضير الحضور · '+today, '<div style="margin-bottom:10px"><button class="btn gold" onclick="exportAttendanceReport()">تصدير/طباعة الكشف · Export / Print report</button></div>' + buildTable(['الطالب','الصف','الحالة'], rows));
  }

  function renderStudents(){
    var c=document.getElementById('view-students'); if(!c) return;
    var rows = DATA.students.map(function(s){ return [s.name||'—', getClassName(s.class_id), s.phone||'—']; });
    c.innerHTML = wrapCard('طلابي', buildTable(['الاسم','الصف','الهاتف'], rows));
  }

  function renderGrades(){
    var c=document.getElementById('view-grades'); if(!c) return;
    var rows = DATA.grades.map(function(g){ return [g.student_name||'—', getSubjectName(g.subject_id), (g.value!=null?g.value:'—')]; });
    c.innerHTML = wrapCard('الدرجات', '<div style="margin-bottom:10px"><button class="btn gold" onclick="exportGradesReport(true)">تصدير (مع درجات) · With grades</button> <button class="btn gold" onclick="exportGradesReport(false)">تصدير (بدون درجات) · Without grades</button></div>' + buildTable(['الطالب','المادة','الدرجة'], rows));
  }

  function exportAttendanceReport(){
    if(!window.AminExport) return;
    var today=iso().slice(0,10);
    var statusLabel={present:['حاضر','Present','حاضر'],absent:['غائب','Absent','غایب'],late:['متأخر','Late','دیرآمده'],permission:['مستأذن','Permitted','با اجازه'],medical_excuse:['عذر طبي','Medical excuse','عذر پزشکی'],external_activity:['نشاط خارجي','External activity','فعالیت خارجی']};
    var rows=DATA.students.map(function(s,i){var a=DATA.attendance.filter(function(x){return x.student_id===s.id && String(x.date).slice(0,10)===today;})[0];var st=a?a.status:null;var L=st?(statusLabel[st]||[st,st,st]):['غير مسجّل','Not recorded','ثبت نشده'];var at=(a&&a.absence_type)?a.absence_type:'';var nt=(a&&a.note)?a.note:'';return [(i+1),esc(s.name||'—'),esc(getClassName(s.class_id)||'—'),L[0]+' · '+L[1]+' · '+L[2],esc(at),esc(nt)];});
    AminExport.report({title:'كشف الحضور والغياب · Attendance Report · گزارش حضور و غیاب — '+today,headers:['# · No · شماره','الطالب · Student · دانش‌آموز','الصف · Class · کلاس','الحالة · Status · وضعیت','نوع الغياب · Absence type · نوع غیاب','ملاحظة · Note · یادداشت'],rows:rows,filename:'attendance_report'});
  }
  function exportGradesReport(withGrades){
    if(!window.AminExport) return;
    var rows=DATA.grades.map(function(g,i){var base=[(i+1),esc(g.student_name||'—'),esc(getSubjectName(g.subject_id)||'—')];if(withGrades)base.push(esc(g.value!=null?g.value:'—'));return base;});
    var headers=withGrades?['# · No · شماره','الطالب · Student · دانش‌آموز','المادة · Subject · ماده','الدرجة · Grade · نمره']:['# · No · شماره','الطالب · Student · دانش‌آموز','المادة · Subject · ماده'];
    AminExport.report({title:'كشف الدرجات · Grades Report · کارنامه'+(withGrades?' (مع الدرجات · with grades)':' (بدون درجات · without grades)'),headers:headers,rows:rows,filename:withGrades?'grades_with':'grades_without'});
  }
  function renderSchedule(){
    var c=document.getElementById('view-schedule'); if(!c) return;
    var todayDay = (new Date().getDay()===5)?6:((new Date().getDay()+1)%7);
    var rows = DATA.schedule.filter(function(s){return num(s.day)===todayDay;}).map(function(s){
      return [getSubjectName(s.subject_id), (s.start||'')+' - '+(s.end||''), getClassName(s.class_id)];
    });
    c.innerHTML = wrapCard('جدولي', buildTable(['المادة','الوقت','الصف'], rows)) + renderTodaySessionWorkflowCard();
  }

  function renderHomeworks(){
    var c=document.getElementById('view-homeworks'); if(!c) return;
    var rows = DATA.homeworks.map(function(h){ return [h.title||'—', getSubjectName(h.subject_id), h.due_date||'—', h.status||'—']; });
    c.innerHTML = wrapCard('الواجبات', buildTable(['العنوان','المادة','التسليم','الحالة'], rows));
  }


  async function renderLeaves() {
    var c = document.getElementById('view-leaves');
    if (!c) return;
    c.innerHTML = '<div class="page-head"><div><h1>طلبات الإجازة 🌴</h1><p>تقديم طلب إجازة جديد ومتابعة حالة الطلبات السابقة مع الموارد البشرية.</p></div></div><div class="empty">جاري تحميل بيانات الإجازات...</div>';
    
    var leaves = [];
    try {
      var r = await client().rpc('get_my_leave_requests');
      leaves = r.data || [];
    } catch(e) {
      console.warn('Failed to load leaves:', e);
    }
    
    var total = leaves.length;
    var pending = leaves.filter(function(x){ return x.status === 'pending'; }).length;
    var approved = leaves.filter(function(x){ return x.status === 'approved' || x.status === 'on_leave'; }).length;
    var rejected = leaves.filter(function(x){ return x.status === 'rejected'; }).length;
    
    var kpisHtml = '<div class="kpis" style="margin-bottom:20px">' +
      '<div class="kpi blue"><small>إجمالي الطلبات</small><b>'+total+'</b></div>' +
      '<div class="kpi gold"><small>قيد المراجعة</small><b>'+pending+'</b></div>' +
      '<div class="kpi green"><small>معتمدة</small><b>'+approved+'</b></div>' +
      '<div class="kpi red"><small>مرفوضة</small><b>'+rejected+'</b></div>' +
      '</div>';
      
    var formHtml = '<div class="card" style="margin-bottom:20px"><div class="card-head"><h3>تقديم طلب إجازة جديد</h3></div><div class="card-body">' +
      '<form id="leaveRequestForm" class="hr-form" onsubmit="return false;" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end">' +
      '<div><label>نوع الإجازة *</label><select id="myLeaveType" class="select" required>' +
      '<option value="annual">إجازة سنوية / اعتيادية</option>' +
      '<option value="sick">إجازة مرضية</option>' +
      '<option value="emergency">إجازة طارئة / اضطرارية</option>' +
      '<option value="unpaid">إجازة بدون راتب</option>' +
      '<option value="other">أخرى</option>' +
      '</select></div>' +
      '<div><label>من تاريخ *</label><input id="myLeaveStart" type="date" class="input" required></div>' +
      '<div><label>إلى تاريخ *</label><input id="myLeaveEnd" type="date" class="input" required></div>' +
      '<div style="grid-column:1/-1"><label>السبب أو المبرر</label><input id="myLeaveReason" class="input" placeholder="مثال: ظرف عائلي خاص، مراجعة طبيب..."></div>' +
      '<div style="grid-column:1/-1"><button type="submit" id="submitLeaveBtn" class="btn gold">إرسال طلب الإجازة</button></div>' +
      '</form></div></div>';
      
    var rowsHtml = '';
    if (leaves.length === 0) {
      rowsHtml = '<div class="empty">لم تقم بتقديم أي طلبات إجازة سابقاً</div>';
    } else {
      var rows = leaves.map(function(l){
        var badgeColor = 'gold';
        var statusText = 'قيد المراجعة';
        if (l.status === 'approved' || l.status === 'on_leave') { badgeColor = 'green'; statusText = 'معتمدة'; }
        else if (l.status === 'rejected') { badgeColor = 'red'; statusText = 'مرفوضة'; }
        
        var typeText = {annual:'سنوية', sick:'مرضية', unpaid:'بدون راتب', emergency:'طارئة', other:'أخرى'}[l.leave_type] || l.leave_type;
        return [
          typeText,
          l.start_date || '—',
          l.end_date || '—',
          (l.days_count || 1) + ' يوم',
          l.reason || '—',
          '<span class="badge ' + badgeColor + '">' + statusText + '</span>'
        ];
      });
      rowsHtml = buildTable(['نوع الإجازة', 'من تاريخ', 'إلى تاريخ', 'المدة', 'السبب', 'الحالة'], rows);
    }
    
    c.innerHTML = '<div class="page-head"><div><h1>طلبات الإجازة 🌴</h1><p>تقديم طلب إجازة جديد ومتابعة حالة الطلبات السابقة مع الموارد البشرية.</p></div></div>' + kpisHtml + formHtml + wrapCard('سجل إجازاتي', rowsHtml);
    
    var form = document.getElementById('leaveRequestForm');
    var btn = document.getElementById('submitLeaveBtn');
    if (form && btn) {
      btn.addEventListener('click', async function(){
        if (!form.reportValidity()) return;
        var t = document.getElementById('myLeaveType').value;
        var s = document.getElementById('myLeaveStart').value;
        var e = document.getElementById('myLeaveEnd').value;
        var r = document.getElementById('myLeaveReason').value;
        
        if (new Date(e) < new Date(s)) {
          toast('خطأ في التاريخ', 'تاريخ انتهاء الإجازة لا يمكن أن يكون قبل تاريخ البداية', 'red');
          return;
        }
        
        btn.disabled = true;
        btn.textContent = 'جاري إرسال الطلب...';
        try {
          var res = await client().rpc('hr_request_leave', {
            p_employee_id: null,
            p_leave_type: t,
            p_start_date: s,
            p_end_date: e,
            p_reason: r || null
          });
          if (res.error) throw res.error;
          var d = res.data || {};
          if (d.ok === false) throw new Error(d.message || 'تعذر إرسال الطلب');
          toast('تم الإرسال بنجاح', 'تم تقديم طلب الإجازة للموارد البشرية للمراجعة', 'green');
          renderLeaves();
        } catch(err) {
          console.error('Leave request error:', err);
          toast('خطأ في الإرسال', err.message || String(err), 'red');
        } finally {
          btn.disabled = false;
          btn.textContent = 'إرسال طلب الإجازة';
        }
      });
    }
  }


  async function renderExamTasks() {
    var c = document.getElementById('view-exam_tasks');
    if (!c) return;
    c.innerHTML = '<div class="page-head"><div><h1>مهام وأسئلة الامتحانات 📑</h1><p>متابعة مواعيد الامتحانات المحددة من الإدارة، وكتابة المادة المطلوبة، ورفع ملف الأسئلة بأسهل وأسرع طريقة.</p></div></div><div class="empty">جاري تحميل المهام...</div>';

    var tasks = [];
    try {
      var r = await client().from('v_my_exam_submission_tasks').select('*').eq('teacher_id', ME.id).order('submission_deadline');
      tasks = r.data || [];
    } catch(e) {
      console.warn('Failed to load exam tasks:', e);
    }

    var total = tasks.length;
    var submitted = tasks.filter(function(x){ return x.status === 'submitted' || x.status === 'offline_verified' || x.status === 'approved'; }).length;
    var late = tasks.filter(function(x){ return x.status === 'late' || (x.status === 'pending' && new Date(x.submission_deadline) < new Date()); }).length;

    var kpisHtml = '<div class="kpis" style="margin-bottom:20px">' +
      '<div class="kpi blue"><small>المهام المكلف بها</small><b>'+total+'</b></div>' +
      '<div class="kpi green"><small>تم الرفع / معتمدة 📤</small><b>'+submitted+'</b></div>' +
      '<div class="kpi red"><small>متأخر / تجاوز المهلة ⚠️</small><b>'+late+'</b></div>' +
      '</div>';

    var rowsHtml = '';
    if (tasks.length === 0) {
      rowsHtml = '<div class="empty">لم تكلفك الإدارة بأي مهام تسليم أسئلة امتحانية حتى الآن</div>';
    } else {
      var rows = tasks.map(function(t){
        var pText = {term1_m1:'الشهر 1 (ف1)', term1_m2:'الشهر 2 (ف1)', term1_m3:'الشهر 3 (ف1)', midterm:'نصف السنة', term2_m1:'الشهر 1 (ف2)', term2_m2:'الشهر 2 (ف2)', final:'نهاية السنة', resit2:'الدور الثاني', resit3:'الدور الثالث'}[t.term_period] || t.term_period;
        var stBadge = '<span class="badge gold">بانتظار الرفع</span>';
        var isLate = (t.status === 'late' || (t.status === 'pending' && new Date(t.submission_deadline) < new Date()));
        
        if (t.status === 'approved') stBadge = '<span class="badge green" style="background:#0B6E4F;color:#fff">معتمد رسمياً 🟢</span>';
        else if (t.status === 'submitted') stBadge = '<span class="badge green">تم الرفع للمنصة 📤</span>';
        else if (t.status === 'rejected') stBadge = '<span class="badge red">مرفوض يحتاج تعديل 🔄</span>';
        else if (isLate) stBadge = '<span class="badge red">متأخر! تجاوز المهلة ⚠️</span>';
        else if (t.status === 'offline_verified') stBadge = '<span class="badge blue">إثبات: ' + esc(t.delivery_method) + ' 📲</span>';

        var topicsInput = '<input id="top_' + t.schedule_id + '" class="input" value="' + esc(t.required_topics || '') + '" placeholder="اكتبي المادة المطلوبة (حفظ تلقائي عند الرفع)">';
        
        var uploadArea = '';
        if (t.status === 'approved') {
          uploadArea = '<div style="color:#0B6E4F;font-weight:bold;background:#e8f5e9;padding:6px;border-radius:6px;border:1px solid #c8e6c9">✅ تم اعتماد الأسئلة من المعاون العلمي (مقفلة)</div>';
        } else {
          var rejectBanner = t.status === 'rejected' ? '<div style="color:#b71c1c;font-weight:bold;background:#ffebee;padding:4px;border-radius:4px;border:1px solid #ffcdd2;margin-bottom:4px;font-size:11px">🔄 الإدارة تطلب تعديل: ' + esc(t.review_notes || 'يرجى مراجعة الأسئلة') + '</div>' : '';
          var currentFile = t.question_file_url ? '<a class="btn small blue" href="/api/proxy/storage/v1/object/public/exam-questions/' + t.question_file_url + '" target="_blank" style="margin-bottom:4px;display:inline-block">عرض الأسئلة السابقة 📄</a>' : '';
          
          uploadArea = rejectBanner + currentFile + '<div style="display:flex;flex-direction:column;gap:4px">' +
            '<div class="upload-box" style="padding:4px;border:1px dashed #0B6E4F;border-radius:6px;background:#f0fdf4"><label style="font-weight:bold;color:#0B6E4F;font-size:12px;cursor:pointer;display:block;text-align:center">⚡ اضغطي هنا لرفع ملف الأسئلة وحفظ المادة المطلوبة فوراً<input type="file" id="qf_' + t.id + '" accept=".pdf,.doc,.docx,image/*" style="display:none" onchange="TeacherPortal.quickUploadTask(this, \'" + t.id + "\', \'" + t.schedule_id + "\')"></label></div>' +
            '<button class="btn small gold block" onclick="TeacherPortal.reportOfflineDelivery(\'' + t.id + '\', \'' + t.schedule_id + '\')">إثبات تسليم بديل (واتساب/إيتا/بله/يدوي) 📲</button>' +
            '</div>';
        }

        return [
          '<b>' + esc(pText) + '</b><br><small class="muted">' + esc(t.class_name || '') + ' — ' + esc(t.subject_name || '') + '</small>',
          '<b>' + esc(t.exam_date || '') + '</b><br><small class="muted">' + (t.start_time || '') + ' - ' + (t.end_time || '') + ' (إدارة حصراً 🔒)</small>',
          topicsInput,
          '<span style="color:' + (isLate ? 'red' : 'inherit') + ';font-weight:' + (isLate ? 'bold' : 'normal') + '">' + esc(String(t.submission_deadline || '').slice(0,16).replace('T',' ')) + '</span>',
          stBadge,
          uploadArea
        ];
      });
      rowsHtml = buildTable(['الامتحان والصف', 'موعد الامتحان (إدارة)', 'المادة المطلوبة (Syllabus)', 'مهلة الرفع (Deadline)', 'الحالة', 'إجراء الرفع أو الإثبات'], rows);
    }

    c.innerHTML = '<div class="page-head"><div><h1>مهام وأسئلة الامتحانات 📑</h1><p>متابعة مواعيد الامتحانات المحددة من الإدارة، وكتابة المادة المطلوبة، ورفع ملف الأسئلة بأسهل وأسرع طريقة.</p></div></div>' + kpisHtml + wrapCard('مهام تسليم الأسئلة', rowsHtml);
  }

  async function quickUploadTask(inputEl, taskId, schedId) {
    var file = inputEl && inputEl.files && inputEl.files[0];
    if (!file) return;
    var topicsEl = document.getElementById('top_' + schedId);
    var topicsVal = topicsEl ? topicsEl.value : null;

    try {
      toast('جاري الرفع الفوري...', 'يرجى الانتظار');
      var ext = (file.name.split('.').pop() || 'pdf').toLowerCase();
      var path = 'tasks/' + Date.now() + '-' + Math.random().toString(36).slice(2) + '.' + ext;
      var up = await client().storage.from('exam-questions').upload(path, file, { upsert: false });
      if (up.error) throw up.error;

      var res = await client().rpc('submit_exam_task_questions_v2', {
        p_task_id: taskId,
        p_file_url: path,
        p_delivery_method: 'platform',
        p_proof_note: 'تم الرفع للمنصة',
        p_topics: topicsVal
      });
      if (res.error) throw res.error;
      var d = res.data || {};
      if (d.ok === false) throw new Error(d.message || 'تعذر الرفع');
      toast('تم التسليم 🚀', 'تم رفع ملف الأسئلة وحفظ المادة المطلوبة وإرسال الإشعار للإدارة بنجاح!', 'green');
      renderExamTasks();
    } catch(e) {
      toast('خطأ في الرفع', e.message || String(e), 'red');
    }
  }

  async function reportOfflineDelivery(taskId, schedId) {
    var method = prompt('اختاري طريقة التسليم البديل (manual / whatsapp / eitaa / bale):', 'whatsapp');
    if (!method) return;
    var note = prompt('ملاحظة إثبات التسليم (مثال: تم إرسال الأسئلة على واتساب للمدير أو تسليم ورقي):', 'تم التسليم عبر ' + method);
    var topicsEl = document.getElementById('top_' + schedId);
    var topicsVal = topicsEl ? topicsEl.value : null;

    try {
      var res = await client().rpc('submit_exam_task_questions_v2', {
        p_task_id: taskId,
        p_file_url: null,
        p_delivery_method: method,
        p_proof_note: note || null,
        p_topics: topicsVal
      });
      if (res.error) throw res.error;
      toast('تم التوثيق 📲', 'تم تسجيل إثبات التسليم الخارجي وحفظ المادة المطلوبة بنجاح', 'green');
      renderExamTasks();
    } catch(e) {
      toast('خطأ', e.message || String(e), 'red');
    }
  }

  function wireNav(){
    Array.prototype.forEach.call(document.querySelectorAll('.nav button[data-view]'), function(b){
      b.addEventListener('click', function(){
        Array.prototype.forEach.call(document.querySelectorAll('.nav button[data-view]'), function(x){ x.classList.toggle('active', x===b); });
        showView(b.getAttribute('data-view'));
      });
    });
    var mm=document.getElementById('mobileMenuBtn');
    if(mm){ mm.addEventListener('click', function(){ var sb=document.getElementById('sidebar'); if(sb){ sb.classList.toggle('open'); } }); }
  }

  window.TeacherPortal = { showView: showView, checkInSession: checkInSession, quickLessonPlan: quickLessonPlan, quickHomework: quickHomework };

  init().catch(function(e){ console.error('Teacher init error:', e); }).finally(function(){
    try{ wireNav(); showView('overview'); }catch(e){ console.error(e); }
  });

})();
