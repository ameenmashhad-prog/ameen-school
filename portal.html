<!doctype html>
<html lang="ar" dir="rtl">
<head>

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="assets/portal.css">
<link rel="stylesheet" href="assets/brand-redesign.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg-primary:#f8fafc;--bg-secondary:#fff;--bg-sidebar:#081426;--text-primary:#1f2937;--text-secondary:#6b7280;--text-sidebar:#cbd5e1;--border:#e5e7eb;--primary:#1e40af;--primary-light:#3b82f6;--success:#10b981;--danger:#dc2626;--warning:#f59e0b;--info:#06b6d4;--shadow-sm:0 1px 3px rgba(0,0,0,.1);--shadow-md:0 4px 12px rgba(0,0,0,.08);--shadow-lg:0 10px 30px rgba(0,0,0,.1)}body.dark{--bg-primary:#0f172a;--bg-secondary:#1e293b;--bg-sidebar:#020617;--text-primary:#f1f5f9;--text-secondary:#94a3b8;--border:#334155}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;direction:rtl}.app-shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.app-sidebar{background:var(--bg-sidebar);color:var(--text-sidebar);padding:20px 0;position:fixed;top:0;right:0;width:260px;height:100vh;overflow-y:auto;z-index:100;transition:transform .3s}.app-sidebar::-webkit-scrollbar{width:6px}.app-sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}.sidebar-brand{padding:0 20px 20px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:16px;display:flex;align-items:center;gap:12px}.sidebar-brand .logo{width:44px;height:44px;background:linear-gradient(135deg,#fbbf24,#f59e0b);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}.sidebar-brand h1{font-size:16px;color:#fff;font-weight:700}.sidebar-brand small{font-size:11px;color:var(--text-sidebar);opacity:.7}.sidebar-user{padding:12px 20px;margin:0 12px 16px;background:rgba(255,255,255,.05);border-radius:10px;display:flex;align-items:center;gap:12px}.sidebar-user .avatar{width:40px;height:40px;background:linear-gradient(135deg,#3b82f6,#1e40af);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}.sidebar-user .info{min-width:0;flex:1}.sidebar-user .name{color:#fff;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sidebar-user .role{color:var(--text-sidebar);font-size:11px;opacity:.8}.sidebar-nav{padding:0 12px}.sidebar-nav .nav-section{margin-bottom:16px}.sidebar-nav .section-title{font-size:11px;color:var(--text-sidebar);text-transform:uppercase;padding:0 12px;margin-bottom:8px;opacity:.6;letter-spacing:.5px}.nav-item{display:flex;align-items:center;gap:12px;padding:10px 14px;margin-bottom:2px;color:var(--text-sidebar);text-decoration:none;border-radius:8px;font-size:14px;cursor:pointer;border:none;background:none;width:100%;text-align:right;transition:all .2s;font-family:inherit}.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}.nav-item.active{background:linear-gradient(135deg,#3b82f6,#1e40af);color:#fff;box-shadow:0 4px 12px rgba(59,130,246,.3)}.nav-item .icon{font-size:18px;width:24px;text-align:center}.nav-item .text{flex:1}.sidebar-footer{padding:16px 12px;border-top:1px solid rgba(255,255,255,.1);margin-top:16px}.logout-btn{width:100%;padding:10px;background:rgba(220,38,38,.1);color:#fca5a5;border:1px solid rgba(220,38,38,.2);border-radius:8px;cursor:pointer;font-family:inherit;font-weight:600;transition:all .2s}.logout-btn:hover{background:#dc2626;color:#fff}.app-main{margin-right:260px;min-height:100vh;display:flex;flex-direction:column}.app-topbar{background:var(--bg-secondary);padding:14px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;box-shadow:var(--shadow-sm)}.app-topbar h2{font-size:18px;color:var(--text-primary);font-weight:700}.topbar-actions{display:flex;gap:8px;align-items:center}.btn-icon{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--bg-primary);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s}.btn-icon:hover{background:var(--primary);color:#fff;border-color:var(--primary)}.mobile-toggle{display:none;background:none;border:none;font-size:24px;cursor:pointer;color:var(--text-primary)}#main-content{flex:1;padding:24px;max-width:1400px;margin:0 auto;width:100%}.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg-secondary);border-top:1px solid var(--border);padding:8px;z-index:99;box-shadow:0 -4px 12px rgba(0,0,0,.1)}.bottom-nav-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.bottom-nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;background:none;border:none;cursor:pointer;font-family:inherit;font-size:11px;color:var(--text-secondary);border-radius:8px;transition:all .2s}.bottom-nav-item.active{background:var(--primary);color:#fff}.bottom-nav-item .icon{font-size:20px}.skeleton{background:linear-gradient(90deg,var(--border) 0%,#f3f4f6 50%,var(--border) 100%);background-size:200% 100%;border-radius:8px;animation:skeleton-pulse 1.5s ease-in-out infinite}@keyframes skeleton-pulse{0%{background-position:200% 0}100%{background-position:-200% 0}}.skeleton-line{height:16px;margin-bottom:8px}.skeleton-line.sm{height:12px;width:60%}.skeleton-line.lg{height:24px;width:40%}.skeleton-card{height:120px;margin-bottom:16px}.error-state{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;padding:20px;border-radius:12px;text-align:center;margin:20px 0}.error-state .icon{font-size:48px;margin-bottom:12px}.error-state .retry-btn{background:#991b1b;color:#fff;padding:10px 24px;border:none;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:600;margin-top:12px}.empty-state{text-align:center;padding:60px 20px;color:var(--text-secondary)}.empty-state .icon{font-size:64px;margin-bottom:16px;opacity:.5}.toast-container{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}.toast{background:var(--bg-secondary);border:1px solid var(--border);border-right:4px solid var(--primary);padding:14px 20px;border-radius:10px;box-shadow:var(--shadow-lg);min-width:280px;max-width:400px;pointer-events:auto;animation:toast-in .3s ease-out;display:flex;align-items:center;gap:12px}.toast.success{border-right-color:var(--success)}.toast.error{border-right-color:var(--danger)}.toast.warning{border-right-color:var(--warning)}.toast .toast-icon{font-size:20px;flex-shrink:0}.toast .toast-content{flex:1}.toast .toast-title{font-weight:700;color:var(--text-primary)}.toast .toast-msg{font-size:13px;color:var(--text-secondary);margin-top:2px}@keyframes toast-in{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}.modal{background:var(--bg-secondary);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:100%;max-height:90vh;display:flex;flex-direction:column}.modal.sm{width:400px}.modal.md{width:600px}.modal.lg{width:900px}.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.modal-header h3{font-size:18px;font-weight:700}.modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--text-secondary);width:32px;height:32px;border-radius:8px}.modal-body{padding:24px;overflow-y:auto;flex:1}.tabs-nav{display:flex;background:var(--bg-primary);border-bottom:1px solid var(--border);overflow-x:auto}.tab-btn{padding:14px 24px;background:none;border:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;color:var(--text-secondary);border-bottom:3px solid transparent;white-space:nowrap;transition:all .2s}.tab-btn:hover{color:var(--primary)}.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);background:var(--bg-secondary)}.tab-content{display:none;padding:20px}.tab-content.active{display:block}@media(max-width:768px){.app-sidebar{transform:translateX(100%);box-shadow:-10px 0 30px rgba(0,0,0,.2)}.app-sidebar.open{transform:translateX(0)}.app-main{margin-right:0;padding-bottom:80px}.mobile-toggle{display:flex}.bottom-nav{display:block}#main-content{padding:16px}.sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;display:none}.sidebar-backdrop.active{display:block}}
</style>
</head>
<body>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar()"></div>
<div class="app-shell">
<aside class="app-sidebar" id="appSidebar">
<div class="sidebar-brand"><div class="logo">🎓</div><div><h1>أمين الرضا</h1><small>البوابة الموحدة</small></div></div>
<div class="sidebar-user"><div class="avatar">👤</div><div class="info"><div class="name" id="userName">جاري...</div><div class="role" id="userRole">...</div></div></div>
<nav class="sidebar-nav" id="sidebarNav"></nav>
<div class="sidebar-footer"><button class="logout-btn" onclick="handleLogout()">🚪 تسجيل الخروج</button></div>
</aside>
<main class="app-main">
<header class="app-topbar">
<div style="display:flex;align-items:center;gap:12px;"><button class="mobile-toggle" onclick="toggleSidebar()">☰</button><h2 id="pageTitle">لوحة القيادة</h2></div>
<div class="topbar-actions"><button class="btn-icon" onclick="toggleDarkMode()">🌙</button><button class="btn-icon" onclick="navigate(window.currentSection)">🔄</button></div>
</header>
<div id="main-content"></div>
</main>
</div>
<nav class="bottom-nav" id="bottomNav"><div class="bottom-nav-grid" id="bottomNavGrid"></div></nav>
<div class="toast-container" id="toastContainer"></div>
<div id="modalContainer"></div>

<script src="libs/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script src="libs/xlsx.full.min.js"></script>
<script>
(function(){
'use strict';

var ROLE_SECTIONS = {
  super_admin: ['overview','students','academic','finance','attendance','discipline','registrations','schedule','payroll','settings','system'],
  admin: ['overview','students','academic','finance','attendance','discipline','registrations','schedule','payroll','settings','system'],
  finance: ['overview','finance'],
  academic: ['overview','students','academic','attendance','registrations','schedule'],
  counselor: ['overview','students','attendance','discipline'],
  psychologist: ['overview','students','attendance','discipline'],
  discipline: ['overview','students','attendance','discipline'],
  teacher: ['overview','students','academic','attendance','schedule'],
  parent: ['overview','students','academic','attendance','finance'],
  student: ['overview','academic','attendance','schedule']
};

var SECTIONS_META = {
  overview: { title: 'لوحة القيادة', icon: '🏠', order: 1 },
  students: { title: 'الطلاب', icon: '🎓', order: 2 },
  academic: { title: 'الأكاديمي', icon: '📚', order: 3 },
  finance: { title: 'المالية', icon: '💰', order: 4 },
  attendance: { title: 'الحضور', icon: '📋', order: 5 },
  discipline: { title: 'السلوك', icon: '🛡️', order: 6 },
  registrations: { title: 'التسجيلات', icon: '📝', order: 7 },
  schedule: { title: 'الجدول', icon: '📅', order: 8 },
  payroll: { title: 'الرواتب', icon: '💵', order: 9 },
  settings: { title: 'الإعدادات', icon: '⚙️', order: 10 },
  system: { title: 'النظام', icon: '🔧', order: 11 }
};

window.currentSection = null;
window.currentUser = null;
window.currentUserRole = null;
window.sbClient = null;

function escapeHtml(v) {
  return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
window.escapeHtml = escapeHtml;
window.formatNumber = function(n){ return Number(n||0).toLocaleString('ar-IQ'); };
window.formatMoney = function(n){ return '$' + Number(n||0).toLocaleString('ar-IQ',{maximumFractionDigits:0}); };

window.showToast = function(title, msg, type) {
  type = type || 'info';
  var c = document.getElementById('toastContainer');
  if (!c) return;
  var t = document.createElement('div');
  t.className = 'toast ' + type;
  var icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
  t.innerHTML = '<div class="toast-icon">' + (icons[type] || icons.info) + '</div><div class="toast-content"><div class="toast-title">' + escapeHtml(title) + '</div>' + (msg ? '<div class="toast-msg">' + escapeHtml(msg) + '</div>' : '') + '</div>';
  c.appendChild(t);
  setTimeout(function(){ t.remove(); }, 3000);
};

window.openModal = function(config) {
  closeModal();
  var c = document.getElementById('modalContainer');
  var bd = document.createElement('div');
  bd.className = 'modal-backdrop';
  bd.id = 'activeModalBackdrop';
  var m = document.createElement('div');
  m.className = 'modal ' + (config.width || 'md');
  m.innerHTML = '<div class="modal-header"><h3>' + escapeHtml(config.title) + '</h3><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body" id="modalBody"></div>';
  bd.appendChild(m);
  c.appendChild(bd);
  var b = m.querySelector('#modalBody');
  if (typeof config.content === 'string') b.innerHTML = config.content;
  else if (config.content instanceof HTMLElement) b.appendChild(config.content);
  bd.addEventListener('click', function(e){ if (e.target === bd) closeModal(); });
};

window.closeModal = function() {
  var bd = document.getElementById('activeModalBackdrop');
  if (bd) bd.remove();
};

window.initTabs = function(id) {
  var c = document.getElementById(id);
  if (!c) return;
  var btns = c.querySelectorAll('.tab-btn[data-tab]');
  var contents = c.querySelectorAll('.tab-content[data-tab-content]');
  var active = c.dataset.activeTab || (btns[0] && btns[0].dataset.tab);
  function activate(name) {
    btns.forEach(function(b){ b.classList.toggle('active', b.dataset.tab === name); });
    contents.forEach(function(ct){ ct.classList.toggle('active', ct.dataset.tabContent === name); });
    c.dataset.activeTab = name;
  }
  btns.forEach(function(b){ b.addEventListener('click', function(){ activate(b.dataset.tab); }); });
  if (active) activate(active);
};

window.renderSkeleton = function(id, count) {
  count = count || 3;
  var c = document.getElementById(id) || document.getElementById('main-content');
  if (!c) return;
  var h = '<div class="skeleton-line lg"></div><div class="skeleton-line sm"></div><div style="margin-top:24px;">';
  for (var i=0; i<count; i++) h += '<div class="skeleton skeleton-card"></div>';
  c.innerHTML = h + '</div>';
};

window.renderError = function(id, msg, retry) {
  var c = document.getElementById(id) || document.getElementById('main-content');
  if (!c) return;
  c.innerHTML = '<div class="error-state"><div class="icon">⚠️</div><h3>حدث خطأ</h3><p>' + escapeHtml(msg) + '</p><button class="retry-btn" onclick="' + (retry || 'navigate(window.currentSection)') + '">🔄 إعادة المحاولة</button></div>';
};

window.renderEmpty = function(id, msg) {
  var c = document.getElementById(id) || document.getElementById('main-content');
  if (!c) return;
  c.innerHTML = '<div class="empty-state"><div class="icon">📭</div><h3>' + escapeHtml(msg || 'لا توجد بيانات') + '</h3></div>';
};

async function checkAuth() {
  try {
    if (!window.supabase || !window.AMIN_CONFIG) throw new Error('Supabase not loaded');
    var sb = window.supabase.createClient(window.AMIN_CONFIG.supabaseUrl, window.AMIN_CONFIG.supabaseAnonKey, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storageKey:(window.AMIN_CONFIG.authStorageKey||'amin-ovcjzsrqqgjsbqswtkro-auth-v2')}});
    window.sbClient = sb;
    var sr = await sb.auth.getSession();
    if (!sr.data.session) { setTimeout(function(){ location.href = 'index.html'; }, 500); return null; }
    var ur = await sb.from('users').select('*').eq('id', sr.data.session.user.id).maybeSingle();
    if (!ur.data) { setTimeout(function(){ location.href = 'index.html'; }, 500); return null; }
    var user = ur.data;
    var role = user.is_super_admin ? 'super_admin' : (user.role || 'guest');
    if (!ROLE_SECTIONS[role]) {
      window.showToast('غير مصرّح', 'ليس لديك صلاحية', 'error');
      setTimeout(function(){ location.href = 'index.html'; }, 2000);
      return null;
    }
    window.currentUser = user;
    window.currentUserRole = role;
    window.ME = user;
    return user;
  } catch (e) {
    setTimeout(function(){ location.href = 'index.html'; }, 1000);
    return null;
  }
}

function buildSidebar() {
  var role = window.currentUserRole;
  var allowed = ROLE_SECTIONS[role] || [];
  var nav = document.getElementById('sidebarNav');
  if (!allowed.length) { nav.innerHTML = '<div style="padding:20px;text-align:center;color:#94a3b8;">لا توجد أقسام</div>'; return; }
  var sorted = allowed.filter(function(s){ return SECTIONS_META[s]; }).sort(function(a,b){ return SECTIONS_META[a].order - SECTIONS_META[b].order; });
  var html = '<div class="nav-section"><div class="section-title">الأقسام</div>';
  sorted.forEach(function(id){
    var m = SECTIONS_META[id];
    html += '<button class="nav-item" data-section="' + id + '" onclick="navigate(\'' + id + '\')"><span class="icon">' + m.icon + '</span><span class="text">' + m.title + '</span></button>';
  });
  nav.innerHTML = html + '</div>';
}

function buildBottomNav() {
  var role = window.currentUserRole;
  var allowed = ROLE_SECTIONS[role] || [];
  var grid = document.getElementById('bottomNavGrid');
  var top5 = allowed.filter(function(s){ return SECTIONS_META[s]; }).sort(function(a,b){ return SECTIONS_META[a].order - SECTIONS_META[b].order; }).slice(0,5);
  var html = '';
  top5.forEach(function(id){
    var m = SECTIONS_META[id];
    html += '<button class="bottom-nav-item" data-section="' + id + '" onclick="navigate(\'' + id + '\')"><span class="icon">' + m.icon + '</span><span>' + m.title + '</span></button>';
  });
  grid.innerHTML = html;
}

window.navigate = function(sectionId) {
  var role = window.currentUserRole;
  var allowed = ROLE_SECTIONS[role] || [];
  if (!sectionId || allowed.indexOf(sectionId) === -1) sectionId = allowed[0] || 'overview';
  if (location.hash !== '#' + sectionId) location.hash = sectionId;
  window.currentSection = sectionId;
  document.querySelectorAll('.nav-item[data-section]').forEach(function(i){ i.classList.toggle('active', i.dataset.section === sectionId); });
  document.querySelectorAll('.bottom-nav-item[data-section]').forEach(function(i){ i.classList.toggle('active', i.dataset.section === sectionId); });
  var meta = SECTIONS_META[sectionId];
  if (meta) { document.getElementById('pageTitle').textContent = meta.icon + ' ' + meta.title; document.title = meta.title + ' — البوابة الموحدة'; }
  if (window.innerWidth <= 768) {
    document.getElementById('appSidebar').classList.remove('open');
    document.getElementById('sidebarBackdrop').classList.remove('active');
  }
  window.renderSkeleton('main-content', 4);
  var section = window.SECTIONS[sectionId];
  if (section && typeof section.load === 'function') {
    Promise.resolve(section.load()).catch(function(err){
      window.renderError('main-content', err.message || 'فشل التحميل');
    });
  } else {
    document.getElementById('main-content').innerHTML = '<div class="empty-state"><div class="icon">🚧</div><h3>' + escapeHtml(meta.title) + '</h3><p>قيد التطوير</p></div>';
  }
};

window.toggleSidebar = function() {
  document.getElementById('appSidebar').classList.toggle('open');
  document.getElementById('sidebarBackdrop').classList.toggle('active');
};

window.toggleDarkMode = function() {
  document.body.classList.toggle('dark');
  var dark = document.body.classList.contains('dark');
  localStorage.setItem('darkMode', dark ? '1' : '0');
  window.showToast(dark ? '🌙 الوضع الليلي' : '☀️ الوضع النهاري', null, 'success');
};

window.handleLogout = async function() {
  if (!confirm('تسجيل الخروج؟')) return;
  try {
    if (window.sbClient) await window.sbClient.auth.signOut({scope:'local'});
    location.href = 'index.html';
  } catch (e) { location.href = 'index.html'; }
};

window.SECTIONS = {

overview: {
  title: 'لوحة القيادة',
  load: async function() {
    try {
      var role = window.currentUserRole;
      var r = await Promise.all([
        window.sbClient.from('v_clean_student_overview').select('*').limit(1).maybeSingle(),
        window.sbClient.from('v_clean_finance_summary').select('*').limit(1).maybeSingle(),
        window.sbClient.from('v_clean_attendance_today').select('*').limit(1).maybeSingle()
      ]);
      var so = r[0].data || {}, fs = r[1].data || {}, at = r[2].data || {};
     var er = await Promise.all([
        window.sbClient.from('attendance').select('student_id, date, status, created_at').eq('status', 'absent').order('created_at', {ascending: false}).limit(5),
        window.sbClient.from('behavior_records').select('student_id, note, description, points, created_at').order('created_at', {ascending: false}).limit(5)
      ]);
      
      // جلب أسماء الطلاب بشكل منفصل
      var allStudentIds = [];
      (er[0].data || []).forEach(function(e){ if(e.student_id) allStudentIds.push(e.student_id); });
      (er[1].data || []).forEach(function(e){ if(e.student_id) allStudentIds.push(e.student_id); });
      
      var studentsMap = {};
      if (allStudentIds.length > 0) {
        var stRes = await window.sbClient.from('students').select('id, name, users(name)').in('id', allStudentIds);
        (stRes.data || []).forEach(function(s){
          studentsMap[s.id] = (s.users && s.users.name) || s.name || 'طالب';
        });
      }
     var ae = (er[0].data || []).map(function(e){ 
        return { 
          type: '❌ غياب', 
          tc: 'red', 
          name: studentsMap[e.student_id] || 'طالب', 
          detail: 'تاريخ: ' + String(e.date || '').slice(0,10), 
          created_at: e.created_at 
        }; 
      });
      var be = (er[1].data || []).map(function(e){ 
        var p = Number(e.points || 0); 
        return {

window._renderStudentsTable = function(s) {
  var c = document.getElementById('studentsTable');
  if (!s.length) { c.innerHTML = '<div class="empty-state"><div class="icon">📭</div><h3>لا يوجد طلاب</h3></div>'; return; }
  var h = '<div style="margin-bottom:12px;color:var(--text-secondary);font-size:13px;">إجمالي: <b>' + s.length + '</b></div><div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;"><thead><tr style="background:var(--bg-primary);"><th style="padding:12px;text-align:right;">الاسم</th><th style="padding:12px;text-align:right;">الصف</th><th style="padding:12px;text-align:right;">الحضور%</th><th style="padding:12px;text-align:right;">إجراء</th></tr></thead><tbody>';
  s.forEach(function(x){
    var r = Number(x.attendance_rate || 0);
    var col = r >= 90 ? '#10b981' : r >= 75 ? '#f59e0b' : '#dc2626';
    h += '<tr style="border-bottom:1px solid var(--border);"><td style="padding:12px;font-weight:600;">' + escapeHtml(x.full_name || '—') + '</td><td style="padding:12px;">' + escapeHtml(x.class_name || '—') + '</td><td style="padding:12px;"><span style="background:' + col + '20;color:' + col + ';padding:4px 10px;border-radius:6px;font-weight:600;">' + Math.round(r) + '%</span></td><td style="padding:12px;"><button onclick="window._openSF(\'' + x.id + '\')" style="background:var(--primary);color:white;padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;">📋 ملف</button></td></tr>';
  });
  c.innerHTML = h + '</tbody></table></div>';
};

window._filterStudents = function() {
  var s = (document.getElementById('studentSearch').value || '').toLowerCase().trim();
  var cf = document.getElementById('classFilter').value;
  var f = (window._studentsData || []).filter(function(x){
    if (s && !(x.full_name || '').toLowerCase().includes(s)) return false;
    if (cf && x.class_name !== cf) return false;
    return true;
  });
  window._renderStudentsTable(f);
};

  window.openModal({ title: '📋 ملف الطالب', width: 'lg', content: '<div class="skeleton skeleton-card"></div>' });

    var r = await Promise.all([
      window.sbClient.from('students').select('*, users(name, email, phone)').eq('id', id).maybeSingle(),
      window.sbClient.from('attendance').select('*').eq('student_id', id).order('date', {ascending: false}).limit(5),
      window.sbClient.from('behavior_records').select('*').eq('student_id', id).order('created_at', {ascending: false}).limit(5)
    ]);

window._loadSys = async function() {
  var c = document.getElementById('sysC');
  try {
    var r = await window.sbClient.rpc('final_system_readiness_check');
    var res = r.data || {};
    window._sysRes = res;
    var units = res.units || [];
    var summary = res.summary || {};
    var h = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px;">';
    h += '<div style="background:#d1fae5;padding:16px;border-radius:10px;text-align:center;"><div style="font-size:32px;">✅</div><div style="font-size:24px;color:#065f46;font-weight:700;">' + (summary.ready || 0) + '</div><div style="color:#065f46;">جاهز</div></div>';
    h += '<div style="background:#fef3c7;padding:16px;border-radius:10px;text-align:center;"><div style="font-size:32px;">⚠️</div><div style="font-size:24px;color:#92400e;font-weight:700;">' + (summary.warning || 0) + '</div><div style="color:#92400e;">تحذير</div></div>';
    h += '<div style="background:#fee2e2;padding:16px;border-radius:10px;text-align:center;"><div style="font-size:32px;">❌</div><div style="font-size:24px;color:#991b1b;font-weight:700;">' + (summary.missing || 0) + '</div><div style="color:#991b1b;">مفقود</div></div>';
    h += '</div>';
    h += '<div style="display:flex;gap:8px;margin-bottom:20px;"><button onclick="window._copySys()" style="background:var(--primary);color:white;padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:600;">📋 نسخ JSON</button><button onclick="window._loadSys()" style="background:#10b981;color:white;padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:600;">🔄 إعادة الفحص</button></div>';
    if (units.length) {
      h += '<h3 style="margin-bottom:12px;">📦 الوحدات</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;">';
      units.forEach(function(u){
        var ic = u.status === 'ready' ? '✅' : u.status === 'warning' ? '⚠️' : '❌';
        var bg = u.status === 'ready' ? '#d1fae5' : u.status === 'warning' ? '#fef3c7' : '#fee2e2';
        var tc = u.status === 'ready' ? '#065f46' : u.status === 'warning' ? '#92400e' : '#991b1b';
        h += '<div style="background:white;border:2px solid ' + bg + ';padding:16px;border-radius:10px;"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;"><span style="font-size:24px;">' + ic + '</span><b style="color:' + tc + ';">' + escapeHtml(u.name || '—') + '</b></div>';
        if (u.details) h += '<div style="color:var(--text-secondary);font-size:13px;">' + escapeHtml(u.details) + '</div>';
        h += '</div>';
      });
      h += '</div>';
    }
    c.innerHTML = h;
  } catch (e) { c.innerHTML = '<div class="error-state"><div class="icon">⚠️</div><p>' + e.message + '</p><button class="retry-btn" onclick="window._loadSys()">إعادة</button></div>'; }
};

window._copySys = function() {
  if (!window._sysRes) return;
  try {
    navigator.clipboard.writeText(JSON.stringify(window._sysRes, null, 2));
    window.showToast('✅ تم', 'تم النسخ', 'success');
  } catch (e) { window.showToast('❌ فشل', e.message, 'error'); }
};

window._loadAcGr = async function() {
  try {
    var r = await Promise.all([
      window.sbClient.from('classes').select('id, name').order('name'),
      window.sbClient.from('subjects').select('id, name').order('name'),
      window.sbClient.from('academic_periods').select('*').order('start_date', {ascending: false}).limit(10)
    ]);
    var classes = r[0].data || [], subjects = r[1].data || [], periods = r[2].data || [];
    var h = '<div style="background:var(--bg-primary);padding:16px;border-radius:10px;margin-bottom:20px;display:flex;gap:12px;flex-wrap:wrap;align-items:end;">';
    h += '<div style="min-width:160px;"><label style="font-size:13px;display:block;margin-bottom:4px;">📚 الصف</label><select id="acGC" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;"><option value="">اختر...</option>';
    classes.forEach(function(c){ h += '<option value="' + c.id + '">' + escapeHtml(c.name) + '</option>'; });
    h += '</select></div>';
    h += '<div style="min-width:160px;"><label style="font-size:13px;display:block;margin-bottom:4px;">📖 المادة</label><select id="acGS" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;"><option value="">اختر...</option>';
    subjects.forEach(function(s){ h += '<option value="' + s.id + '">' + escapeHtml(s.name) + '</option>'; });
    h += '</select></div>';
    h += '<div style="min-width:160px;"><label style="font-size:13px;display:block;margin-bottom:4px;">📅 الفصل</label><select id="acGP" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;"><option value="">اختر...</option>';
    periods.forEach(function(p){ h += '<option value="' + p.id + '">' + escapeHtml(p.name || p.title || 'فصل') + '</option>'; });
    h += '</select></div>';
    h += '<button onclick="window._loadGD()" style="background:var(--primary);color:white;padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:600;">🔍 عرض</button>';
    h += '</div><div id="acGT"></div>';
    document.getElementById('acGr').innerHTML = h;
  } catch (e) { document.getElementById('acGr').innerHTML = '<div class="error-state"><p>' + e.message + '</p></div>'; }
};

window._loadGD = async function() {
  var ci = document.getElementById('acGC').value;
  var si = document.getElementById('acGS').value;
  var pi = document.getElementById('acGP').value;
  if (!ci || !si || !pi) { window.showToast('تنبيه', 'اختر الكل', 'warning'); return; }
  var c = document.getElementById('acGT');
  c.innerHTML = '<div class="skeleton skeleton-card"></div>';
  try {
    var r = await window.sbClient.from('v_academic_subject_results').select('*').eq('class_id', ci).eq('subject_id', si).eq('period_id', pi);
    var d = r.data || [];
    if (!d.length) { c.innerHTML = '<div class="empty-state"><div class="icon">📭</div><h3>لا توجد درجات</h3></div>'; return; }
    var h = '<div style="margin-bottom:12px;">إجمالي: <b>' + d.length + '</b></div><div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;"><thead><tr style="background:var(--primary);color:white;"><th style="padding:10px;text-align:right;">الطالب</th><th style="padding:10px;text-align:right;">المستمر</th><th style="padding:10px;text-align:right;">الاختبار</th><th style="padding:10px;text-align:right;">النهائي</th><th style="padding:10px;text-align:right;">الحالة</th></tr></thead><tbody>';
    d.forEach(function(g){
      var fs = Number(g.final_score || 0);
      var bg = fs >= 60 ? '#d1fae5' : fs >= 40 ? '#fef3c7' : '#fee2e2';
      var passed = g.passed || fs >= 60;
      h += '<tr style="background:' + bg + ';border-bottom:1px solid var(--border);"><td style="padding:10px;font-weight:600;">' + escapeHtml(g.student_name || '—') + '</td><td style="padding:10px;">' + (g.continuous_score || 0) + '</td><td style="padding:10px;">' + (g.exam_score || 0) + '</td><td style="padding:10px;font-weight:700;">' + fs + '</td><td style="padding:10px;">' + (passed ? '✅ ناجح' : '❌ راسب') + '</td></tr>';
    });
    c.innerHTML = h + '</tbody></table></div>';
  } catch (e) { c.innerHTML = '<div class="error-state"><p>' + e.message + '</p></div>'; }
};

window._loadAcEx = async function() {
  try {
    var r = await window.sbClient.from('v_academic_student_summary').select('*').eq('is_exempt_candidate', true).limit(200);
    var d = r.data || [];
    var dr = await window.sbClient.from('academic_exemption_decisions').select('*');
    var dec = dr.data || [];
    var dm = {};
    dec.forEach(function(x){ dm[x.student_id] = x; });
    var c = document.getElementById('acEx');
    if (!d.length) { c.innerHTML = '<div class="empty-state"><div class="icon">🎉</div><h3>لا يوجد مرشحون</h3></div>'; return; }
    var h = '<div style="margin-bottom:12px;">المرشحون: <b>' + d.length + '</b></div><div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;"><thead><tr style="background:var(--bg-primary);"><th style="padding:10px;text-align:right;">الطالب</th><th style="padding:10px;text-align:right;">الصف</th><th style="padding:10px;text-align:right;">المعدل</th><th style="padding:10px;text-align:right;">القرار</th></tr></thead><tbody>';
    d.forEach(function(s){
      var ex = dm[s.student_id];
      var avg = Number(s.avg_score || 0);
      var ac = avg >= 60 ? '#10b981' : avg >= 40 ? '#f59e0b' : '#dc2626';
      h += '<tr style="border-bottom:1px solid var(--border);"><td style="padding:10px;font-weight:600;">' + escapeHtml(s.student_name || '—') + '</td><td style="padding:10px;">' + escapeHtml(s.class_name || '—') + '</td><td style="padding:10px;"><span style="background:' + ac + '20;color:' + ac + ';padding:4px 10px;border-radius:6px;font-weight:600;">' + Math.round(avg) + '%</span></td><td style="padding:10px;">';
      if (ex) {
        var dc = ex.decision === 'approved' ? '#10b981' : '#dc2626';
        var dl = ex.decision === 'approved' ? '✅ معتمد' : '❌ مرفوض';
        h += '<span style="background:' + dc + '20;color:' + dc + ';padding:4px 10px;border-radius:6px;font-weight:600;">' + dl + '</span>';
      } else {
        h += '<button onclick="window._appEx(\'' + s.student_id + '\')" style="background:#10b981;color:white;padding:4px 10px;border:none;border-radius:6px;cursor:pointer;font-size:12px;margin-left:4px;">✅ اعتماد</button><button onclick="window._rejEx(\'' + s.student_id + '\')" style="background:#dc2626;color:white;padding:4px 10px;border:none;border-radius:6px;cursor:pointer;font-size:12px;">❌ رفض</button>';
      }
      h += '</td></tr>';
    });
    c.innerHTML = h + '</tbody></table></div>';
  } catch (e) { document.getElementById('acEx').innerHTML = '<div class="error-state"><p>' + e.message + '</p></div>'; }
};

window._appEx = async function(id) {
  var n = prompt('ملاحظات (اختياري):') || '';
  try {
    var r = await window.sbClient.from('academic_exemption_decisions').insert({ student_id: id, decision: 'approved', notes: n });
    if (r.error) throw r.error;
    window.showToast('✅ تم', 'تم الاعتماد', 'success');
    window._loadAcEx();
  } catch (e) { window.showToast('❌ فشل', e.message, 'error'); }
};

window._rejEx = async function(id) {
  if (!confirm('رفض الإعفاء؟')) return;
  var n = prompt('سبب الرفض:') || '';
  try {
    var r = await window.sbClient.from('academic_exemption_decisions').insert({ student_id: id, decision: 'rejected', notes: n });
    if (r.error) throw r.error;
    window.showToast('✅ تم', 'تم الرفض', 'success');
    window._loadAcEx();
  } catch (e) { window.showToast('❌ فشل', e.message, 'error'); }
};

async function init() {
  if (localStorage.getItem('darkMode') === '1') document.body.classList.add('dark');
  var user = await checkAuth();
  if (!user) return;
  document.getElementById('userName').textContent = user.name || user.email || 'مستخدم';
  var rl = { super_admin: '👑 المسؤول الأعلى', admin: '👑 مدير', finance: '💰 مالية', academic: '📚 أكاديمي', counselor: '💚 مرشد', psychologist: '🧠 أخصائي', discipline: '🛡️ انضباط', teacher: '👨‍🏫 معلم', parent: '👨‍👩‍👧 ولي أمر', student: '🎓 طالب' };
  document.getElementById('userRole').textContent = rl[window.currentUserRole] || window.currentUserRole;
  buildSidebar();
  buildBottomNav();
  var init = location.hash.replace('#','') || ROLE_SECTIONS[window.currentUserRole][0];
  navigate(init);
}

window.addEventListener('hashchange', function() {
  var ns = location.hash.replace('#','');
  if (ns && ns !== window.currentSection) navigate(ns);
});

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
