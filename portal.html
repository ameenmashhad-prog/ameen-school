<style>
/* تعديلات خاصة بـ portal.html فقط (لا تكرر ما هو موجود في components.css) */
.app-sidebar {
  display: flex !important;
  flex-direction: column;
  position: fixed;
  top: 0;
  inset-inline-end: 0;
  width: 260px;
  height: 100vh;
  overflow-y: auto;
  z-index: var(--z-sidebar);
  transition: transform var(--transition-standard);
}

@media (max-width: 1023px) {
  .app-sidebar {
    width: 72px;
  }
  .sidebar-brand-text, .sidebar-user-info { display: none; }
}

@media (max-width: 639px) {
  .app-sidebar {
    transform: translateX(100%);
    width: 280px;
  }
  .app-sidebar.open {
    transform: translateX(0);
  }
  .sidebar-brand-text, .sidebar-user-info { display: block; }
  .app-main { padding-block-end: 80px; }
}

[dir="rtl"] .app-sidebar { inset-inline-end: 0; transform: none; }
[dir="rtl"] @media (max-width: 639px) {
  .app-sidebar { transform: translateX(100%); }
  .app-sidebar.open { transform: translateX(0); }
}

.app-main {
  margin-inline-end: 260px;
  min-height: 100vh;
}

@media (max-width: 1023px) {
  .app-main { margin-inline-end: 72px; }
}

@media (max-width: 639px) {
  .app-main { margin-inline-end: 0; }
}

.app-topbar {
  background: var(--surface);
  padding: var(--space-3) var(--space-5);
  border-block-end: 1px solid var(--border-subtle);
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: var(--z-sticky);
}

.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: calc(var(--z-sidebar) - 1);
}
.sidebar-backdrop.active { display: block; }

@media (min-width: 640px) {
  .sidebar-backdrop { display: none !important; }
  .mobile-toggle { display: none !important; }
}

.mobile-toggle {
  background: transparent;
  border: none;
  font-size: 24px;
  cursor: pointer;
  color: var(--text-primary);
  width: var(--touch-min);
  height: var(--touch-min);
  display: flex;
  align-items: center;
  justify-content: center;
}

.sidebar-brand {
  padding: var(--space-5);
  border-block-end: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.sidebar-brand-logo {
  width: 44px;
  height: 44px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.sidebar-brand-text h1 {
  font-size: var(--text-body);
  color: var(--text-primary);
  font-weight: var(--weight-bold);
  margin: 0;
  animation: none;
}

.sidebar-brand-text small {
  font-size: var(--text-xs);
  color: var(--text-secondary);
}

.sidebar-user {
  padding: var(--space-3) var(--space-4);
  margin: var(--space-3);
  background: var(--surface-2);
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.sidebar-user-avatar {
  width: 40px;
  height: 40px;
  background: var(--primary);
  color: var(--text-on-primary);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: var(--weight-bold);
  flex-shrink: 0;
}

.sidebar-nav {
  flex: 1;
  padding: var(--space-2) var(--space-3);
  overflow-y: auto;
}

.sidebar-footer {
  padding: var(--space-3);
  border-block-start: 1px solid var(--border-subtle);
}

.logout-btn {
  width: 100%;
  padding: var(--space-3);
  background: var(--danger-tint);
  color: var(--danger);
  border: 1px solid var(--danger);
  border-radius: var(--radius-md);
  cursor: pointer;
  font-family: inherit;
  font-weight: var(--weight-semibold);
  min-height: var(--touch-min);
  transition: all var(--transition-fast);
}

.logout-btn:hover {
  background: var(--danger);
  color: var(--text-on-primary);
}

#main-content {
  padding: var(--space-6);
  max-width: 1400px;
  margin: 0 auto;
}

@media (max-width: 639px) {
  #main-content { padding: var(--space-4); }
}

.bottom-nav {
  display: none;
  position: fixed;
  bottom: 0;
  inset-inline: 0;
  background: var(--surface);
  border-block-start: 1px solid var(--border-subtle);
  padding: var(--space-2);
  z-index: var(--z-sticky);
  grid-template-columns: repeat(5, 1fr);
  gap: var(--space-1);
}

@media (max-width: 639px) {
  .bottom-nav { display: grid; }
}

.bottom-nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: var(--space-2);
  background: transparent;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-family: inherit;
  font-size: 10px;
  color: var(--text-secondary);
  min-height: var(--touch-min);
}

.bottom-nav-item.active {
  background: var(--primary-tint);
  color: var(--primary);
}

.bottom-nav-icon { font-size: 20px; }

/* Loading State بنجمة دوّارة */
.amin-loading-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--space-12) var(--space-4);
  gap: var(--space-4);
}

.amin-loading-text {
  color: var(--text-secondary);
  font-size: var(--text-sm);
}

/* Sections content */
.section-page-head {
  margin-block-end: var(--space-5);
}

.section-page-head h1 {
  font-size: var(--text-h1);
  color: var(--accent);
  margin-block-end: var(--space-2);
}

.section-page-head p {
  color: var(--text-secondary);
  font-size: var(--text-body);
}

/* KPI Grid */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: var(--space-4);
  margin-block-end: var(--space-6);
}

/* Generic Grid */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: var(--space-4);
}

/* Tabs custom for portal */
.amin-tabs-container {
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-soft);
  overflow: hidden;
  margin-block-end: var(--space-5);
}

.amin-tabs-nav {
  display: flex;
  background: var(--surface-2);
  border-block-end: 1px solid var(--border-subtle);
  overflow-x: auto;
}

.amin-tab-btn {
  padding: var(--space-4) var(--space-6);
  background: transparent;
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-size: var(--text-body);
  font-weight: var(--weight-semibold);
  color: var(--text-secondary);
  border-block-end: 3px solid transparent;
  white-space: nowrap;
  min-height: var(--touch-min);
  transition: color var(--transition-fast);
}

.amin-tab-btn:hover { color: var(--primary); }
.amin-tab-btn.active {
  color: var(--primary);
  border-block-end-color: var(--primary);
  background: var(--surface);
}

.amin-tab-content {
  display: none;
  padding: var(--space-5);
}
.amin-tab-content.active { display: block; }

/* Modal Container */
#modalContainer { position: relative; z-index: var(--z-modal); }

/* Filter Bar */
.amin-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  align-items: flex-end;
  background: var(--surface);
  padding: var(--space-4);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-soft);
  margin-block-end: var(--space-5);
}

.amin-filter-field {
  flex: 1;
  min-width: 160px;
}

.amin-filter-field label {
  display: block;
  font-size: var(--text-sm);
  color: var(--text-secondary);
  font-weight: var(--weight-medium);
  margin-block-end: var(--space-2);
}

.amin-input, .amin-select {
  width: 100%;
  min-height: var(--touch-min);
  padding: var(--space-3) var(--space-4);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: var(--surface);
  color: var(--text-primary);
  font-family: inherit;
  font-size: var(--text-body);
  transition: border-color var(--transition-fast);
}

.amin-input:focus, .amin-select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-shadow);
}

/* Section title with badge */
.section-title-with-count {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-block-end: var(--space-3);
}

.count-badge {
  background: var(--primary-tint);
  color: var(--primary);
  padding: 2px 10px;
  border-radius: var(--radius-full);
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
}

/* Action buttons row */
.action-row {
  display: flex;
  gap: var(--space-2);
  flex-wrap: wrap;
  margin-block-end: var(--space-4);
}
</style>
</head>
<body>

<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar()"></div>

<div class="app-layout">

<aside class="app-sidebar" id="appSidebar">
  <div class="sidebar-brand">
    <div class="sidebar-brand-logo" id="sidebarLogo"></div>
    <div class="sidebar-brand-text">
      <h1>أمين الرضا</h1>

</div>

<nav class="bottom-nav" id="bottomNav"></nav>

<div id="modalContainer"></div>

<script>
(function(){
'use strict';

// ====================================
// ROLE SECTIONS & META
// ====================================
var ROLE_SECTIONS = {
  super_admin: ['overview','students','academic','finance','attendance','discipline','registrations','schedule','payroll','settings','system'],
  admin: ['overview','students','academic','finance','attendance','discipline','registrations','schedule','payroll','settings','system'],
  finance: ['overview','finance'],
  academic: ['overview','students','academic','attendance','registrations','schedule'],
  counselor: ['overview','students','attendance','discipline'],
  psychologist: ['overview','students','attendance','discipline'],
  discipline: ['overview','students','attendance','discipline'],
  teacher: ['overview','students','academic','attendance','schedule'],
  parent: ['overview','students','academic','attendance','finance'],
  student: ['overview','academic','attendance','schedule']
};

var SECTIONS_META = {
  overview: { title: 'لوحة القيادة', icon: '🏠', order: 1 },
  students: { title: 'الطلاب', icon: '🎓', order: 2 },
  academic: { title: 'الأكاديمي', icon: '📚', order: 3 },
  finance: { title: 'المالية', icon: '💰', order: 4 },
  attendance: { title: 'الحضور', icon: '📋', order: 5 },
  discipline: { title: 'السلوك', icon: '🛡️', order: 6 },
  registrations: { title: 'التسجيلات', icon: '📝', order: 7 },
  schedule: { title: 'الجدول', icon: '📅', order: 8 },
  payroll: { title: 'الرواتب', icon: '💵', order: 9 },
  settings: { title: 'الإعدادات', icon: '⚙️', order: 10 },
  system: { title: 'النظام', icon: '🔧', order: 11 }
};

var ROLE_LABELS = {
  super_admin: '👑 المسؤول الأعلى',
  admin: '👑 مدير النظام',
  finance: '💰 المسؤول المالي',
  academic: '📚 المسؤول العلمي',
  counselor: '💚 المرشد النفسي',
  psychologist: '🧠 أخصائي نفسي',
  discipline: '🛡️ مسؤول الانضباط',
  teacher: '👨‍🏫 معلم',
  parent: '👨‍👩‍👧 ولي أمر',
  student: '🎓 طالب'
};

window.currentSection = null;
window.currentUser = null;
window.currentUserRole = null;
window.sbClient = null;

// ====================================
// HELPERS
// ====================================
function esc(v) {
  return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
window.escapeHtml = esc;
window.formatNumber = function(n){ return Number(n||0).toLocaleString('ar-IQ'); };
window.formatMoney = function(n){ return '$' + Number(n||0).toLocaleString('ar-IQ', {maximumFractionDigits:0}); };

// Loading state بنجمة دوّارة
window.renderLoading = function(containerId, message) {
  var c = document.getElementById(containerId) || document.getElementById('main-content');
  if (!c) return;
  var starHTML = window.AminStar ? window.AminStar.createStar({variant:'spinning', size:48, color:'var(--primary)'}) : '⏳';
  c.innerHTML = '<div class="amin-loading-state">' + starHTML + '<div class="amin-loading-text">' + esc(message || 'جاري التحميل...') + '</div></div>';
};

// Error inline
window.renderError = function(containerId, message, retryFn) {
  var c = document.getElementById(containerId) || document.getElementById('main-content');
  if (!c) return;
  var retryHandler = retryFn || 'navigate(window.currentSection)';
  c.innerHTML = '<div class="error-inline" role="alert">' +
    '<div class="error-inline-icon">⚠</div>' +
    '<div class="error-inline-msg">' + esc(message || 'حدث خطأ في التحميل') + '</div>' +
    '<button class="error-inline-retry" onclick="' + retryHandler + '">إعادة المحاولة</button>' +
  '</div>';
};

// Toast unified
window.showToast = function(title, msg, type) {
  if (window.showAminToast) {
    window.showAminToast(title, msg, type);
  } else {
    console.log('[' + (type||'info') + ']', title, msg);
  }
};

// Modal unified
window.openModal = function(config) {
  closeModal();
  var c = document.getElementById('modalContainer');
  var backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop-soft';
  backdrop.id = 'activeModalBackdrop';
  
  var modal = document.createElement('div');
  modal.className = 'modal-soft ' + (config.width || 'md');
  modal.innerHTML = 
    '<div class="modal-soft-header">' +
      '<h3 style="font-size:var(--text-h3);font-weight:var(--weight-bold);">' + esc(config.title) + '</h3>' +
      '<button class="mobile-toggle" onclick="closeModal()" style="font-size:24px;color:var(--text-secondary);">×</button>' +
    '</div>' +
    '<div class="modal-soft-body" id="modalBody"></div>';
  
  backdrop.appendChild(modal);
  c.appendChild(backdrop);
  
  var body = modal.querySelector('#modalBody');
  if (typeof config.content === 'string') body.innerHTML = config.content;
  else if (config.content instanceof HTMLElement) body.appendChild(config.content);
  
  backdrop.addEventListener('click', function(e){ if (e.target === backdrop) closeModal(); });
};

window.closeModal = function() {
  var bd = document.getElementById('activeModalBackdrop');
  if (bd) bd.remove();
};

// Tabs unified
window.initTabs = function(containerId) {
  var c = document.getElementById(containerId);
  if (!c) return;
  var btns = c.querySelectorAll('.amin-tab-btn[data-tab]');
  var contents = c.querySelectorAll('.amin-tab-content[data-tab-content]');
  var active = c.dataset.activeTab || (btns[0] && btns[0].dataset.tab);
  
  function activate(name) {
    btns.forEach(function(b){ b.classList.toggle('active', b.dataset.tab === name); });
    contents.forEach(function(ct){ ct.classList.toggle('active', ct.dataset.tabContent === name); });
    c.dataset.activeTab = name;
  }
  
  btns.forEach(function(b){ b.addEventListener('click', function(){ activate(b.dataset.tab); }); });
  if (active) activate(active);
};

// Empty state بنجمة watermark
window.renderEmpty = function(containerId, message) {
  var c = document.getElementById(containerId) || document.getElementById('main-content');
  if (!c) return;
  if (window.AminStar) {
    c.innerHTML = window.AminStar.createEmptyState(message || 'لا توجد بيانات', '');
  } else {
    c.innerHTML = '<div class="amin-empty-state"><h3 class="amin-empty-title">' + esc(message || 'لا توجد بيانات') + '</h3></div>';
  }
};

// Fetch students by IDs (لتجنب JOIN errors)
async function fetchStudentsByIds(ids) {
  if (!ids || !ids.length) return {};
  try {
    var unique = Array.from(new Set(ids.filter(Boolean)));
    if (!unique.length) return {};
    var r = await window.sbClient.from('students').select('id, name, class_id, users(name)').in('id', unique);
    var map = {};
    (r.data || []).forEach(function(s){
      map[s.id] = {
        name: (s.users && s.users.name) || s.name || 'طالب',
        class_id: s.class_id
      };
    });
    return map;
  } catch (e) {
    console.warn('Students fetch error:', e);
    return {};
  }
}

// ====================================
// AUTH
// ====================================
async function checkAuth() {
  try {
    if (!window.supabase || !window.AMIN_CONFIG) throw new Error('Supabase not loaded');
    var sb = window.supabase.createClient(
      window.AMIN_CONFIG.supabaseUrl,
      window.AMIN_CONFIG.supabaseAnonKey,
      {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storageKey:(window.AMIN_CONFIG.authStorageKey||'amin-ovcjzsrqqgjsbqswtkro-auth-v2')}}
    );
    window.sbClient = sb;
    
    var sessionRes = await sb.auth.getSession();
    if (!sessionRes.data.session) {
      setTimeout(function(){ location.href = 'index.html'; }, 500);
      return null;
    }
    
    var userRes = await sb.from('users').select('*').eq('id', sessionRes.data.session.user.id).maybeSingle();
    if (!userRes.data) {
      setTimeout(function(){ location.href = 'index.html'; }, 500);
      return null;
    }
    
    var user = userRes.data;
    var role = user.is_super_admin ? 'super_admin' : (user.role || 'guest');
    
    if (!ROLE_SECTIONS[role]) {
      window.showToast('غير مصرّح', 'ليس لديك صلاحية', 'error');
      setTimeout(function(){ location.href = 'index.html'; }, 2000);
      return null;
    }
    
    window.currentUser = user;
    window.currentUserRole = role;
    window.ME = user;
    return user;
  } catch (e) {
    console.error('Auth error:', e);
    setTimeout(function(){ location.href = 'index.html'; }, 1000);
    return null;
  }
}

// ====================================
// SIDEBAR & NAV
// ====================================
function buildSidebar() {
  var role = window.currentUserRole;
  var allowed = ROLE_SECTIONS[role] || [];
  var nav = document.getElementById('sidebarNav');
  if (!allowed.length) {
    nav.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-tertiary);">لا توجد أقسام</div>';
    return;
  }
  
  var sorted = allowed.filter(function(s){ return SECTIONS_META[s]; })
    .sort(function(a,b){ return SECTIONS_META[a].order - SECTIONS_META[b].order; });
  
  var html = '';
  sorted.forEach(function(id){
    var m = SECTIONS_META[id];
    html += '<button class="sidebar-nav-item" data-section="' + id + '" onclick="navigate(\'' + id + '\')">' +
      '<span class="nav-icon-wrap">' + m.icon + '</span>' +
      '<span class="sidebar-nav-label">' + m.title + '</span>' +
    '</button>';
  });
  nav.innerHTML = html;
  
  // Logo as star
  var logoEl = document.getElementById('sidebarLogo');
  if (logoEl && window.AminStar) {
    logoEl.innerHTML = window.AminStar.createStar({variant:'filled', size:28, color:'white'});
  } else if (logoEl) {
    logoEl.innerHTML = '🎓';
  }
}

function buildBottomNav() {
  var role = window.currentUserRole;
  var allowed = ROLE_SECTIONS[role] || [];
  var nav = document.getElementById('bottomNav');
  var top5 = allowed.filter(function(s){ return SECTIONS_META[s]; })
    .sort(function(a,b){ return SECTIONS_META[a].order - SECTIONS_META[b].order; })
    .slice(0, 5);
  
  var html = '';
  top5.forEach(function(id){
    var m = SECTIONS_META[id];
    html += '<button class="bottom-nav-item" data-section="' + id + '" onclick="navigate(\'' + id + '\')">' +
      '<span class="bottom-nav-icon">' + m.icon + '</span>' +
      '<span>' + m.title + '</span>' +
    '</button>';
  });
  nav.innerHTML = html;
}

window.navigate = function(sectionId) {
  var role = window.currentUserRole;
  var allowed = ROLE_SECTIONS[role] || [];
  if (!sectionId || allowed.indexOf(sectionId) === -1) sectionId = allowed[0] || 'overview';
  if (location.hash !== '#' + sectionId) location.hash = sectionId;
  window.currentSection = sectionId;
  
  document.querySelectorAll('.sidebar-nav-item[data-section]').forEach(function(i){
    i.classList.toggle('active', i.dataset.section === sectionId);
  });
  document.querySelectorAll('.bottom-nav-item[data-section]').forEach(function(i){
    i.classList.toggle('active', i.dataset.section === sectionId);
  });
  
  var meta = SECTIONS_META[sectionId];
  if (meta) {
    document.getElementById('pageTitle').textContent = meta.icon + ' ' + meta.title;
    document.title = meta.title + ' — البوابة الموحدة';
  }
  
  if (window.innerWidth <= 639) {
    document.getElementById('appSidebar').classList.remove('open');
    document.getElementById('sidebarBackdrop').classList.remove('active');
  }
  
  window.renderLoading('main-content', 'جاري تحميل ' + (meta ? meta.title : 'القسم') + '...');
  
  var section = window.SECTIONS[sectionId];
  if (section && typeof section.load === 'function') {
    Promise.resolve(section.load()).catch(function(err){
      console.error('Section error:', err);
      window.renderError('main-content', err.message || 'فشل التحميل');
    });
  } else {
    window.renderEmpty('main-content', (meta ? meta.title : '') + ' - قيد التطوير');
  }
};

window.toggleSidebar = function() {
  document.getElementById('appSidebar').classList.toggle('open');
  document.getElementById('sidebarBackdrop').classList.toggle('active');
};

window.toggleDarkMode = function() {
  document.body.classList.toggle('dark');
  var dark = document.body.classList.contains('dark');
  localStorage.setItem('darkMode', dark ? '1' : '0');
  document.getElementById('darkModeBtn').textContent = dark ? '☀️' : '🌙';
  window.showToast(dark ? 'الوضع الليلي' : 'الوضع النهاري', null, 'success');
};

window._renderStudentsTable = function(s) {
  var c = document.getElementById('studentsTable');
  if (!s.length) {
    if (window.AminStar) c.innerHTML = window.AminStar.createEmptyState('لا يوجد طلاب', '');
    return;
  }
  
  if (window.renderResponsiveTable) {
    window.renderResponsiveTable(c, s, [
      { key: 'full_name', label: 'الاسم' },
      { key: 'class_name', label: 'الصف' },
      {
        key: 'attendance_rate', label: 'الحضور%',
        render: function(v) {
          var r = Number(v || 0);
          var color = r >= 90 ? 'success' : r >= 75 ? 'warning' : 'danger';
          return '<span class="badge-flat ' + color + '">' + Math.round(r) + '%</span>';
        }
      },
      {
        key: 'last_absent_date', label: 'آخر غياب',
        render: function(v) { return v ? String(v).slice(0,10) : '—'; }
      }
    ], {
      primaryFields: ['full_name', 'class_name'],
      mobileExpandable: ['attendance_rate', 'last_absent_date'],
      rowAction: { label: '📋 ملف', onClick: function(row){ window._openSF(row.id); } }
    });
  } else {
    // Fallback
    var html = '<table class="table-flat"><thead><tr><th>الاسم</th><th>الصف</th><th>الحضور</th><th>إجراء</th></tr></thead><tbody>';
    s.forEach(function(x){
      var r = Number(x.attendance_rate || 0);
      var color = r >= 90 ? 'success' : r >= 75 ? 'warning' : 'danger';
      html += '<tr><td>' + esc(x.full_name) + '</td><td>' + esc(x.class_name) + '</td><td><span class="badge-flat ' + color + '">' + Math.round(r) + '%</span></td><td><button class="btn-3d-primary" style="min-height:32px;padding:6px 14px;font-size:13px;" onclick="window._openSF(\'' + x.id + '\')">📋 ملف</button></td></tr>';
    });
    html += '</tbody></table>';
    c.innerHTML = html;
  }
};

window._filterStudents = function() {
  var s = (document.getElementById('studentSearch').value || '').toLowerCase().trim();
  var cf = document.getElementById('classFilter').value;
  var f = (window._studentsData || []).filter(function(x){
    if (s && !(x.full_name || '').toLowerCase().includes(s)) return false;
    if (cf && x.class_name !== cf) return false;
    return true;
  });
  window._renderStudentsTable(f);
};

window._openSF = async function(id) {
  window.openModal({ title: '📋 ملف الطالب', width: 'lg', content: '<div class="skeleton skeleton-card"></div>' });
  try {
    var r = await Promise.all([
      window.sbClient.from('students').select('*, users(name, email, phone)').eq('id', id).maybeSingle(),
      window.sbClient.from('attendance').select('*').eq('student_id', id).order('date', {ascending: false}).limit(5),
      window.sbClient.from('behavior_records').select('*').eq('student_id', id).order('created_at', {ascending: false}).limit(5)
    ]);
    var st = r[0].data || {}, att = r[1].data || [], beh = r[2].data || [];
    var name = (st.users && st.users.name) || st.name || 'طالب';
    
    var h = '<div style="margin-block-end:var(--space-5);padding:var(--space-4);background:linear-gradient(135deg,var(--primary),var(--accent));color:white;border-radius:var(--radius-lg);"><h3 style="font-size:var(--text-h3);font-weight:var(--weight-bold);">🎓 ' + esc(name) + '</h3></div>';
    
    h += '<h4 style="margin:var(--space-4) 0 var(--space-2);color:var(--primary);">📋 آخر الحضور</h4>';
    if (att.length === 0) {
      h += '<div style="color:var(--text-secondary);padding:var(--space-3);">لا توجد سجلات</div>';
    } else {
      h += '<table class="table-flat">';
      att.forEach(function(a){
        var color = a.status === 'present' ? 'success' : a.status === 'absent' ? 'danger' : 'warning';
        var lb = a.status === 'present' ? 'حاضر' : a.status === 'absent' ? 'غائب' : 'متأخر';
        h += '<tr><td>' + String(a.date).slice(0,10) + '</td><td><span class="badge-flat ' + color + '">' + lb + '</span></td></tr>';
      });
      h += '</table>';
    }
    
    h += '<h4 style="margin:var(--space-4) 0 var(--space-2);color:var(--primary);">🌟 آخر الملاحظات</h4>';
    if (beh.length === 0) {
      h += '<div style="color:var(--text-secondary);padding:var(--space-3);">لا توجد ملاحظات</div>';
    } else {
      h += '<table class="table-flat">';
      beh.forEach(function(b){
        var p = Number(b.points || 0);
        var color = p >= 0 ? 'success' : 'danger';
        h += '<tr><td>' + String(b.created_at || '').slice(0,10) + '</td><td>' + esc(b.note || '—') + '</td><td><span class="badge-flat ' + color + '">' + (p > 0 ? '+' : '') + p + '</span></td></tr>';
      });
      h += '</table>';
    }
    
    document.getElementById('modalBody').innerHTML = h;
  } catch (e) {
    document.getElementById('modalBody').innerHTML = '<div class="error-inline"><div class="error-inline-icon">⚠</div><div class="error-inline-msg">' + esc(e.message) + '</div></div>';
  }
};

// ====================================
// HELPERS - Schedule
// ====================================
window._renderSch = function() {
  var cf = document.getElementById('schCF').value;
  var tf = document.getElementById('schTF').value;
  var d = (window._scheduleData || []).filter(function(s){
    if (cf && s.class_name !== cf) return false;
    if (tf && s.teacher_name !== tf) return false;
    return true;
  });
  
  var days = ['السبت', 'الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];
  var periods = [1,2,3,4,5,6,7,8];
  var grid = {};
  d.forEach(function(s){
    var k = s.day + '_' + s.period;
    if (!grid[k]) grid[k] = [];
    grid[k].push(s);
  });
  
  if (!d.length) {
    window.renderEmpty('schGrid', 'لا توجد بيانات للجدول');
    return;
  }
  
  var h = '<table class="table-flat" style="min-width:800px;"><thead><tr><th>اليوم</th>';
  periods.forEach(function(p){ h += '<th>حصة ' + p + '</th>'; });
  h += '</tr></thead><tbody>';
  
  days.forEach(function(day){
    h += '<tr><td style="background:var(--surface-2);font-weight:bold;text-align:center;">' + day + '</td>';
    periods.forEach(function(p){
      var k = day + '_' + p;
      var cells = grid[k] || [];
      if (!cells.length) {
        h += '<td style="text-align:center;color:var(--text-tertiary);">—</td>';
      } else {
        h += '<td style="padding:8px;font-size:12px;">';
        cells.forEach(function(s){
          h += '<div style="background:var(--primary-tint);padding:6px 8px;border-radius:var(--radius-sm);margin-block-end:4px;border-inline-start:3px solid var(--primary);"><b style="color:var(--primary);">' + esc(s.subject || '—') + '</b>';
          if (!tf) h += '<div style="color:var(--text-secondary);font-size:11px;margin-block-start:2px;">👨‍🏫 ' + esc(s.teacher_name || '—') + '</div>';
          if (!cf) h += '<div style="color:var(--text-secondary);font-size:11px;">📚 ' + esc(s.class_name || '—') + '</div>';
          h += '</div>';
        });
        h += '</td>';
      }
    });
    h += '</tr>';
  });
  h += '</tbody></table>';
  
  document.getElementById('schGrid').innerHTML = h;
};

// ====================================
// HELPERS - Payroll
// ====================================
window._loadPay = async function() {
  var m = document.getElementById('payM').value;
  var c = document.getElementById('payT');
  window.renderLoading('payT');
  try {
    var q = window.sbClient.from('v_teacher_payroll_preview').select('*');
    if (m) q = q.eq('month', m);
    var r = await q;
    var d = r.data || [];
    window._payData = d;
    
    if (!d.length) { window.renderEmpty('payT', 'لا توجد بيانات للشهر المحدد'); return; }
    
    var ts = d.reduce(function(s,r){ return s + Number(r.total_salary || 0); }, 0);
    var tsn = d.reduce(function(s,r){ return s + Number(r.verified_sessions || 0); }, 0);
    
    var h = '<div class="kpi-grid">';
    h += '<div class="kpi-card kpi-info"><div class="kpi-label">المعلمون</div><div class="kpi-value">' + d.length + '</div></div>';
    h += '<div class="kpi-card kpi-success"><div class="kpi-label">إجمالي الحصص</div><div class="kpi-value">' + tsn + '</div></div>';
    h += '<div class="kpi-card kpi-secondary"><div class="kpi-label">إجمالي الرواتب</div><div class="kpi-value">' + window.formatMoney(ts) + '</div></div>';
    h += '</div>';
    h += '<div id="payTable"></div>';
    c.innerHTML = h;
    
    if (window.renderResponsiveTable) {
      window.renderResponsiveTable(document.getElementById('payTable'), d, [
        { key: 'teacher_name', label: 'المعلم' },
        { key: 'verified_sessions', label: 'الحصص' },
        { key: 'hourly_rate', label: 'السعر', render: function(v){ return window.formatMoney(v); } },
        { key: 'total_salary', label: 'الراتب', render: function(v){ return '<span style="color:var(--success);font-weight:bold;">' + window.formatMoney(v) + '</span>'; } }
      ], {
        primaryFields: ['teacher_name', 'total_salary'],
        mobileExpandable: ['verified_sessions', 'hourly_rate']
      });
    }
  } catch (e) {
    window.renderError('payT', e.message);
  }
};

window._expPay = function() {
  if (!window.XLSX) { window.showToast('تنبيه', 'مكتبة Excel غير محملة', 'warning'); return; }
  var d = window._payData || [];
  if (!d.length) { window.showToast('تنبيه', 'لا توجد بيانات', 'warning'); return; }
  try {
    var rows = d.map(function(r){ return { 'المعلم': r.teacher_name, 'الحصص': r.verified_sessions, 'السعر': r.hourly_rate, 'الراتب': r.total_salary }; });
    var ws = window.XLSX.utils.json_to_sheet(rows);
    var wb = window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(wb, ws, 'الرواتب');
    window.XLSX.writeFile(wb, 'رواتب_' + (document.getElementById('payM').value || 'الحالي') + '.xlsx');
    window.showToast('تم التصدير', '', 'success');
  } catch (e) { window.showToast('فشل', e.message, 'error'); }
};

// ====================================
// HELPERS - System
// ====================================
window._loadSys = async function() {
  var c = document.getElementById('sysC');
  try {
    var r = await window.sbClient.rpc('final_system_readiness_check');
    var res = r.data || {};
    window._sysRes = res;
    var units = res.units || [];
    var summary = res.summary || {};
    
    var h = '<div class="kpi-grid">';
    h += '<div class="kpi-card kpi-success"><div class="kpi-label">جاهز</div><div class="kpi-value">' + (summary.ready || 0) + '</div><div class="kpi-icon">✓</div></div>';
    h += '<div class="kpi-card kpi-warning"><div class="kpi-label">تحذير</div><div class="kpi-value">' + (summary.warning || 0) + '</div><div class="kpi-icon">⚠</div></div>';
    h += '<div class="kpi-card kpi-danger"><div class="kpi-label">مفقود</div><div class="kpi-value">' + (summary.missing || 0) + '</div><div class="kpi-icon">✕</div></div>';
    h += '</div>';
    
    h += '<div style="display:flex;gap:var(--space-2);margin-block-end:var(--space-5);">';
    h += '<button class="btn-3d-primary" onclick="window._copySys()">📋 نسخ JSON</button>';
    h += '<button class="btn-3d-secondary" onclick="window._loadSys()">🔄 إعادة الفحص</button>';
    h += '</div>';
    
    if (units.length) {
      h += '<h3 style="margin-block-end:var(--space-3);">📦 الوحدات</h3><div class="cards-grid">';
      units.forEach(function(u){
        var ic = u.status === 'ready' ? '✓' : u.status === 'warning' ? '⚠' : '✕';
        var kind = u.status === 'ready' ? 'success' : u.status === 'warning' ? 'warning' : 'danger';
        h += '<div class="card-soft" style="border-inline-start:4px solid var(--' + kind + ');">';
        h += '<div style="display:flex;align-items:center;gap:var(--space-2);margin-block-end:var(--space-2);"><span class="badge-flat ' + kind + '" style="font-size:18px;padding:4px 12px;">' + ic + '</span><b>' + esc(u.name || '—') + '</b></div>';
        if (u.details) h += '<div style="color:var(--text-secondary);font-size:var(--text-sm);">' + esc(u.details) + '</div>';
        h += '</div>';
      });
      h += '</div>';
    }
    
    c.innerHTML = h;
  } catch (e) {
    window.renderError('sysC', e.message, 'window._loadSys()');
  }
};

window._copySys = function() {
  if (!window._sysRes) return;
  try {
    navigator.clipboard.writeText(JSON.stringify(window._sysRes, null, 2));
    window.showToast('تم النسخ', '', 'success');
  } catch (e) { window.showToast('فشل', e.message, 'error'); }
};

// HELPERS - Academic
// ====================================
window._loadAcGr = async function() {
  try {
    var r = await Promise.all([
      window.sbClient.from('classes').select('id, name').order('name'),
      window.sbClient.from('subjects').select('id, name').order('name'),
      window.sbClient.from('academic_periods').select('*').order('start_date', {ascending: false}).limit(10)
    ]);
    var classes = r[0].data || [], subjects = r[1].data || [], periods = r[2].data || [];
    
    var h = '<div class="amin-filter-bar">';
    h += '<div class="amin-filter-field"><label>📚 الصف</label><select id="acGC" class="amin-select"><option value="">اختر...</option>';
    classes.forEach(function(c){ h += '<option value="' + c.id + '">' + esc(c.name) + '</option>'; });
    h += '</select></div>';
    h += '<div class="amin-filter-field"><label>📖 المادة</label><select id="acGS" class="amin-select"><option value="">اختر...</option>';
    subjects.forEach(function(s){ h += '<option value="' + s.id + '">' + esc(s.name) + '</option>'; });
    h += '</select></div>';
    h += '<div class="amin-filter-field"><label>📅 الفصل</label><select id="acGP" class="amin-select"><option value="">اختر...</option>';
    periods.forEach(function(p){ h += '<option value="' + p.id + '">' + esc(p.name || p.title || 'فصل') + '</option>'; });
    h += '</select></div>';
    h += '<button class="btn-3d-primary" onclick="window._loadGD()">🔍 عرض</button>';
    h += '</div>';
    h += '<div id="acGT"></div>';
    document.getElementById('acGr').innerHTML = h;
  } catch (e) { window.renderError('acGr', e.message); }
};

window._loadGD = async function() {
  var ci = document.getElementById('acGC').value;
  var si = document.getElementById('acGS').value;
  var pi = document.getElementById('acGP').value;
  if (!ci || !si || !pi) { window.showToast('تنبيه', 'اختر الصف والمادة والفصل', 'warning'); return; }
  
  var c = document.getElementById('acGT');
  window.renderLoading('acGT');
  try {
    var r = await window.sbClient.from('v_academic_subject_results').select('*').eq('class_id', ci).eq('subject_id', si).eq('period_id', pi);
    var d = r.data || [];
    if (!d.length) { window.renderEmpty('acGT', 'لا توجد درجات'); return; }
    
    var h = '<div style="margin-block-end:var(--space-3);">إجمالي: <b>' + d.length + '</b> طالب</div>';
    h += '<table class="table-flat"><thead><tr><th>الطالب</th><th>المستمر</th><th>الاختبار</th><th>النهائي</th><th>الحالة</th></tr></thead><tbody>';
    d.forEach(function(g){
      var fs = Number(g.final_score || 0);
      var bg = fs >= 60 ? 'var(--success-tint)' : fs >= 40 ? 'var(--warning-tint)' : 'var(--danger-tint)';
      var passed = g.passed || fs >= 60;
      h += '<tr style="background:' + bg + ';">';
      h += '<td style="font-weight:600;">' + esc(g.student_name || '—') + '</td>';
      h += '<td>' + (g.continuous_score || 0) + '</td>';
      h += '<td>' + (g.exam_score || 0) + '</td>';
      h += '<td style="font-weight:bold;">' + fs + '</td>';
      h += '<td>' + (passed ? '<span class="badge-flat success">✓ ناجح</span>' : '<span class="badge-flat danger">✕ راسب</span>') + '</td>';
      h += '</tr>';
    });
    h += '</tbody></table>';
    c.innerHTML = h;
  } catch (e) { window.renderError('acGT', e.message); }
};

window._loadAcEx = async function() {
  try {
    var r = await window.sbClient.from('v_academic_student_summary').select('*').eq('is_exempt_candidate', true).limit(200);
    var d = r.data || [];
    var dr = await window.sbClient.from('academic_exemption_decisions').select('*');
    var dec = dr.data || [];
    var dm = {};
    dec.forEach(function(x){ dm[x.student_id] = x; });
    
    var c = document.getElementById('acEx');
    if (!d.length) { window.renderEmpty('acEx', 'لا يوجد مرشحون للإعفاء'); return; }
    
    var h = '<div style="margin-block-end:var(--space-3);">المرشحون: <b>' + d.length + '</b></div>';
    h += '<table class="table-flat"><thead><tr><th>الطالب</th><th>الصف</th><th>المعدل</th><th>القرار</th></tr></thead><tbody>';
    d.forEach(function(s){
      var ex = dm[s.student_id];
      var avg = Number(s.avg_score || 0);
      var color = avg >= 60 ? 'success' : avg >= 40 ? 'warning' : 'danger';
      h += '<tr>';
      h += '<td style="font-weight:600;">' + esc(s.student_name || '—') + '</td>';
      h += '<td>' + esc(s.class_name || '—') + '</td>';
      h += '<td><span class="badge-flat ' + color + '">' + Math.round(avg) + '%</span></td>';
      h += '<td>';
      if (ex) {
        var dc = ex.decision === 'approved' ? 'success' : 'danger';
        var dl = ex.decision === 'approved' ? '✓ معتمد' : '✕ مرفوض';
        h += '<span class="badge-flat ' + dc + '">' + dl + '</span>';
      } else {
        h += '<button class="btn-3d-primary" style="min-height:32px;padding:4px 10px;font-size:12px;margin-inline-end:4px;" onclick="window._appEx(\'' + s.student_id + '\')">✓ اعتماد</button>';
        h += '<button class="btn-3d-danger" style="min-height:32px;padding:4px 10px;font-size:12px;" onclick="window._rejEx(\'' + s.student_id + '\')">✕ رفض</button>';
      }
      h += '</td></tr>';
    });
    h += '</tbody></table>';
    c.innerHTML = h;
  } catch (e) { window.renderError('acEx', e.message); }
};

window._appEx = async function(id) {
  var n = prompt('ملاحظات (اختياري):') || '';
  try {
    var r = await window.sbClient.from('academic_exemption_decisions').insert({ student_id: id, decision: 'approved', notes: n });
    if (r.error) throw r.error;
    window.showToast('تم الاعتماد', '', 'success');
    window._loadAcEx();
  } catch (e) { window.showToast('فشل', e.message, 'error'); }
};

window._rejEx = async function(id) {
  if (!confirm('رفض الإعفاء؟')) return;
  var n = prompt('سبب الرفض:') || '';
  try {
    var r = await window.sbClient.from('academic_exemption_decisions').insert({ student_id: id, decision: 'rejected', notes: n });
    if (r.error) throw r.error;
    window.showToast('تم الرفض', '', 'success');
    window._loadAcEx();
  } catch (e) { window.showToast('فشل', e.message, 'error'); }
};

// ====================================
// INIT
// ====================================
async function initPage() {
  if (localStorage.getItem('darkMode') === '1') {
    document.body.classList.add('dark');
    document.getElementById('darkModeBtn').textContent = '☀️';
  }
  
  var user = await checkAuth();
  if (!user) return;
  
  document.getElementById('userName').textContent = user.name || user.email || 'مستخدم';
  document.getElementById('userRole').textContent = ROLE_LABELS[window.currentUserRole] || window.currentUserRole;
  
  // Avatar: أول حرف من الاسم
  var avatar = document.getElementById('userAvatar');
  if (avatar && user.name) {
    avatar.textContent = user.name.charAt(0);
  }
  
  buildSidebar();
  buildBottomNav();
  
  var initial = location.hash.replace('#','') || ROLE_SECTIONS[window.currentUserRole][0];
  navigate(initial);
}

window.addEventListener('hashchange', function() {
  var ns = location.hash.replace('#','');
  if (ns && ns !== window.currentSection) navigate(ns);
});

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initPage);
} else {
  initPage();
}

})();
