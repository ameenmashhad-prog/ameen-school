<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B6E4F">
<title>البوابة الموحدة — مدارس أمين الرضا</title>
  <link rel="stylesheet" href="assets/amin.css">
<link rel="stylesheet" href="assets/i18n.css">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
.app-layout { display: flex; min-height: 100vh; }
.app-sidebar { display: flex; flex-direction: column; position: fixed; top: 0; inset-inline-end: 0; width: 260px; height: 100vh; overflow-y: auto; z-index: 200; background: var(--surface); border-inline-start: 1px solid var(--border-subtle); transition: transform 350ms; }
.app-main { flex: 1; margin-inline-end: 260px; min-height: 100vh; }
.app-topbar { background: var(--surface); padding: var(--space-3) var(--space-5); border-block-end: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
.sidebar-brand { padding: var(--space-5); border-block-end: 1px solid var(--border-subtle); display: flex; align-items: center; gap: var(--space-3); }
.sidebar-brand-logo { width: 44px; height: 44px; background: linear-gradient(135deg, var(--primary), var(--accent)); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.sidebar-brand-text h1 { font-size: var(--text-body); color: var(--text-primary); font-weight: 700; margin: 0; }
.sidebar-brand-text small { font-size: var(--text-xs); color: var(--text-secondary); }
.sidebar-user { padding: var(--space-3) var(--space-4); margin: var(--space-3); background: var(--surface-2); border-radius: var(--radius-md); display: flex; align-items: center; gap: var(--space-3); }
.sidebar-user-avatar { width: 40px; height: 40px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
.sidebar-nav { flex: 1; padding: var(--space-2) var(--space-3); overflow-y: auto; }
.sidebar-nav-item { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); margin-block-end: var(--space-1); border-radius: var(--radius-md); cursor: pointer; color: var(--text-secondary); border: none; background: transparent; text-align: start; font-family: inherit; font-size: var(--text-body); width: 100%; transition: all 200ms; }
.sidebar-nav-item:hover { background: var(--surface-2); color: var(--primary); }
.sidebar-nav-item.active { background: var(--primary); color: white; box-shadow: 0 4px 12px var(--primary-shadow); }
.sidebar-footer { padding: var(--space-3); border-block-start: 1px solid var(--border-subtle); }
.logout-btn { width: 100%; padding: var(--space-3); background: var(--danger-tint); color: var(--danger); border: 1px solid var(--danger); border-radius: var(--radius-md); cursor: pointer; font-family: inherit; font-weight: 600; min-height: 44px; }
.logout-btn:hover { background: var(--danger); color: white; }
.mobile-toggle { background: transparent; border: none; font-size: 24px; cursor: pointer; color: var(--text-primary); width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
#main-content { padding: var(--space-6); max-width: 1400px; margin: 0 auto; }
.bottom-nav { display: none; position: fixed; bottom: 0; inset-inline: 0; background: var(--surface); border-block-start: 1px solid var(--border-subtle); padding: var(--space-2); z-index: 50; grid-template-columns: repeat(5, 1fr); gap: var(--space-1); }
.bottom-nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: var(--space-2); background: transparent; border: none; cursor: pointer; font-family: inherit; font-size: 10px; color: var(--text-secondary); min-height: 44px; }
.bottom-nav-item.active { background: var(--primary-tint); color: var(--primary); }
.bottom-nav-icon { font-size: 20px; }
.sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 199; }
.sidebar-backdrop.active { display: block; }
.amin-loading-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--space-12); gap: var(--space-4); }
.amin-loading-text { color: var(--text-secondary); }
.section-page-head { margin-block-end: var(--space-5); }
.section-page-head h1 { font-size: var(--text-h1); color: var(--accent); margin-block-end: var(--space-2); }
.section-page-head p { color: var(--text-secondary); }
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-4); margin-block-end: var(--space-6); }
.amin-filter-bar { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: flex-end; background: var(--surface); padding: var(--space-4); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); margin-block-end: var(--space-5); }
.amin-filter-field { flex: 1; min-width: 160px; }
.amin-filter-field label { display: block; font-size: var(--text-sm); color: var(--text-secondary); margin-block-end: var(--space-2); }
.amin-input, .amin-select { width: 100%; min-height: 44px; padding: var(--space-3) var(--space-4); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); background: var(--surface); color: var(--text-primary); font-family: inherit; font-size: var(--text-body); }
.amin-input:focus, .amin-select:focus { outline: none; border-color: var(--primary); }

@media (max-width: 1023px) {
  .app-sidebar { width: 72px; }
  .sidebar-brand-text, .sidebar-user > div:last-child { display: none; }
  .sidebar-nav-label { display: none; }
  .app-main { margin-inline-end: 72px; }
}

@media (max-width: 639px) {
  .app-sidebar { transform: translateX(100%); width: 280px; }
  .app-sidebar.open { transform: translateX(0); }
  .sidebar-brand-text, .sidebar-user > div:last-child, .sidebar-nav-label { display: block; }
  .app-main { margin-inline-end: 0; padding-block-end: 80px; }
  .bottom-nav { display: grid; }
  #main-content { padding: var(--space-4); }
}
</style>
</head>
<body>

<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar()"></div>

<div class="app-layout">

<aside class="app-sidebar" id="appSidebar">
  <div class="sidebar-brand">
    <div class="sidebar-brand-logo" id="sidebarLogo"></div>
    <div class="sidebar-brand-text">
      <h1>أمين الرضا</h1>
      <small>البوابة الموحدة</small>
    </div>
  </div>

  <div class="sidebar-user">
    <div class="sidebar-user-avatar" id="userAvatar">👤</div>
    <div>
      <div style="font-weight:600;font-size:14px;color:var(--text-primary);" id="userName">جاري...</div>
      <div style="font-size:11px;color:var(--text-secondary);" id="userRole">...</div>
    </div>
  </div>

  <nav class="sidebar-nav" id="sidebarNav"></nav>

  <div class="sidebar-footer">
    <button class="logout-btn" onclick="handleLogout()"><span id="logoutIcon"></span> تسجيل الخروج</button>
  </div>
</aside>

<main class="app-main">
  <header class="app-topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="mobile-toggle" onclick="toggleSidebar()" id="menuIcon">☰</button>
      <h2 id="pageTitle" style="font-size:var(--text-h3);margin:0;">لوحة القيادة</h2>
    </div>
    <div style="display:flex;gap:8px;">
     <button class="mobile-toggle" onclick="toggleDarkMode()" id="darkModeBtn"></button>
<button class="mobile-toggle" onclick="navigate(window.currentSection)" id="refreshBtn"></button>
    </div>
  </header>

  <div id="quick-actions-bar" class="no-print" style="background:var(--surface);border-block-end:1px solid var(--border-subtle);padding:var(--space-3) var(--space-6);display:flex;align-items:center;gap:var(--space-3);overflow-x:auto;">
    <span style="font-weight:700;color:var(--primary);display:flex;align-items:center;gap:6px;white-space:nowrap;">⚡ إجراءات سريعة:</span>
    <div id="quick-actions-buttons" style="display:flex;gap:var(--space-2);flex-wrap:nowrap;"></div>
  </div>

  <div id="main-content"></div>
</main>

</div>

<nav class="bottom-nav" id="bottomNav"></nav>

<div id="modalContainer"></div>

<script src="libs/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script src="libs/xlsx.full.min.js"></script>
  <script src="assets/amin-icons.js?v=20260706-1"></script>
<script src="assets/signature-star.js"></script>
<script src="assets/renderHelpers.js"></script>
<script src="assets/portal-app.js"></script>
<script src="assets/portal-stage2-views.js"></script>
<script src="assets/smart-alerts.js"></script>

<script src="assets/amin-theme-injector.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/amin-icons.js?v=20260706-1" defer></script>
</body>
</html>
